<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASH · LOGISTIC — Internal Ops Prototype (Mithril Final · Route + Workflow aligned)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== Dash Design System · DDS v1.0 tokens ===== */
  /* Brand — purple */
  --primary-base:#7D52F4; --primary-dark:#6E3FF3; --primary-darker:#5B2DD4;
  --primary-alpha-24:rgba(125,82,244,.24); --primary-alpha-16:rgba(125,82,244,.16); --primary-alpha-10:rgba(125,82,244,.10);
  /* Background (neutral scale) */
  --bg-white-0:#FFFFFF; --bg-weak-50:#F5F7FA; --bg-soft-200:#E1E4EA; --bg-sub-300:#CACFD8; --bg-surface-800:#222530; --bg-strong-950:#0E121B;
  /* Text */
  --text-strong-950:#0E121B; --text-sub-600:#525866; --text-soft-400:#99A0AE; --text-disabled-300:#CACFD8; --text-white-0:#FFFFFF;
  /* Stroke */
  --stroke-strong-950:#0E121B; --stroke-sub-300:#CACFD8; --stroke-soft-200:#E1E4EA; --stroke-white-0:#FFFFFF;
  /* Icon */
  --icon-strong-950:#0E121B; --icon-sub-600:#525866; --icon-soft-400:#99A0AE; --icon-disabled-300:#CACFD8;
  /* State — base / light / lighter / dark */
  --state-success-base:#38C793; --state-success-light:#CBF5E5; --state-success-lighter:#E0FAEF; --state-success-dark:#176448;
  --state-error-base:#FB3748; --state-error-light:#FFD5D8; --state-error-lighter:#FFEBEC; --state-error-dark:#710E21;
  --state-warning-base:#F6A723; --state-warning-light:#FBDFB1; --state-warning-lighter:#FEF3E1; --state-warning-dark:#B8740A;
  --state-information-base:#335CFF; --state-information-light:#C0CFFF; --state-information-lighter:#EBF1FF; --state-information-dark:#162664;
  --state-away-base:#F6B51E; --state-away-light:#FBE3A1; --state-away-lighter:#FEF6E1; --state-away-dark:#B8740A;
  --state-feature-base:#7D52F4; --state-feature-light:#CAC2FF; --state-feature-lighter:#EEE9FE; --state-feature-dark:#3A1F8A;
  --state-faded-base:#717784; --state-faded-light:#E1E4EA; --state-faded-lighter:#F5F7FA; --state-faded-dark:#222530;
  --state-verified-base:#47C2FF; --state-verified-light:#C2EBFF; --state-verified-lighter:#EAF7FF; --state-verified-dark:#0B4A6F;
  --state-stable-base:#22D3BB; --state-stable-light:#C0F2EA; --state-stable-lighter:#E6FBF7; --state-stable-dark:#0B5C52;
  --state-highlighted-base:#FB4BA3; --state-highlighted-light:#FFD0E6; --state-highlighted-lighter:#FFEBF4; --state-highlighted-dark:#7A0F45;
  /* Radius (4px-aligned) */
  --radius-8:8px; --radius-10:10px; --radius-12:12px; --radius-16:16px; --radius-20:20px; --radius-24:24px; --radius-full:9999px;
  /* Shadow (shadow-led system) */
  --shadow-regular-xs:0 1px 2px rgba(14,18,27,.05);
  --shadow-regular-sm:0 2px 4px rgba(14,18,27,.07);
  --shadow-regular-md:0 16px 32px -12px rgba(14,18,27,.12);
  --shadow-card-xs:0 1px 2px rgba(14,18,27,.04),0 0 0 1px rgba(14,18,27,.025);
  --shadow-card-md:0 16px 40px -16px rgba(14,18,27,.18);
  --shadow-card-lg:0 24px 56px -20px rgba(14,18,27,.22);
  /* Motion */
  --duration-100:100ms; --duration-200:200ms; --duration-300:300ms; --duration-500:500ms;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.4,0,.2,1);
  /* Type */
  --font-sans:'Plus Jakarta Sans',-apple-system,sans-serif; --mono:'JetBrains Mono',monospace;

  /* ===== Back-compat aliases (prototype names → DDS tokens) ===== */
  --primary-main:var(--primary-base); --primary-light:var(--state-feature-lighter); --primary-lighter:var(--primary-alpha-10);
  --success-base:var(--state-success-base); --success-light:var(--state-success-lighter); --success-dark:var(--state-success-dark);
  --warning-base:var(--state-warning-base); --warning-light:var(--state-warning-lighter);
  --error-base:var(--state-error-base); --error-light:var(--state-error-lighter);
  --information-base:var(--state-information-base); --information-light:var(--state-information-lighter);
  --faded-base:var(--state-faded-base); --faded-light:var(--state-faded-lighter); --feature-base:var(--state-feature-base);
  --bg-weak:var(--bg-weak-50); --bg-white:var(--bg-white-0); --bg-soft:#FAFBFC;
  --stroke-soft:var(--stroke-soft-200); --stroke-sub:var(--stroke-sub-300);
  --text-strong:var(--text-strong-950); --text-sub:var(--text-sub-600);
--text-main:#171717;--bg-subtle:#FAF9FD; --text-soft:var(--text-soft-400); --text-disabled:var(--text-disabled-300);
  --radius:var(--radius-10); --radius-sm:var(--radius-8); --radius-lg:var(--radius-12);
  --shadow-sm:var(--shadow-regular-xs); --shadow-md:var(--shadow-regular-md); --shadow-lg:var(--shadow-card-md);
  --sans:var(--font-sans);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg-weak);color:var(--text-strong);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11","cv02";font-variant-numeric:tabular-nums}
::selection{background:var(--primary-base);color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft)}

/* ============ LOGIN ============ */
#login{position:fixed;inset:0;z-index:100;display:flex;background:var(--bg-white)}
.login-left{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;position:relative}
.login-form{width:100%;max-width:360px}
.login-wordmark{display:flex;align-items:center;gap:9px;position:absolute;top:36px;left:40px}
.login-avatar{width:64px;height:64px;border-radius:50%;background:var(--primary-lighter);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.login-form h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:6px}
.login-form .sub{text-align:center;color:var(--text-sub);margin-bottom:28px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text-sub)}
.field input{width:100%;padding:11px 13px;border:1px solid var(--stroke-sub);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;transition:.15s}
.field input:focus{outline:none;border-color:var(--primary-main);box-shadow:0 0 0 3px var(--primary-lighter)}
.forgot{text-align:right;margin:-6px 0 18px}
.forgot a{font-size:13px;color:var(--primary-main);font-weight:600;cursor:pointer}
.btn-primary{width:100%;background:#171717;color:#fff;padding:12px;border-radius:var(--radius-10);font-weight:700;font-size:14px;transition:.15s}
.btn-primary:hover{background:#000}.btn-primary:active{background:#2a2a2a}
.login-register{text-align:center;margin-top:20px;font-size:13px;color:var(--text-sub)}
.login-register a{color:var(--primary-main);font-weight:600;cursor:pointer}
/* carousel */
.login-right{flex:1;background:linear-gradient(150deg,var(--primary-darker),var(--primary-base) 55%,#9B7BF7);display:flex;flex-direction:column;justify-content:center;padding:56px;color:#fff;position:relative;overflow:hidden}
.login-right::before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.08);top:-120px;right:-120px}
.login-right::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-80px;left:-60px}
.carousel{position:relative;z-index:1;max-width:460px}
.c-track{position:relative;min-height:220px}
.c-slide{position:absolute;inset:0;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;pointer-events:none}
.c-slide.on{opacity:1;transform:translateY(0);pointer-events:auto}
.c-quote-mark{font-size:54px;font-weight:800;line-height:.6;opacity:.35;margin-bottom:14px;font-family:Georgia,serif}
.c-quote{font-size:24px;font-weight:600;line-height:1.42;margin-bottom:22px}
.c-author{font-weight:700}
.c-role{opacity:.82;font-size:13px;margin-top:2px}
.c-dots{display:flex;gap:8px;margin-top:30px}
.c-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:.25s}
.c-dot.on{background:#fff;width:26px;border-radius:5px}

/* ============ APP SHELL ============ */
#app{display:none;height:100vh}
.shell{display:grid;grid-template-columns:248px 1fr;height:100vh}
.sidebar{background:var(--bg-white);border-right:1px solid var(--stroke-soft);display:flex;flex-direction:column;padding:20px 14px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.brand .wm{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .wm span{color:var(--faded-base);font-weight:600}
.nav-section{margin-bottom:18px}
.nav-section .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--text-soft);padding:0 8px 8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--text-sub);font-weight:500;font-size:13.5px;margin-bottom:2px;cursor:pointer;transition:.12s;position:relative}
.nav-item:hover{background:var(--bg-weak)}
.nav-item.active{background:var(--primary-lighter);color:var(--primary-main);font-weight:600}
.nav-item.active svg{color:var(--primary-main)}
.nav-item svg{width:18px;height:18px;color:var(--text-soft);flex-shrink:0}
.nav-item.soon{color:var(--text-disabled)}
.nav-item.soon svg{color:var(--text-disabled)}
.badge-soon{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--faded-light);color:var(--text-soft);text-transform:uppercase}
.badge-soon.next{background:var(--information-light);color:var(--information-base)}
.badge-soon.p1{background:var(--state-feature-lighter);color:var(--primary-dark)}
.badge-soon.p2{background:var(--bg-soft-200);color:var(--text-sub-600)}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--stroke-soft);padding-top:14px;display:flex;align-items:center;gap:10px}
.avatar-sm{width:34px;height:34px;border-radius:50%;background:var(--success-base);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sidebar-foot .who{overflow:hidden}
.sidebar-foot .who .nm{font-weight:600;font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sidebar-foot .who .em{font-size:11.5px;color:var(--text-soft);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}

.main{overflow-y:auto;background:var(--bg-weak)}
.topbar{padding:10px 32px;border-bottom:1px solid var(--stroke-soft);background:var(--bg-white);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar .crumb{font-size:12px;color:var(--text-soft);font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.topbar .crumb .dot{color:var(--primary-main)}
.topbar .spacer{flex:1}
.hamburger{display:none;width:38px;height:38px;border-radius:9px;align-items:center;justify-content:center;color:var(--text-sub);border:1px solid var(--stroke-soft)}
.hamburger svg{width:20px;height:20px}
.notif-btn{position:relative;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-sub);border:1px solid var(--stroke-soft);transition:.12s}
.notif-btn:hover{background:var(--bg-weak)}
.notif-btn svg{width:18px;height:18px}
.notif-badge{position:absolute;top:-7px;right:-9px;font-size:8px;font-weight:800;letter-spacing:.03em;padding:2px 5px;border-radius:6px;background:var(--information-base);color:#fff;text-transform:uppercase;border:2px solid #fff}

.page{padding:26px 32px 80px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:24px}
.page-head .eyebrow-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.page-head .num{color:var(--primary-main);font-weight:700;font-size:12px}
.page-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.page-head p{color:var(--text-sub);max-width:620px;font-size:13.5px}
.head-actions{display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-10);font-weight:600;font-size:13px;border:1px solid var(--stroke-sub);background:#fff;color:var(--text-strong);transition:.12s;letter-spacing:-.006em}
.btn:hover{background:var(--bg-weak)}
.btn svg{width:15px;height:15px}
.btn.primary{background:#171717;color:#fff;border-color:#171717;font-weight:700}
.btn.primary:hover{background:#000}.btn.primary:active{background:#2a2a2a}
.btn.lighter{background:var(--primary-alpha-10);color:var(--primary-dark);border-color:transparent}
.btn.lighter:hover{background:var(--primary-alpha-16)}
.btn.destructive{background:var(--state-error-base);color:#fff;border-color:var(--state-error-base)}
.btn.destructive:hover{filter:brightness(.94)}
.btn.destructive.lighter{background:var(--state-error-lighter);color:var(--state-error-dark);border-color:transparent;filter:none}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg-weak)}
.btn.xs{padding:5px 9px;font-size:11.5px;border-radius:var(--radius-8)}.btn.xs svg{width:13px;height:13px}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled,.btn.disabled{opacity:.5;pointer-events:none}

/* ============ TILES ============ */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.tiles.four{grid-template-columns:repeat(4,1fr)}
.tiles.six{grid-template-columns:repeat(6,1fr)}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tiles-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.tiles-head-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft)}
.fsec{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-soft);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--stroke-soft)}
.fsec:first-of-type{border-top:none;padding-top:0;margin-top:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.addr-pick{border:1px solid var(--stroke-sub);border-radius:12px;padding:12px;background:var(--bg-weak-50,#FAFAFB)}
.addr-search{display:flex;align-items:center;gap:8px;border:1px solid var(--stroke-sub);border-radius:9px;padding:9px 12px;background:#fff}
.addr-search svg{width:16px;height:16px;color:var(--text-soft);flex-shrink:0}
.addr-search input{flex:1;border:none;outline:none;font-size:13.5px;font-family:inherit;background:none}
.addr-map{margin-top:10px;height:96px;border-radius:9px;background:linear-gradient(135deg,#EDE9F8,#F4F1FC);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--primary-main);font-size:11.5px;border:1px dashed #D9CEF3}
.addr-map svg{width:26px;height:26px}
.addr-poi{margin-top:10px;display:flex;flex-direction:column;gap:2px;max-height:132px;overflow:auto}
.addr-poi-row{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-sub)}
.addr-poi-row:hover{background:var(--primary-lighter)}
.addr-poi-row svg{width:14px;height:14px;color:var(--text-soft);flex-shrink:0}
.addr-poi-row b{color:var(--text-main);font-weight:600}
.addr-saved-tag{font-size:9px;font-weight:700;letter-spacing:.03em;background:var(--state-feature-lighter);color:var(--primary-dark);padding:2px 7px;border-radius:5px;flex-shrink:0;text-transform:uppercase}
.addr-save{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--text-sub);cursor:pointer}
.cs-body{display:flex;gap:22px}
.cs-main{flex:2;min-width:0}
.cs-side{flex:1;min-width:210px;max-width:270px}
@media(max-width:760px){.cs-body{flex-direction:column}.cs-side{max-width:none}}
.cs-seg button.dis{color:var(--text-disabled,#B0B0B0);cursor:not-allowed;background:none;font-weight:500}
.cs-help{font-size:12.5px;font-weight:600;color:var(--primary-main);cursor:pointer;margin-left:auto;white-space:nowrap}
.cs-link{display:inline-block;font-size:12.5px;font-weight:600;color:var(--primary-main);cursor:pointer;margin-top:12px}
.pay-card{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--primary-main);border-radius:12px;padding:13px;background:var(--primary-lighter)}
.pay-ic{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary-main);flex-shrink:0}
.pay-ic svg{width:18px;height:18px}
.pay-t{font-size:13px;font-weight:700}
.pay-d{font-size:11.5px;color:var(--text-soft);margin-top:2px;line-height:1.4}
.pay-price{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px;border:1px solid var(--stroke-soft);border-radius:10px;font-size:13px}
.pay-price b{color:var(--primary-dark)}
.protect-row{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--stroke-soft);border-radius:12px;padding:13px}
.protect-t{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.protect-d{font-size:12px;color:var(--text-soft);margin-top:3px;max-width:420px}
.info-btn{width:17px;height:17px;border-radius:50%;border:1px solid var(--text-soft);color:var(--text-soft);background:none;font-size:10.5px;font-weight:700;cursor:pointer;line-height:1;font-style:italic}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;cursor:pointer;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:var(--stroke-sub);border-radius:999px;transition:.15s}
.switch input:checked+.track{background:var(--primary-main)}
.switch .track:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
.switch input:checked+.track:before{transform:translateX(18px)}
.form-legend{font-size:12px;color:var(--text-soft)}
.form-legend .req-tag{margin-right:3px}
.cs-full{position:fixed;inset:0;background:var(--bg-weak,#F4F4F5);z-index:200;display:flex;flex-direction:column}
.cs-full-head{display:flex;align-items:center;gap:14px;padding:15px 24px;background:#fff;border-bottom:1px solid var(--stroke-soft);flex-shrink:0}
.cs-full-head h2{font-size:17px;font-weight:700}
.cs-full-head .x{cursor:pointer;color:var(--text-soft);display:flex}
.cs-head-actions{margin-left:auto;display:flex;gap:10px}
.cs-hbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--stroke-soft);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-sub)}
.cs-hbtn:hover{background:var(--bg-weak)}.cs-hbtn svg{width:16px;height:16px}
.cs-full-body{flex:1;overflow:auto;display:flex;gap:22px;padding:22px;max-width:1160px;margin:0 auto;width:100%;align-items:flex-start}
.cs-panel{background:#fff;border:1px solid var(--stroke-soft);border-radius:16px;padding:22px}
.cs-main{flex:2;min-width:0}
.cs-side{flex:1;min-width:300px;max-width:360px;position:sticky;top:0}
@media(max-width:860px){.cs-full-body{flex-direction:column}.cs-side{max-width:none;width:100%;position:static}}
.pb-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;color:var(--text-sub)}
.pb-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--stroke-soft);margin-top:6px;padding-top:12px;font-size:14px}
.pb-total b{font-size:19px;color:var(--text-main)}
.prot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.prot-card{position:relative;border:1.5px solid var(--stroke-soft);border-radius:12px;padding:13px;cursor:pointer}
.prot-card.sel{border-color:var(--primary-main);background:var(--primary-lighter)}
.prot-radio{position:absolute;top:12px;right:12px;width:16px;height:16px;border-radius:50%;border:2px solid var(--stroke-sub)}
.prot-card.sel .prot-radio,.prot-radio.sel{border-color:var(--primary-main)}
.prot-card.sel .prot-radio::after,.prot-radio.sel::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary-main)}
.prot-t{font-weight:700;font-size:13.5px;margin-top:2px}
.prot-p{font-size:13px;color:var(--primary-dark);font-weight:700;margin-top:2px}
.prot-cov{font-size:11px;color:var(--text-soft);margin-top:8px;line-height:1.4}.prot-cov b{color:var(--text-main)}
.ord-card{border:1px solid var(--stroke-soft);border-radius:14px;padding:16px;margin-bottom:14px}
.ord-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ord-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.ord-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:999px;background:var(--primary-lighter);color:var(--primary-dark);font-size:11px;font-weight:700;padding:0 6px}
.ord-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--stroke-soft);font-size:13px}.ord-line:last-child{border-bottom:none}
.combine-card{display:flex;align-items:center;gap:12px;border:1px solid var(--primary-lighter);background:var(--primary-lighter);border-radius:14px;padding:14px;margin-bottom:16px}
.cbc-ic{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary-main);flex-shrink:0}.cbc-ic svg{width:20px;height:20px}
.cbc-t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cbc-new{font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--primary-dark);background:#fff;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.cbc-d{font-size:12px;color:var(--text-soft);margin-top:2px}
.cs-review-foot{display:flex;align-items:center;gap:12px;margin-top:8px}
.tiles.six .tile{padding:13px 13px}
.tile{background:#fff;border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:15px 16px;cursor:pointer;transition:.14s;box-shadow:var(--shadow-card-xs)}
.tile:hover{box-shadow:var(--shadow-regular-sm);border-color:var(--stroke-sub)}
.tile.sel{border-color:var(--primary-main);box-shadow:0 0 0 2px var(--primary-lighter)}
.tile .tl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:10px}
.tile .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tile .val{font-size:26px;font-weight:800;letter-spacing:-.02em}
.dot-feature{background:var(--feature-base)}.dot-info{background:var(--information-base)}
.dot-success{background:var(--success-base)}.dot-error{background:var(--error-base)}
.dot-faded{background:var(--faded-base)}
.dot-away{background:var(--state-away-base)}
.ret-arrow{display:inline-block;margin-left:6px;font-weight:800;color:var(--state-away-base);font-size:13px}
tr.rev-row{background:var(--state-away-lighter,#FBF6EF)}
tr.rev-row .ret-arrow{margin-left:0}
tr.grp td{background:var(--bg-weak,#F6F6F6);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-soft,#8A8A8A);padding:6px 12px}
.pod-gallery{display:flex;flex-wrap:wrap;gap:10px}
.pod-cell{cursor:pointer;width:96px}
.pod-img{width:96px;height:76px;border-radius:8px;background:var(--bg-weak,#F4F4F5);border:1px solid var(--border,#E5E5E5);display:flex;align-items:center;justify-content:center;color:var(--text-soft,#9A9A9A);transition:.12s}
.pod-cell:hover .pod-img{border-color:var(--primary-main,#5E2AAC);color:var(--primary-main,#5E2AAC)}
.pod-lbl{display:block;font-size:11px;color:var(--text-sub,#666);margin-top:5px;text-align:center}.dot-warning{background:var(--warning-base)}
.pod-group{margin-top:14px}.pod-group:first-child{margin-top:0}
.pod-group-lbl{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--text-sub);margin-bottom:8px}
.pod-group-lbl .pg-count{font-size:10px;font-weight:700;color:var(--primary-dark);background:var(--state-feature-lighter);padding:1px 7px;border-radius:20px}
.pod-group-lbl .pg-opt{font-size:10px;font-weight:600;color:var(--text-soft);text-transform:none;letter-spacing:0}
.pod-row{display:flex;flex-wrap:wrap;gap:10px}
.size-seg{display:inline-flex;border:1px solid var(--stroke-sub);border-radius:10px;padding:3px;gap:3px;background:var(--bg-weak)}
.size-seg button{padding:9px 0;width:52px;border-radius:7px;font-size:13px;font-weight:700;color:var(--text-sub);transition:.12s}
.size-seg button.on{background:#fff;color:var(--primary-dark);box-shadow:var(--shadow-regular-xs)}
.size-hint{font-size:11px;color:var(--text-soft);margin-top:6px}
.addr-saved-lbl{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text-soft);margin:12px 0 6px}
.del-svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.del-svc-card{display:flex;align-items:center;gap:10px;padding:12px 13px;border:1.5px solid var(--stroke-sub);border-radius:12px;cursor:pointer;transition:.12s}
.del-svc-card.on{border-color:var(--primary-main);background:var(--primary-lighter)}
.del-svc-ic{width:34px;height:34px;border-radius:8px;background:var(--bg-weak);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-sub)}
.del-svc-card.on .del-svc-ic{background:var(--state-feature-lighter);color:var(--primary-main)}
.del-svc-ic svg{width:17px;height:17px}
.del-svc-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--stroke-sub);flex-shrink:0;position:relative}
.del-svc-radio.on{border-color:var(--primary-main)}
.del-svc-radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary-main)}
.del-now-card{display:flex;align-items:flex-start;gap:13px;padding:13px 14px;border-radius:12px;background:var(--state-feature-lighter);border:1px solid var(--state-feature-light,#ddd6fe);margin-bottom:14px}
.del-now-ic{width:36px;height:36px;border-radius:8px;background:var(--primary-main);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.del-now-ic svg{width:18px;height:18px}
.del-date-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.del-date-strip::-webkit-scrollbar{display:none}
.del-date-item{min-width:56px;padding:9px 0 7px;border-radius:11px;text-align:center;cursor:pointer;border:1.5px solid var(--stroke-sub);flex-shrink:0;transition:.12s}
.del-date-item.on{background:var(--primary-main);border-color:var(--primary-main);color:#fff}
.del-date-dow{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.7;letter-spacing:.04em}
.del-date-d{font-size:22px;font-weight:800;line-height:1.1;margin:1px 0}
.del-date-mo{font-size:10px;opacity:.65}
.del-slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;max-height:232px;overflow-y:auto;padding-right:2px;scroll-behavior:smooth}
.del-slot-grid::-webkit-scrollbar{width:4px}.del-slot-grid::-webkit-scrollbar-track{background:transparent}.del-slot-grid::-webkit-scrollbar-thumb{background:var(--stroke-sub);border-radius:4px}
.del-slot-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1.5px solid var(--stroke-sub);border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.12s}
.del-slot-item.on{border-color:var(--primary-main);background:var(--primary-lighter);color:var(--primary-dark)}
.del-slot-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--stroke-sub);flex-shrink:0;position:relative}
.del-slot-item.on .del-slot-radio{border-color:var(--primary-main)}
.del-slot-item.on .del-slot-radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary-main)}
.pkg-card{border:1px solid var(--stroke-sub);border-radius:12px;padding:14px;margin-bottom:12px}
.pkg-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pkg-card-head .pc-t{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-soft)}
.pc-del{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--error-base);cursor:pointer}
.pc-del svg{width:14px;height:14px}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.pkg-grid .span2{grid-column:1/-1}

/* ============ CARD / TABLE ============ */
.card{background:#fff;border:1px solid var(--stroke-soft);border-radius:var(--radius-12);overflow:hidden;box-shadow:var(--shadow-card-xs)}
.tabs{display:flex;gap:4px;padding:14px 18px 0;border-bottom:1px solid var(--stroke-soft);overflow-x:auto}
.tab{padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--text-strong)}
.tab.active{color:var(--text-strong-950);border-bottom-color:var(--primary-base)}
.tab .cnt{background:var(--bg-weak);color:var(--text-sub);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
.tab.active .cnt{background:var(--primary-lighter);color:var(--primary-main)}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:12px;border-bottom:1px solid var(--stroke-soft);flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:420px;position:relative}
.search input{width:100%;padding:9px 13px 9px 36px;border:1px solid var(--stroke-sub);border-radius:8px;font-size:13px;font-family:inherit}
.search input:focus{outline:none;border-color:var(--primary-main);box-shadow:0 0 0 3px var(--primary-lighter)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-soft)}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-soft);border:1px solid var(--stroke-soft);border-radius:5px;padding:1px 6px;font-family:var(--mono)}
.toolbar-r{display:flex;gap:9px;align-items:center}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:920px}
thead th{text-align:left;padding:11px 14px;font-size:11.5px;font-weight:700;color:var(--text-soft);letter-spacing:.02em;border-bottom:1px solid var(--stroke-soft);white-space:nowrap;background:var(--bg-soft)}
tbody td{padding:13px 14px;border-bottom:1px solid var(--stroke-soft);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--state-feature-lighter)}
tbody tr:last-child td{border-bottom:none}
td .lk{color:var(--primary-main);font-weight:600;font-family:var(--mono);font-size:12.5px}
td .muted{color:var(--text-soft);font-size:12px}
td .strong{font-weight:600}
.col-check{width:36px}
.sticky-l{position:sticky;left:0;background:#fff;z-index:2}
thead .sticky-l{background:var(--bg-soft)}
tbody tr:hover .sticky-l{background:var(--state-feature-lighter)}

/* pills — INTERNAL logistic-platform status set (Phase 0) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:0}
.pill .d{width:5px;height:5px;border-radius:50%}
.pill-created{background:var(--state-faded-light);color:var(--state-faded-dark)}.pill-created .d{background:var(--state-faded-base)}
.pill-allocated{background:var(--primary-alpha-10);color:var(--primary-dark)}.pill-allocated .d{background:var(--primary-base)}
.pill-pickedup{background:var(--state-away-light);color:var(--state-away-dark)}.pill-pickedup .d{background:var(--state-away-base)}
.pill-ondelivery{background:var(--state-information-light);color:var(--state-information-dark)}.pill-ondelivery .d{background:var(--state-information-base)}
.pill-completed{background:var(--state-success-light);color:var(--state-success-dark)}.pill-completed .d{background:var(--state-success-base)}
.pill-failed{background:var(--state-error-light);color:var(--state-error-dark)}.pill-failed .d{background:var(--state-error-base)}
.pill-cancelled{background:var(--state-faded-lighter);color:var(--state-faded-base)}.pill-cancelled .d{background:var(--state-faded-base)}
.pill-returned{background:var(--state-away-light);color:var(--state-away-dark)}.pill-returned .d{background:var(--state-away-base)}
/* invoice + shipment pills */
.pill-shipcreated{background:var(--state-information-light);color:var(--state-information-dark)}.pill-shipcreated .d{background:var(--state-information-base)}
.pill-await{background:var(--state-away-light);color:var(--state-away-dark)}.pill-await .d{background:var(--state-away-base)}
.pill-disputed{background:var(--state-error-light);color:var(--state-error-dark)}.pill-disputed .d{background:var(--state-error-base)}
.pill-resolved{background:var(--state-success-light);color:var(--state-success-dark)}.pill-resolved .d{background:var(--state-success-base)}
.pill-ontime{background:var(--success-light);color:var(--success-dark)}
.pill-late{background:var(--error-light);color:var(--error-base)}
.pill-sla{background:var(--bg-weak);color:var(--text-sub)}
.aging-g{background:var(--success-light);color:var(--success-dark)}.aging-g .d{background:var(--success-base)}
.aging-a{background:var(--warning-light);color:#B8740A}.aging-a .d{background:var(--warning-base)}
.aging-r{background:var(--error-light);color:var(--error-base)}.aging-r .d{background:var(--error-base)}

.pager{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-top:1px solid var(--stroke-soft);font-size:12.5px;color:var(--text-sub);flex-wrap:wrap;gap:10px}
.pager-btns{display:flex;gap:4px;align-items:center}
.pager-btns button{padding:5px 10px;border:1px solid var(--stroke-soft);border-radius:6px;font-size:12px;color:var(--text-sub);font-weight:600}
.pager-btns button.on{background:var(--primary-main);color:#fff;border-color:var(--primary-main)}
.pager-btns button:disabled{opacity:.4;cursor:default}
.psel{padding:5px 8px;border:1px solid var(--stroke-soft);border-radius:6px;font-family:inherit;font-size:12px}

/* ============ FULL-PAGE DETAIL (deliveries) ============ */
.detail-top{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--text-sub);padding:8px 12px;border-radius:8px;border:1px solid var(--stroke-soft);background:#fff}
.back-btn:hover{background:var(--bg-weak)}
.back-btn svg{width:15px;height:15px}
.detail-id h1{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.detail-id .sub{color:var(--text-soft);font-size:12.5px;font-family:var(--mono);margin-top:3px}
.detail-id .sub b{color:var(--text-sub);font-weight:600}
.detail-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
.dcard{background:#fff;border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-card-xs)}
.dcard h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft);margin-bottom:14px}
.kv{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;font-size:13.5px;gap:16px}
.kv .k{color:var(--text-sub)}
.kv .v{font-weight:600;text-align:right}
.kv .v.mono{font-family:var(--mono);font-size:12.5px}

/* route */
.route-node{display:flex;gap:13px;padding-bottom:18px;position:relative}
.route-node:last-child{padding-bottom:0}
.route-node:not(:last-child)::before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--stroke-soft)}
.route-ic{width:18px;height:18px;border-radius:50%;border:2px solid;flex-shrink:0;margin-top:2px;background:#fff;z-index:1}
.route-ic.o{border-color:var(--primary-main)}
.route-ic.d{border-color:var(--success-base);background:var(--success-base)}
.route-node .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-soft);text-transform:uppercase}
.route-node .nm{font-weight:600;margin-top:2px}
.route-node .geo{font-family:var(--mono);font-size:11.5px;color:var(--text-soft);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.route-node .geo a{color:var(--primary-main);cursor:pointer}

/* DATA BARANG — clean list */
.goods-list{border:1px solid var(--stroke-soft);border-radius:var(--radius);overflow:hidden}
.goods-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 15px;align-items:center;border-bottom:1px solid var(--stroke-soft)}
.goods-row:last-child{border-bottom:none}
.goods-row:nth-child(even){background:var(--bg-soft)}
.goods-main .item-no{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--text-strong)}
.goods-main .item-name{font-size:12.5px;color:var(--text-sub);margin-top:2px}
.goods-meta{display:flex;gap:18px;align-items:center;text-align:right}
.goods-meta .mc{font-size:11px;color:var(--text-soft)}
.goods-meta .mc b{display:block;font-size:13px;color:var(--text-strong);font-weight:700;margin-top:1px;font-family:var(--mono)}
.goods-head{display:grid;grid-template-columns:1fr auto;padding:9px 15px;background:var(--bg-weak);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);border-bottom:1px solid var(--stroke-soft)}
.goods-head .gh-r{display:flex;gap:18px}
.goods-head .gh-r span,.goods-meta .mc{min-width:58px;text-align:right;display:inline-block}

/* invoice info box */
.inv-box{background:var(--bg-soft);border:1px solid var(--stroke-soft);border-radius:var(--radius);padding:14px 16px}
.inv-box .row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.inv-box .row .k{color:var(--text-sub)}
.inv-box .row .v{font-weight:600}

/* timeline */
.tl-event{display:flex;gap:13px;padding-bottom:20px;position:relative}
.tl-event:last-child{padding-bottom:0}
.tl-event:not(:last-child)::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--stroke-soft)}
.tl-event.done:not(:last-child)::before{background:var(--success-base)}
.tl-ic{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:2px;z-index:1;border:2px solid var(--stroke-sub);background:#fff}
.tl-ic.done{background:var(--success-base);border-color:var(--success-base)}
.tl-ic.now{background:var(--primary-main);border-color:var(--primary-main);box-shadow:0 0 0 4px var(--primary-lighter)}
.tl-ic.bad{background:var(--error-base);border-color:var(--error-base)}
.tl-event .ttl{font-weight:600;font-size:13.5px}
.tl-event .tm{font-size:11.5px;color:var(--text-soft);font-family:var(--mono);margin-top:2px}
.tl-event .cap{font-size:12px;color:var(--text-sub);margin-top:4px}
.proof-thumb{margin-top:10px;width:130px;height:96px;border-radius:8px;border:1px solid var(--stroke-soft);background:linear-gradient(135deg,#E1E4EA,#F3F4F6);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.proof-thumb:hover{border-color:var(--primary-main)}
.proof-thumb .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(14,18,27,.72);color:#fff;font-size:9px;padding:3px 6px;font-family:var(--mono)}
.proof-thumb svg{width:26px;height:26px;color:var(--text-soft)}
.pkg-pod{display:inline-flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid var(--stroke-soft);border-radius:8px;background:linear-gradient(135deg,#EEF0F3,#F8F9FB);cursor:pointer;transition:border-color .12s,background .12s}
.pkg-pod:hover{border-color:var(--primary-main);background:var(--primary-lighter,#EEE9FE)}
.pkg-pod svg{width:18px;height:18px;color:var(--text-soft);flex:none}
.pkg-pod:hover svg{color:var(--primary-base)}
.pkg-pod.ret svg{color:var(--state-feature-base,#7D52F4)}
.pkg-pod-tx{display:flex;flex-direction:column;line-height:1.2}
.pkg-pod-l{font-size:11px;font-weight:700;color:var(--text-main);white-space:nowrap}
.pkg-pod-note{font-size:9.5px;color:var(--text-soft);font-weight:600;margin-top:1px;white-space:nowrap}
.pkg-pod-empty{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-soft);font-weight:600;white-space:nowrap}
.pkg-pod-empty svg{width:14px;height:14px;flex:none;opacity:.7}

.sla-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sla-card{border:1px solid var(--stroke-soft);border-radius:var(--radius);padding:12px 14px}
.sla-card .lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-soft);text-transform:uppercase;margin-bottom:8px}
.sla-card .tm{font-family:var(--mono);font-size:12.5px;margin-bottom:8px}
.mapbox{height:150px;border-radius:10px;background:linear-gradient(135deg,#E8EDFF,#EEE9FE);display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:12px;margin-bottom:12px}

/* ============ DRAWER (shipment + invoice) ============ */
.scrim{position:fixed;inset:0;background:rgba(14,18,27,.4);z-index:200;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:94vw;background:#fff;z-index:201;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:var(--shadow-card-lg);border-radius:var(--radius-16) 0 0 var(--radius-16)}
.drawer.show{transform:translateX(0)}
.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--stroke-soft);padding:20px 24px;z-index:5}
.drawer-head .top{display:flex;justify-content:space-between;align-items:flex-start}
.drawer-head .x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);cursor:pointer}
.drawer-head .x:hover{background:var(--bg-weak)}
.drawer-pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.drawer-head h2{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.01em}
.drawer-head .sub{color:var(--text-soft);font-size:12.5px;margin-top:3px;font-family:var(--mono)}
.drawer-head .sub b{color:var(--text-sub);font-weight:600}
.drawer-body{padding:8px 24px 32px}
.sec{padding:18px 0;border-bottom:1px solid var(--stroke-soft)}
.sec:last-child{border-bottom:none}
.sec h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft);margin-bottom:14px}
.party-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.party{border:1px solid var(--stroke-soft);border-radius:var(--radius);padding:13px 15px}
.party .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-soft);text-transform:uppercase;margin-bottom:8px}
.party .nm{font-weight:600;font-size:14px}
.party .meta{font-size:12px;color:var(--text-sub);margin-top:3px;line-height:1.5}

/* ============ MODALS ============ */
.modal-scrim{position:fixed;inset:0;background:rgba(14,18,27,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
.modal-scrim.show{display:flex}
.modal{background:#fff;border-radius:var(--radius-16);width:520px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-card-lg)}
.modal-head{padding:22px 24px 0;display:flex;gap:13px;align-items:flex-start}
.modal-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-ic.green{background:var(--success-light);color:var(--success-dark)}
.modal-ic.red{background:var(--error-light);color:var(--error-base)}
.modal-ic.purple{background:var(--primary-lighter);color:var(--primary-main)}
.modal-ic svg{width:20px;height:20px}
.dev-select{width:100%;padding:11px 13px;border:1px solid var(--stroke-sub);border-radius:10px;font-size:14px;font-family:inherit;background:var(--bg-white);cursor:pointer;color:var(--text-main)}
.dev-select:focus{outline:none;border-color:var(--primary-main);box-shadow:0 0 0 3px var(--primary-lighter)}
.modal-head h3{font-size:17px;font-weight:700}
.modal-head .sub{font-size:12.5px;color:var(--text-sub);margin-top:2px;font-family:var(--mono)}
.modal-body{padding:18px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--stroke-soft);display:flex;justify-content:flex-end;gap:10px;background:var(--bg-soft)}
.lbl-field{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text-sub)}
input.sel-field,textarea,select.sel-field{width:100%;padding:11px 13px;border:1px solid var(--stroke-sub);border-radius:10px;font-family:inherit;font-size:13.5px;resize:vertical;background:#fff;color:var(--text-strong-950);transition:border-color .15s,box-shadow .15s}
input.sel-field::placeholder,textarea::placeholder{color:var(--text-soft-400)}
input.sel-field:focus,textarea:focus,select.sel-field:focus{outline:none;border-color:var(--primary-base);box-shadow:0 0 0 3px var(--primary-lighter)}
.char-count{font-size:11px;color:var(--text-soft);text-align:right;margin-top:4px}
.dropzone{border:1.5px dashed var(--stroke-sub);border-radius:10px;padding:24px;text-align:center;color:var(--text-soft);cursor:pointer;transition:.12s}
.dropzone:hover{border-color:var(--primary-main);background:var(--primary-lighter)}
.dropzone svg{width:28px;height:28px;margin-bottom:8px}
.optional-tag{font-size:11px;font-weight:600;color:var(--text-soft);background:var(--bg-weak);padding:1px 7px;border-radius:5px;margin-left:6px}
.req-tag{font-size:11px;font-weight:600;color:var(--error-base);margin-left:4px}
.import-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.import-stat .s{border:1px solid var(--stroke-soft);border-radius:10px;padding:14px}
.import-stat .s .v{font-size:24px;font-weight:800}
.import-stat .s .l{font-size:11.5px;color:var(--text-sub);margin-top:2px}
.import-stat .s.ok .v{color:var(--success-dark)}
.sample-table{font-size:12px;border:1px solid var(--stroke-soft);border-radius:8px;overflow:hidden;margin-top:10px}
.sample-table table{min-width:0}
.tmpl-link{display:inline-flex;align-items:center;gap:6px;color:var(--primary-main);font-weight:600;font-size:12.5px;margin-top:10px;cursor:pointer}

/* toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:480px}
.toast{background:var(--text-strong);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:9px;animation:toastin .25s}
.toast svg{width:16px;height:16px;flex-shrink:0}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* filter drawer */
.filter-drawer{width:400px}
.filter-sec{padding:16px 0;border-bottom:1px solid var(--stroke-soft)}
.filter-sec h4{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);margin-bottom:11px}
.fl-head{display:flex;justify-content:space-between;align-items:center}
.fl-head h4{margin-bottom:0}
.fl-search{display:flex;align-items:center;gap:8px;border:1px solid var(--stroke-sub);border-radius:var(--radius-8);padding:8px 11px;margin:11px 0 8px}
.fl-search svg{width:15px;height:15px;color:var(--text-soft);flex-shrink:0}
.fl-search input{border:none;outline:none;width:100%;font-family:inherit;font-size:13px;background:transparent}
.fl-list{max-height:230px;overflow-y:auto;border:1px solid var(--stroke-soft);border-radius:var(--radius-8);padding:4px}
.fl-glabel{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);padding:9px 8px 4px}
.fl-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--radius-8);cursor:pointer;font-size:13px;color:var(--text-strong)}
.fl-row:hover{background:var(--bg-weak)}
.fl-row input{width:15px;height:15px;accent-color:var(--primary-base);cursor:pointer}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border:1px solid var(--stroke-sub);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--primary-main)}
.chip.on{background:var(--primary-main);color:#fff;border-color:var(--primary-main)}
.date-row{display:flex;align-items:center;gap:10px}
.date-row input{flex:1;padding:9px 11px;border:1px solid var(--stroke-sub);border-radius:8px;font-family:inherit;font-size:13px}
.filter-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--stroke-soft);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.reset-link{color:var(--text-soft);font-weight:600;font-size:13px;cursor:pointer}

.hint{font-size:12px;color:var(--text-soft);margin-top:12px;display:flex;gap:7px;align-items:flex-start;background:var(--bg-weak);padding:9px 12px;border-radius:8px}
.hint svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}

/* coming soon / phase-1 preview page */
.soon-banner{display:flex;gap:12px;align-items:center;background:var(--information-light);border:1px solid #C9D6FF;border-radius:var(--radius);padding:14px 18px;margin-bottom:22px}
.soon-banner.p1{background:var(--state-feature-lighter);border-color:#D9CFFB}
.soon-banner.p1 .ic{color:var(--primary-dark)}
.soon-banner.p1 .tx{color:#4A2E9E}
.soon-banner.p1 .tx b{color:var(--primary-dark)}
.lbl-seg{display:inline-flex;border:1px solid var(--stroke-soft);border-radius:var(--radius-8);padding:3px;gap:3px;margin-bottom:16px;background:var(--bg-weak)}
.lbl-seg button{padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-sub);transition:.12s}
.lbl-seg button.on{background:#fff;color:var(--text-strong);box-shadow:var(--shadow-regular-xs)}
.lbl-preview{display:flex;gap:20px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:22px;background:var(--bg-weak-50);border-radius:var(--radius-12);border:1px solid var(--stroke-soft-200)}
.lbl-doc{width:330px;min-height:330px;background:#fff;border:1.5px solid #0E121B;border-radius:6px;padding:14px 16px 10px;display:flex;flex-direction:column;font-family:var(--sans);box-shadow:var(--shadow-card-xs)}
.tl-head{display:flex;align-items:center;gap:8px;border-bottom:2px solid #0E121B;padding-bottom:8px}
.tl-head img{width:22px;height:22px;object-fit:contain}
.tl-wm{font-size:16px;font-weight:800;font-style:italic;letter-spacing:-.02em;color:#0E121B}
.tl-name-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:2px solid #0E121B}
.tl-name{font-size:17px;font-weight:800;color:#0E121B;line-height:1.15}
.tl-code{font-size:11px;color:#0E121B;margin-top:2px}
.tl-right{text-align:right;flex-shrink:0}
.tl-pageno{display:inline-block;border:1.5px solid #0E121B;border-radius:6px;padding:3px 10px;font-size:15px;font-weight:800;color:#0E121B}
.tl-group{font-size:9px;font-weight:700;color:#0E121B;margin-top:6px;letter-spacing:.02em}
.tl-body{display:flex;gap:12px;flex:1;padding:12px 0}
.tl-parties{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.tl-p .t{font-size:9px;font-weight:800;letter-spacing:.08em;color:#0E121B}
.tl-p .nm{font-size:12px;font-weight:700;color:#0E121B;margin-top:3px}
.tl-p .ad{font-size:11px;color:#0E121B;line-height:1.35;margin-top:3px}
.tl-qr{width:118px;height:118px;flex-shrink:0}
.tl-qr svg,.tl-qr canvas,.tl-qr img{width:118px;height:118px}
.tl-foot{display:flex;justify-content:space-between;border-top:1.5px dashed #0E121B;padding-top:8px}
.tl-foot .t{font-size:9px;font-weight:800;letter-spacing:.06em;color:#0E121B}
.tl-foot .v{font-size:12px;font-weight:700;color:#0E121B;margin-top:3px}
.lbl-top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0E121B;padding-bottom:10px}
.lbl-courier{display:flex;align-items:center;gap:7px}
.lbl-courier img{width:26px;height:26px;object-fit:contain}
.lbl-cw{font-size:13px;font-weight:800;letter-spacing:.02em;color:#0E121B}
.lbl-cw b{color:var(--primary-base);font-weight:800}
.lbl-brand{text-align:right;font-size:11px;font-weight:700;color:#0E121B;max-width:120px;line-height:1.25}
.lbl-brand span{display:block;font-size:8px;letter-spacing:.1em;color:var(--text-soft-400);font-weight:800}
.lbl-qrwrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 12px;border-bottom:1.5px dashed #0E121B}
.lbl-poText{font-family:var(--mono);font-size:13.5px;font-weight:800;letter-spacing:.02em;color:#0E121B;word-break:break-all;text-align:center;line-height:1.25;max-width:100%}
.lbl-rows{display:flex;flex-direction:column;flex:1;padding-top:4px}
.lbl-row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--stroke-sub-300)}
.lbl-row .t{font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft-400);font-weight:800}
.lbl-row .v{font-size:10.5px;color:#0E121B;font-weight:600;line-height:1.3;word-break:break-word}
.lbl-foot{margin-top:10px;border-top:1.5px solid #0E121B;padding-top:7px;font-family:var(--mono);font-size:8px;color:var(--text-soft-400);text-align:center;line-height:1.5}
.lbl-stack{width:300px;min-height:450px;border:1.5px dashed var(--stroke-sub-300);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-soft-400);font-size:12px;text-align:center;padding:18px}
.lbl-stack-n{font-size:30px;font-weight:800;color:var(--primary-base)}
.soon-banner .ic{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--information-base);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.soon-banner .ic svg{width:20px;height:20px}
.soon-banner .tx{font-size:13px;color:#27408B}
.soon-banner .tx b{color:var(--information-base)}
.preview-note{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--information-base);background:var(--information-light);padding:3px 9px;border-radius:6px;display:inline-block;margin-bottom:8px}
.badge-big{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:8px;background:var(--information-light);color:var(--information-base)}
.opt-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--stroke-soft);border-radius:var(--radius);padding:13px 15px}
.opt .oi{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt .oi svg{width:16px;height:16px}
.opt .ot{font-weight:700;font-size:13.5px}
.opt .od{font-size:12.5px;color:var(--text-sub);margin-top:2px}

/* settings */
.settings-card{background:#fff;border:1px solid var(--stroke-soft);border-radius:var(--radius-12);max-width:640px;overflow:hidden;box-shadow:var(--shadow-card-xs)}
.settings-card .sc-head{padding:18px 22px;border-bottom:1px solid var(--stroke-soft);font-weight:700}
.settings-card .sc-body{padding:22px}
.profile-row{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.profile-row .pa{width:60px;height:60px;border-radius:50%;background:var(--success-base);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.ro-field{margin-bottom:16px}
.ro-field .k{font-size:12px;color:var(--text-soft);font-weight:600;margin-bottom:5px}
.ro-field .v{font-size:14px;font-weight:600;padding:10px 12px;background:var(--bg-weak);border-radius:8px;border:1px solid var(--stroke-soft)}
.role-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:8px;background:var(--primary-lighter);color:var(--primary-main);font-weight:700;font-size:12px}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(14,18,27,.85);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}
.lightbox.show{display:flex}
.lightbox .lb-inner{max-width:540px;width:100%}
.lb-img{aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,#3a3f4a,#1f232b);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#6b7280}
.lb-wm{position:absolute;bottom:14px;left:16px;right:16px;background:none;color:#fff;font-family:var(--sans);font-size:13px;line-height:1.45;display:flex;flex-direction:column;align-items:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 1px rgba(0,0,0,.9);font-weight:500}
.lb-wm span{display:block}
.lb-verified{font-size:10px;font-weight:700;padding:4px 9px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;background:var(--success-base);color:#fff}
.lb-corner{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lb-tag{background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.01em;display:inline-flex;align-items:center;gap:5px}
.lb-cap{color:#fff;margin-top:14px;font-size:12.5px;text-align:center;opacity:.85}

/* phase preview — lifecycle flow strip */
.flow-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--stroke-soft);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.flow-node{padding:13px 14px;border-right:1px solid var(--stroke-soft);position:relative}
.flow-node:last-child{border-right:none}
.flow-node .fn-step{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--primary-main);margin-bottom:6px}
.flow-node .fn-title{font-weight:700;font-size:13px;margin-bottom:4px}
.flow-node .fn-desc{font-size:11.5px;color:var(--text-sub);line-height:1.45}
@media(max-width:760px){.flow-strip{grid-template-columns:1fr}.flow-node{border-right:none;border-bottom:1px solid var(--stroke-soft)}.flow-node:last-child{border-bottom:none}}

/* mobile slider menu */
.mobile-scrim{position:fixed;inset:0;background:rgba(14,18,27,.45);z-index:55;opacity:0;pointer-events:none;transition:.2s}
.mobile-scrim.show{opacity:1;pointer-events:auto}

@media(max-width:900px){
  .detail-cols{grid-template-columns:1fr}
  .tiles,.tiles.six{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:264px;transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .topbar{padding:10px 16px}
  .page{padding:20px 16px 80px}
  .tiles,.tiles.four,.tiles.six{grid-template-columns:repeat(2,1fr)}
  .page-head{flex-direction:column;gap:14px}
  .head-actions{justify-content:flex-start}
  .page-head h1{font-size:24px}
  .login-right{display:none}
  .login-left{padding:28px 22px}
  .party-grid{grid-template-columns:1fr}
  .sla-strip{grid-template-columns:1fr}
  .goods-meta{gap:12px}
  .modal{border-radius:var(--radius-16)}
}
@media(max-width:420px){
  .tiles,.tiles.four{grid-template-columns:1fr 1fr}
  .goods-row{grid-template-columns:1fr}
  .goods-meta{justify-content:flex-start;text-align:left;margin-top:8px}
}
.claim-hero{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--success-dark);letter-spacing:-.02em;margin:2px 0 2px}
.stm-block{border:1px solid var(--stroke-soft);border-radius:10px;margin-bottom:12px;overflow:hidden}
.stm-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg-weak);border-bottom:1px solid var(--stroke-soft)}
.stm-h .wb{font-size:13px;font-weight:700;color:var(--text-strong)}
.stm-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--stroke-soft)}
.stm-line:last-child{border-bottom:none}
.stm-line .dl{color:var(--text-sub)}
.stm-line .strike{text-decoration:line-through;color:var(--text-soft);font-family:var(--mono)}
.chip-flat{background:var(--bg-soft-200);color:var(--text-sub-600);font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--radius-8);margin-left:8px}
.item-card{padding:12px 0;border-bottom:1px solid var(--stroke-soft-200)}
.item-card:last-child{border-bottom:0}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px}
.item-code{font-size:12.5px;font-weight:700;color:var(--text-strong-950);word-break:break-all;line-height:1.3}
.item-sub{font-size:12.5px;color:var(--text-sub-600);font-family:var(--mono)}

.pod-img svg{width:26px;height:26px}
.pod-lbl{display:block;font-size:10.5px;color:var(--text-soft);margin-top:5px}
.proof-empty{display:flex;align-items:center;gap:9px;color:var(--text-soft);font-size:12.5px;padding:18px;border:1px dashed var(--stroke-sub);border-radius:12px}
.proof-empty svg{width:20px;height:20px}
/* return */
.ret-fault{font-size:11px;font-weight:600;padding:2px 9px;border-radius:var(--radius-full)}
.ret-fault-dash{background:var(--state-information-lighter);color:var(--state-information-dark)}
.ret-fault-client{background:var(--state-away-lighter);color:var(--state-away-dark)}
.ret-fault-dc{background:var(--primary-lighter);color:var(--primary-base)}
.ret-fault-tbd{background:var(--bg-soft-200);color:var(--text-sub-600)}
.ro-banner{display:flex;gap:9px;align-items:flex-start;background:var(--bg-weak,#f7f7f7);border:1px solid var(--stroke-soft);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--text-sub);margin-bottom:12px}
.ro-banner svg{width:16px;height:16px;flex-shrink:0;color:var(--text-soft);margin-top:1px}
.chip-flat{font-size:10.5px;font-weight:700;background:var(--state-away-light);color:var(--state-away-dark);padding:2px 9px;border-radius:var(--radius-full)}
/* reason reference */
.reason-tbl{width:100%;border-collapse:collapse;margin-top:10px}
.reason-tbl th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-soft);padding:7px 8px;border-bottom:1px solid var(--stroke-soft)}
.reason-tbl td{font-size:12px;padding:8px;border-bottom:1px solid var(--bg-soft-200);vertical-align:top}
.reason-tbl tr.grp td{background:var(--bg-weak,#f7f7f7);font-weight:700;font-size:11px;color:var(--text-sub)}
/* print label modal */
.lbl-fmt{display:inline-flex;gap:4px;background:var(--bg-weak-50);border-radius:10px;padding:4px;margin-bottom:16px}
.lbl-fmt button{border:none;background:none;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--text-soft-400);cursor:pointer;border-radius:7px}
.lbl-fmt button.on{background:#fff;color:var(--text-strong-950);box-shadow:0 1px 2px rgba(23,23,23,.08)}
.lbl-preview{display:flex;gap:14px}
.lbl-card{flex:1;border:1px solid #171717;border-radius:8px;padding:13px;font-size:11px;line-height:1.4}
.lbl-card .lc-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--stroke-soft);padding-bottom:8px;margin-bottom:9px}
.lbl-badge{border:1px solid var(--stroke-sub);border-radius:6px;padding:2px 7px;font-weight:700;font-size:10.5px;white-space:nowrap}
.lbl-qr{width:82px;height:82px;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0);background-size:7px 7px;border:3px solid #000;flex-shrink:0}
.lbl-body{display:flex;gap:12px;justify-content:space-between}
.lbl-more{flex:1;border:1px dashed var(--stroke-sub);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--primary-base);font-weight:800;font-size:24px;gap:4px;min-height:150px}
.lbl-more .lm-s{font-size:11px;font-weight:500;color:var(--text-soft);text-align:center;padding:0 10px}
.perf-row-warn td{background:rgba(228,161,27,.05)}
/* rider held list — card per SJ (1 lembar bisa multi-PO) */
.held-card{border:1px solid var(--stroke-soft);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.held-card .hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.held-card .hc-po{margin-top:8px;font-size:10.5px;color:var(--text-soft);line-height:1.5}
.held-card .hc-meta{font-size:10.5px;color:var(--text-soft);margin-top:8px;padding-top:7px;border-top:1px solid var(--bg-soft-200)}
.po-chip{display:inline-flex;align-items:center;font-size:10px;font-weight:600;font-family:var(--mono);background:var(--bg-weak,#f7f7f7);border:1px solid var(--stroke-soft);border-radius:6px;padding:2px 6px;margin:3px 4px 0 0;color:var(--text-sub)}
.held-tbl{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;margin-top:4px}
.held-tbl th{text-align:left;font-size:10.5px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--stroke-soft)}
.held-tbl td{font-size:12px;padding:8px;border-bottom:1px solid var(--bg-soft-200);vertical-align:middle}
.held-tbl th:nth-child(2),.held-tbl td:nth-child(2){width:78px}
.held-tbl th:nth-child(3),.held-tbl td:nth-child(3){width:132px}
.held-tbl td:first-child .mono{word-break:break-all}
.held-tbl .scan-chip{white-space:normal}
.age-warn{color:var(--state-error-dark,#A02C2C);font-weight:700}
@media(max-width:900px){.def-grid{grid-template-columns:1fr}}
/* scan-flow explainer sample */
.flow-note{background:#fff;border:1px solid var(--stroke-soft);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.flow-note .fh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-strong);margin-bottom:10px}
.flow-note .fh .mode{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--primary-lighter,#EDE6FA);color:var(--primary-base,#5E2AAC);padding:2px 8px;border-radius:var(--radius-full)}
.flow-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow-step{display:inline-flex;align-items:center;gap:7px;background:var(--bg-weak,#F7F7F8);border:1px solid var(--stroke-soft);border-radius:9px;padding:7px 11px;font-size:11.5px;font-weight:600;color:var(--text-strong)}
.flow-step .n{width:17px;height:17px;border-radius:50%;background:var(--primary-base,#5E2AAC);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.flow-step.skip{opacity:.45;border-style:dashed}
.flow-arrow{color:var(--text-soft)}
.flow-cap{font-size:11px;color:var(--text-soft);margin-top:9px;line-height:1.45}
.pill-claim{background:var(--state-warning-lighter);color:var(--state-warning-dark)}.pill-claim .d{background:var(--state-warning-base)}
.ff-row{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
.ff-row label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft)}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.dispatch-cols{grid-template-columns:1fr}.dl-grid{grid-template-columns:1fr}}
</style>

function invWhere(i){
  const icHub='<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>';
  const icShop='<path d="M3 9l1-5h16l1 5M4 9v10a1 1 0 001 1h14a1 1 0 001-1V9M3 9h18"/>';
  const icRider='<circle cx="12" cy="7" r="4"/><path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/>';
  const none={cls:"scan-none",lbl:"Belum scan",ic:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>'};
  const rider={cls:"scan-rider",lbl:"Masih di rider",ic:icRider};
  const hub={cls:"scan-hub",lbl:"Di hub",ic:icHub};
  const apotek={cls:"scan-apotek",lbl:"Di apotek",ic:icShop};
  // exception: posisi tergantung reason (ditinggal di outlet = di apotek; selain itu masih di rider)
  if(i.status==="exception")return (i.reason&&/outlet/i.test(i.reason)&&/tinggal/i.test(i.reason))?apotek:rider;
  if(i.status==="await"||i.status==="disputed")return apotek;
  if(i.status==="hub"||i.status==="resolved")return hub;
  if(i.status==="rider")return rider;
  return none;
}

  let tl="";
  for(let i=reached;i>=0;i--){const st=order[i];const top=i===reached;let extra="";
    if(st==="Picked up @outlet")extra=`<div class="cap" style="color:var(--success-base)">✓ POPR · Proof of Pickup (Return) — outlet</div>`;

/* per-rider surat-jalan performance in a hub (the internal enhancement) */
function riderPerf(){return RIDERS.map((r,i)=>{
  const held=[8,3,12,0][i%4],byRider=[5,2,7,1][i%4],atHub=[10,6,4,9][i%4],awaiting=[3,1,2,0][i%4],exception=[2,0,4,1][i%4],disputed=[1,0,1,0][i%4],resolved=[14,20,9,25][i%4];
  const total=held+byRider+atHub+awaiting+exception+disputed+resolved;
  const oldest=[9,4,14,0][i%4];
  // daftar surat jalan yang masih dipegang rider (SJ baru = 1 lembar bisa multiple PO)
  const heldList=[];
  for(let k=0;k<held;k++){const days=held<=1?oldest:Math.round(oldest*(held-1-k)/(held-1));
    const nPo=1+((i+k)%3);const pos=[];for(let p=0;p<nPo;p++)pos.push(`PO26${String(7100+i*20+k*3+p).padStart(6,"0")}`);
    heldList.push({did:`DEZLA${26071100+i*20+k}JWB`,inv:`TMP${26071100+i*20+k}`,pos,outlet:OUTLETS[(i+k)%OUTLETS.length],days,date:sjDateStr(days),
      stage:(k%3===2?"pending":"rider")});}
  // Red & Avg aging DIHITUNG dari umur tiap SJ dipegang (SJ-level) → konsisten dgn drawer detail
  const red=heldList.filter(h=>h.days>=7).length;
  const avg=heldList.length?Math.round(heldList.reduce((a,h)=>a+h.days,0)/heldList.length):0;
  // flag edge-case per rider (aged / nonaktif)
  let flag=null;
  if(oldest>=14&&held>0)flag={type:"aged",txt:"SJ tertua "+oldest+" hari"};
  else if(i%4===1)flag={type:"off",txt:"Nonaktif — orphan held"};
  return {...r,held,byRider,atHub,awaiting,exception,disputed,resolved,red,avg,total,oldest,heldList,flag};});}

/* Pick the matching real field photo (watermark already burned in) by step/slot label. Returns null when no scene image applies (odometer/timestamp-only) → HTML overlay fallback used. */
function proofSampleKey(label){
  if(!window.DASH_SAMPLES) return null;
  const L=(label||"").toLowerCase();
  /* vehicle-condition spine (check before stop proofs) */
  if(/selfie/.test(L)) return "selfie";
  if(/tampak belakang|belakang|\brear\b/.test(L)) return "belakang";
  if(/tampak depan|depan|\bfront\b/.test(L)) return "depan";
  if(/sisi kiri|\bkiri\b|\bleft\b/.test(L)) return "sisiKiri";
  if(/sisi kanan|\bkanan\b|\bright\b/.test(L)) return "sisiKanan";
  if(/kondisi dalam box|kondisi bak|dalam box|\bbak\b|muatan/.test(L)) return "muatan";
  if(/odometer|\bodo\b|km awal/.test(L)) return "odometer";
  /* stop proofs */
  if(/drop|\bcy\b|kosong/.test(L)) return "cy";
  if(/kontainer & seal|seal|container|kontainer/.test(L)) return "depo";
  if(/gate-in customer|customer/.test(L)) return "gate";
  if(/pelabuhan|gate-out|gate-in/.test(L)) return "port";
  return "port";
}

/* Build the "Dokumen Lampiran" evidence sheet — branded header + Dash logo + 2-col labeled grid grouped by stop/milestone. */
function buildSheet(sel,s){
  const groups=[];const map={};
  sel.forEach(it=>{if(!map[it.grp]){map[it.grp]=[];groups.push(it.grp);}map[it.grp].push(it);});
  const secs=groups.map(g=>{
    const cells=map[g].map(it=>{const key=proofSampleKey(it.label);
      if(key&&window.DASH_SAMPLES&&window.DASH_SAMPLES[key])
        return `<div class="dl-cell"><img class="dl-real" src="${window.DASH_SAMPLES[key]}" style="width:100%;height:180px;object-fit:cover;object-position:center bottom;display:block;border-radius:8px" alt=""><div class="dl-cap">${escv(it.label)}</div></div>`;
      return `<div class="dl-cell"><div class="dl-img">${it.odo?"🔢":"📷"}<div class="dl-wm">${proofWMHtml(it.label,it.ts,s)}</div></div><div class="dl-cap">${escv(it.label)}</div></div>`;}).join("");
    return `<div class="dl-sec"><div class="dl-sec-h">${escv(g)}</div><div class="dl-grid">${cells}</div></div>`;
  }).join("");
  return `<div class="dl-sheet">
    <div class="dl-sheet-head">
      <div><div class="dl-doc-title">Dokumen Lampiran — Bukti Foto</div>
        <div class="dl-doc-meta"><span>No. Doc: <b>LMP/${escv(s.waybill||"—")}</b></span><span>AGL Order No: <b>${escv(s.booking||"—")}</b></span><span>Note: <b>${sel.length} foto · ${escv(s.client||"—")}</b></span></div>
      </div>
      <div class="dl-brand">${DASH_LOGO}<span>DASH</span></div>
    </div>
    ${secs}
  </div>`;
}

/* ============================================================
   STOP WORKFLOW · MASTER (English, modal builder — 5 Aug revision)
   List: Active / Inactive / All + Filter (stop type, client).
   Editor: modal — Client, Status, Stop type, Name, Milestones (in order).
   Field types: Image / Text / Number. Image = Exact count | Multiple (>=1).
   Milestone with no field = confirmation only (slide + timestamp).
   ============================================================ */
let wfStatusTab="active";   // active | inactive | all
let wfTypeFilter="all";     // all | PICKUP | DROPOFF
let wfClientFilter="all";   // all | clientId
let wfFilterOpen=false;
function setWfTab(t){wfStatusTab=t;nav("steppers");}
function toggleWfFilter(){wfFilterOpen=!wfFilterOpen;const p=document.getElementById("wfFilterPop");if(p)p.style.display=wfFilterOpen?"block":"none";}
function wfSetTypeFilter(t){wfTypeFilter=(wfTypeFilter===t?"all":t);nav("steppers");setTimeout(()=>{wfFilterOpen=true;const p=document.getElementById("wfFilterPop");if(p)p.style.display="block";},0);}
function applyWfFilter(){const c=document.getElementById("wfFltClient");if(c)wfClientFilter=c.value;wfFilterOpen=false;nav("steppers");}
function resetWfFilter(){wfTypeFilter="all";wfClientFilter="all";wfFilterOpen=false;nav("steppers");}
function wfCoerce(f){/* normalise image count model on legacy data */
  if(f.type==="image"&&f.multi===undefined){f.multi=(f.min||1)!==(f.max||1);f.count=f.multi?(f.min||1):(f.max||1);}
  if(f.type==="image"&&f.count===undefined)f.count=f.max||1;
  return f;}
function wfFieldCount(s){return s.steps.reduce((a,st)=>a+st.fields.length,0);}
function wfTypeChip(s){return s.type==="PICKUP"
  ?`<span class="wf-typechip pick">Pickup</span>`
  :`<span class="wf-typechip drop">Drop-off</span>`;}
function wfRule(f){wfCoerce(f);
  if(f.type==="image")return f.multi?"Multiple · min 1":`Exactly ${f.count||1} photo${(f.count||1)>1?"s":""}`;
  if(f.type==="number")return "Numeric";
  if(f.type==="text")return "Free text";
  return "—";}

function renderSteppers(){
  const bySearch=s=>true;
  let list=STEPPERS.filter(s=>!s.locked);   // hide built-in POP/POD fallbacks from master list
  if(wfStatusTab==="active")list=list.filter(s=>!s.inactive);
  else if(wfStatusTab==="inactive")list=list.filter(s=>s.inactive);
  if(wfTypeFilter!=="all")list=list.filter(s=>s.type===wfTypeFilter);
  if(wfClientFilter!=="all")list=list.filter(s=>s.clientId===wfClientFilter);
  const cAll=STEPPERS.filter(s=>!s.locked);
  const cActive=cAll.filter(s=>!s.inactive).length, cInactive=cAll.filter(s=>s.inactive).length;

  const rows=list.map(s=>{
    const client=WF_CLIENTS.find(c=>c.id===s.clientId);
    const stat=s.inactive
      ?`<span class="wf-status off"><span class="d"></span>Inactive</span>`
      :`<span class="wf-status on"><span class="d"></span>Active</span>`;
    return `<tr onclick="openStepperBuilder('${s.id}')" style="cursor:pointer">
      <td><span class="strong">${escv(s.name)}</span></td>
      <td>${client?escv(client.name):'<span class="muted">—</span>'}</td>
      <td>${wfTypeChip(s)}</td>
      <td class="num">${s.steps.length}</td>

    ||`<tr><td colspan="8"><div class="wf-empty"><div class="wf-empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4-4"/></svg></div><div class="wf-empty-t">No data</div><div class="wf-empty-d">Try checking the spelling or using a different search term.</div></div></td></tr>`;

  const tabs=[["active","Active",cActive],["inactive","Inactive",cInactive],["all","All",cAll.length]];
  const clientOpts=`<option value="all">All clients</option>`+WF_CLIENTS.map(c=>`<option value="${c.id}" ${wfClientFilter===c.id?"selected":""}>${c.name}</option>`).join("");

  return `<div class="page">
    ${pageHead("05","Master Data · Stop workflow","Workflows","Per-client door-side forms: the milestones a rider completes at a stop, and the evidence each one requires. One active workflow per client and stop type; stops without one fall back to the app's static flow.",
      `${btnRefresh}<button class="btn primary" onclick="openStepperBuilder(null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New workflow</button>`)}

              <div class="wfp-lbl">Client</div>
