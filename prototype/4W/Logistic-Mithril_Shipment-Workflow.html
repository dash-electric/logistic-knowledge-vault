              <div class="wfp-foot"><button class="btn" onclick="toggleWfFilter()">Cancel</button><button class="btn primary" onclick="applyWfFilter()">Apply</button></div>
            </div>
          </div>
        </div>
      </div>
      <div class="table-wrap"><table class="wf-table">
        <thead><tr><th>Workflow</th><th>Client</th><th>Stop type</th><th>Milestones</th><th>Fields</th><th>Status</th><th>Updated</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <div class="eng-note">
      <div class="en-h"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6M21 17a9 9 0 00-15-6.7L3 13"/></svg>Engineering note — stop-workflow module<span class="en-tag">Internal</span></div>
      <div class="en-b">
        <b>Resolution key:</b> <code>(client_id, stop_type)</code> → max 1 ACTIVE. When a route is created the system snapshots the ACTIVE workflow for each stop's (client, stop type) onto <code>route_stops.workflow</code>. No match → <code>workflow: null</code> → rider app static flow.<br>
        <b>Snapshot freeze:</b> editing a workflow here never changes stops already planned — in-flight stops keep the definition they were created with.<br>
        <b>Confirmation-only milestone</b> = a milestone with zero fields: rider slides to confirm and a timestamp is recorded. <b>Barcode</b> is not yet implemented in the field types.
      </div>
    </div>
    </div>`;
}

/* ---------- Workflow BUILDER (modal) ---------- */
let wf=null; let wfDirty=false;
function wfMkId(){let n=STEPPERS.length+1;return "WF-"+String(n).padStart(2,"0");}
function openStepperBuilder(id){
  if(id){wf=JSON.parse(JSON.stringify(STEPPERS.find(x=>x.id===id)));wf._edit=id;wf.steps.forEach(st=>st.fields.forEach(wfCoerce));}
  else{wf={id:wfMkId(),name:"",clientId:"",type:"PICKUP",intent:null,inactive:false,steps:[{name:"",fields:[]}],usedStops:0,usedRoutes:0,_edit:null};}
  wfDirty=false; wfRender();
}
function wfRender(){openModal(renderWfModal());}
function wfMark(){wfDirty=true;}
const WF_FTYPES=[{k:"image",l:"Image"},{k:"text",l:"Text"},{k:"number",l:"Number"}];
function renderWfModal(){
  const isDrop=wf.type==="DROPOFF"; const isEdit=!!wf._edit;
  const milestones=wf.steps.map((st,si)=>{
    const fields=st.fields.map((f,fi)=>{wfCoerce(f);
      const isImg=f.type==="image";
      return `<div class="wfb-field">
        <div class="wfb-field-top">
          <input class="wfb-flabel" value="${escv(f.label)}" placeholder="Field label, e.g. Outlet front photo" oninput="wf.steps[${si}].fields[${fi}].label=this.value;wfMark()">
          <select class="sel-field wfb-ftype" onchange="wfFieldType(${si},${fi},this.value)">${WF_FTYPES.map(t=>`<option value="${t.k}" ${f.type===t.k?"selected":""}>${t.l}</option>`).join("")}</select>
          <button class="sb-ic del" title="Remove field" onclick="wfDelField(${si},${fi})">✕</button>
        </div>
        <div class="wfb-field-rules">
          ${isImg?`<div class="seg sm wfb-countseg"><button class="${!f.multi?"on":""}" onclick="wfFieldMulti(${si},${fi},false)">Exact count</button><button class="${f.multi?"on":""}" onclick="wfFieldMulti(${si},${fi},true)">Multiple (≥1)</button></div>
            <input class="wfb-count" type="number" min="1" max="20" value="${f.count||1}" ${f.multi?"disabled":""} onchange="wf.steps[${si}].fields[${fi}].count=Math.max(1,+this.value||1);wfMark()">`:""}
          <label class="wfb-req"><span class="switch"><input type="checkbox" ${f.req?"checked":""} onchange="wf.steps[${si}].fields[${fi}].req=this.checked;wfMark()"><span class="track"></span></span>Required</label>

    return `<div class="wfb-ms">
      <div class="wfb-ms-head">
        <span class="wfb-ms-no">${String(si+1).padStart(2,"0")}</span>

        <button class="wfb-addfield" onclick="wfAddField(${si})">＋ Add field</button>

  return `<div class="modal wfb-modal">

    <div class="modal-body">

function wfSetType(t){wf.type=t;wf.intent=t==="DROPOFF"?"bongkar":null;wfMark();wfRender();}
function wfAddMs(){wf.steps.push({name:"",fields:[]});wfMark();wfRender();}
function wfDelMs(i){wf.steps.splice(i,1);wfMark();wfRender();}
function wfMoveMs(i,d){const t=wf.steps[i];wf.steps[i]=wf.steps[i+d];wf.steps[i+d]=t;wfMark();wfRender();}
function wfAddField(i){wf.steps[i].fields.push({type:"image",label:"",req:true,multi:false,count:1,min:1,max:1});wfMark();wfRender();}
function wfDelField(i,j){wf.steps[i].fields.splice(j,1);wfMark();wfRender();}
function wfFieldType(i,j,v){const f=wf.steps[i].fields[j];f.type=v;if(v==="image"&&f.multi===undefined){f.multi=false;f.count=1;}wfMark();wfRender();}
function wfFieldMulti(i,j,m){wf.steps[i].fields[j].multi=m;wfMark();wfRender();}
function wfClose(){if(wfDirty){openModal(`<div class="modal" style="width:420px"><div class="modal-body" style="padding:26px 24px 8px"><h3 style="font-size:18px;font-weight:800;margin-bottom:8px">Discard unsaved changes?</h3><p style="font-size:13px;color:var(--text-sub);line-height:1.5">Anything you have entered in this form will be lost.</p></div><div class="modal-foot"><button class="btn" onclick="wfDirty=false;closeModal()">Discard and exit</button><button class="btn primary" onclick="wfRender()">Stay and continue</button></div></div>`);}else{closeModal();}}
function wfSave(){
  if(!wf.clientId){toast("Select a client first",false);return;}
  if(!wf.name.trim()){toast("Give the workflow a name first",false);return;}
  if(!wf.inactive){const conflict=STEPPERS.find(x=>x.id!==wf.id&&x.clientId===wf.clientId&&x.type===wf.type&&!x.inactive&&!x.locked);
    if(conflict){toast(`${WF_CLIENTS.find(c=>c.id===wf.clientId)?.name} already has an ACTIVE ${wf.type==="PICKUP"?"pickup":"drop-off"} workflow (${conflict.name}). Deactivate it first.`,false);return;}}
  wf.steps.forEach(st=>st.fields.forEach(f=>{if(f.type==="image"){wfCoerce(f);if(f.multi){f.min=1;f.max=99;}else{f.min=f.count||1;f.max=f.count||1;}}}));
  const clean={id:wf.id,clientId:wf.clientId,name:wf.name.trim(),type:wf.type,intent:wf.intent,inactive:!!wf.inactive,usedStops:wf.usedStops||0,usedRoutes:wf.usedRoutes||0,updated:"05 Aug 2026",steps:wf.steps};
  if(wf._edit){const i=STEPPERS.findIndex(x=>x.id===wf._edit);STEPPERS[i]=clean;}else STEPPERS.push(clean);
  wfDirty=false;closeModal();
  toast(`Workflow saved · ${WF_CLIENTS.find(c=>c.id===wf.clientId)?.name} · ${wf.type==="PICKUP"?"Pickup":"Drop-off"}${wf.inactive?" · Inactive":""}`);
  nav("steppers");
}

  const stepperOpts=st=>{
    const matched=STEPPERS.filter(s=>s.type===st.type&&!s.inactive&&(s.locked||!s.clientId||(c4ClientId&&s.clientId===c4ClientId)));

  const hasMixedClient=uniqueClients.length>1;
  const stops=c4.stops.map((st,i)=>{const lab=stopLabel(st);const isDrop=st.type==="DROPOFF";

          <div class="c4-stop-ship-val">${c4.booking?`<span class="c4-ship-ref">${stopShipRef}</span><span class="muted" style="font-size:11px"> · 1 shipment · ${c4.client||"—"}</span>`:'<span class="muted" style="font-size:11.5px">— tersedia setelah Client &amp; Booking ID diisi —</span>'}</div>
        </div>
        ${(()=>{const wfd=STEPPERS.find(w=>w.id===st.stepper);if(!wfd)return "";return `<div class="c4-wfprev"><div class="c4-wfprev-h">Preview workflow · ${wfd.steps.length} langkah</div>${wfd.steps.map((sp,k)=>`<div class="c4-wfstep"><span class="c4-wfno">${k+1}</span><div class="c4-wfbody"><div class="c4-wfname">${escv(sp.name)||'(langkah '+(k+1)+')'}</div><div class="c4-wffields">${sp.fields.map(fd=>{const m=ftMeta(fd.type);const cnt=fd.type==='image'&&(fd.max||1)>1?(fd.min!==fd.max?' 1+':' ×'+fd.max):'';return `<span class="c4-fchip">${m.ic} ${escv(fd.label)||m.l} <span class="c4-ftype">${m.l}${cnt}</span></span>`;}).join("")||'<span class="muted" style="font-size:11px">confirmation only</span>'}</div></div></div>`).join("")}</div>`;})()}
      </div>
      ${c4.stops.length>1?`<button class="sb-ic del" onclick="c4Del(${i})">✕</button>`:'<span style="width:26px"></span>'}
    </div>`;}).join("")+
    (hasMixedClient?`<div class="c4-mixed-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><div><b>Multi-client stop terdeteksi</b> — stop ini melayani shipment dari lebih dari satu client (${uniqueClients.join(", ")}).<br>V1: <code>workflow: null</code> — fallback ke POP/POD standar.</div></div>`:"");

  return `<div class="cs-main">
    <div class="cs-panel">
      <div class="c4-grid">
        <div><label class="lbl-field">Rider / driver <span class="c4-src">🔒 dari UJP</span></label><input class="sel-field c4-imp" ${U} value="${escv(c4.driver)}${c4.plat?' · '+escv(c4.plat):''}" placeholder="—"></div>
        <div><label class="lbl-field">Shift <span class="c4-src">🔒 dari UJP</span></label><input class="sel-field c4-imp" ${U} value="${escv(c4.shift)}" placeholder="—"></div>
      </div>
      <div class="c4-opt-card">

        <label class="switch"><input type="checkbox" onchange="toast(this.checked?'Urutan stop akan diotomatiskan saat simpan':'Urutan stop tetap seperti input')"><span class="track"></span></label>
      </div>

      <div class="c4-sec-h" style="margin-top:20px">Peta rute <span class="req">${c4.stops.length} stop · ${c4.km||"—"} km${c4.returnToOrigin?" · kembali ke origin":""}</span></div>
      ${c4Map()}

      <div class="c4-sec-h" style="margin-top:20px">Stop &amp; workflow <span class="req">tiap stop = Pickup / Dropoff + workflow</span></div>
      <div class="hint hint-block" style="margin-bottom:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><div><p>✎ Stop di sini hanya <b>memilih</b> workflow (bukan diedit). Untuk mengubah langkah/field → menu <b>Master → Workflows</b>.</p></div></div>
      <div class="c4-stops">${stops}</div>
      <button class="sb-add-step" style="margin-top:10px" onclick="c4Add()">＋ Tambah stop</button>
    </div>
  </div>
  <div class="cs-side">${c4Rail()}</div>`;
}

/* schematic route map (SVG, no external tiles) */
function c4Map(){
  const n=c4.stops.length;
  const W=560,H=200,padX=48,padY=64;
  const xs=n>1?(W-2*padX)/(n-1):0;
  const ys=[0,-26,20,-14,14];
  const pts=c4.stops.map((st,i)=>({x:padX+xs*i,y:H/2+(ys[i%ys.length]||0),st}));
  const line=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const ret=c4.returnToOrigin&&n>1?`<path d="M${pts[n-1].x},${pts[n-1].y} C ${pts[n-1].x},${H-14} ${pts[0].x},${H-14} ${pts[0].x},${pts[0].y}" fill="none" stroke="var(--primary-main)" stroke-width="2" stroke-dasharray="5 5" opacity=".65"/>`:"";
  const pins=pts.map((p,i)=>{const lab=stopLabel(p.st);const fill=lab.c==="purple"?"#5E2AAC":lab.c==="amber"?"#B8740A":"#0b6f65";
    return `<g><circle cx="${p.x}" cy="${p.y}" r="15" fill="#fff" stroke="${fill}" stroke-width="2.5"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="12" font-weight="800" fill="${fill}">${i+1}</text><text x="${p.x}" y="${p.y-22}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#525866">${lab.t}</text></g>`;}).join("");
  return `<div class="c4-map">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto">
      <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E1E4EA" stroke-width="1"/></pattern></defs>
      <rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="#F7F5FC"/>
      <rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="url(#grid)"/>
      <polyline points="${line}" fill="none" stroke="#5E2AAC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${ret}${pins}
    </svg>
    <div class="c4-map-badge">${c4.km||"—"} km${c4.returnToOrigin?" + kembali ke origin":""}</div>
  </div>`;
}

function c4Rail(){
  const nPick=c4.stops.filter(s=>s.type==="PICKUP").length;
  const nDrop=c4.stops.length-nPick;
  const nWf=c4.stops.filter(s=>s.stepper).length;
  const is4W=c4.type==="DIRECT_4W";
  return `<div class="rail-card">
    <div class="rc-head">Ringkasan rute</div>
    <div class="rc-body">
      <div class="stat-row"><span class="k">Jumlah stop</span><span class="v">${c4.stops.length} <small>${nPick} pickup · ${nDrop} dropoff</small></span></div>
      <div class="stat-row"><span class="k">Client</span><span class="v" style="font-size:13px">${c4.client||"—"}</span></div>
      <div class="stat-row"><span class="k">Tipe pengiriman</span><span class="v" style="font-size:13px">${c4.shipmode||"—"}</span></div>
      <div class="stat-row"><span class="k">Jarak (KM)</span><span class="v">${c4.km||"—"} <small>km</small></span></div>
      <div class="stat-row"><span class="k">Kembali ke origin</span><span class="v" style="font-size:13px">${c4.returnToOrigin?"Ya":"Tidak"}</span></div>
      <div class="stat-row"><span class="k">Workflow terpasang</span><span class="v">${nWf} <small>dari ${c4.stops.length} stop</small></span></div>
    </div>
  </div>
  <div class="rail-card" style="margin-top:14px">
    <div class="rc-head">Dicek otomatis saat simpan</div>
    <div class="rc-body">
      <div class="rc-note">Sistem memeriksa aturan ini sebelum route dibuat — kalau ada yang gagal, route tidak tersimpan.</div>
      <div class="stat-row"><span class="k">Pickup sebelum dropoff-nya</span><span class="badge-pass">OK</span></div>
      <div class="stat-row"><span class="k">Tiap shipment punya pickup &amp; dropoff</span><span class="badge-pass">OK</span></div>
      <div class="stat-row"><span class="k">Workflow cocok dgn tipe stop</span><span class="badge-pass">OK</span></div>
    </div>
  </div>
  ${is4W?`<div class="alert-4w warn" style="margin-top:14px"><span class="ico">!</span><span><b>Cek kendaraan belum dilakukan.</b> Untuk rute 4W, driver wajib submit 7 item foto cek kendaraan (selfie, 4 sisi, bak muatan, odometer) di app sebelum bisa mulai stop pertama.</span></div>`:""}`;
}

/* ---------- STEP 3 · Review ---------- */
function c4Step3(){
  const kv=(k,v)=>`<div class="c4-rv-row"><span class="k">${k}</span><span class="v">${v||"—"}</span></div>`;
  const flowDriverLabel=(()=>{const chips=c4.stops.map((st,idx)=>{const l=stopLabel(st);const isLastDrop=st.type==="DROPOFF"&&c4.stops.slice(idx+1).every(x=>x.type!=="DROPOFF");const label=isLastDrop?"Completed":l.t;const cls=isLastDrop?"teal":l.c;return `<span class="flowchip ${cls}">${label}</span>`;});return chips.join('<span class="flow-arrow">→</span>');})();
  const stopRows=c4.stops.map((st,i)=>{const lab=stopLabel(st);const wfd=STEPPERS.find(w=>w.id===st.stepper);
    return `<div class="c4-rv-stop"><span class="c4-stop-no">${i+1}</span><div><div class="strong">${escv(st.name)||"(stop "+(i+1)+")"} <span class="flowchip ${lab.c}" style="margin-left:4px">${lab.t}</span></div><div class="muted" style="font-size:12px;margin-top:3px">Workflow: ${wfd?escv(wfd.name)+" · "+wfd.steps.length+" langkah":'<span style="color:var(--warning-base)">belum dipilih → fallback POP/POD</span>'}</div></div></div>`;}).join("");
  return `<div class="c4w-single c4w-review">
    <div class="alert-4w"><span class="ico">✓</span><span>Periksa ringkasan di bawah. <b>Buat shipment</b> akan membuat shipment + route + snapshot workflow ke tiap stop, siap dispatch &amp; aplikasi driver.</span></div>
    <div class="c4-rv-grid">
      <div class="c4-rv-card"><div class="c4-rv-h">Pengiriman</div>${kv("Tipe","DIRECT_4W")}${kv("Client",c4.client)}${kv("Booking ID",c4.booking)}${kv("Delivery type",c4.shipmode)}${kv("Tipe kontainer",c4.ctype)}${kv("Tanggal",c4.delivDate)}</div>
      <div class="c4-rv-card"><div class="c4-rv-h">Rute</div>${kv("Origin",c4.origin)}${kv("Destination",c4.dest)}${kv("Jarak",(c4.km||"—")+" km")}${kv("Return to origin",c4.returnToOrigin?"Ya":"Tidak")}</div>
      <div class="c4-rv-card"><div class="c4-rv-h">Kendaraan &amp; driver</div>${kv("Plat",c4.plat)}${kv("Jenis unit",c4.unit)}${kv("Driver",c4.driver)}${kv("Layanan",c4.layanan)}${kv("Shift",c4.shift)}</div>
    </div>
    <div class="c4-sec-h" style="margin-top:20px">Stops &amp; workflow <span class="req">${c4.stops.length} stop</span></div>
    <div class="c4-rv-stops">${stopRows}</div>
    <div class="c4-flow-wrap"><span class="c4-flow-lbl">Alur driver</span><span class="c4-flow">${flowDriverLabel}</span></div>
  </div>`;
}

/* ---------- Footer per step ---------- */
function c4Foot(){
  if(c4.step===1){
    const ready=c4.imported&&c4.client&&c4.booking;
    return `<div class="cs-full-foot"><span class="lead">Tipe & data UJP terkunci; lengkapi Client + Booking untuk lanjut.</span>
      <div class="btn-row"><button class="btn" onclick="closeCreate4W()">Batal</button>
      <button class="btn primary" id="c4NextBtn" ${ready?`onclick="c4Go(2)"`:`disabled title="Import UJP + isi Client & Booking dulu"`}>Lanjut ke rute →</button></div></div>`;
  }
  if(c4.step===2){
    return `<div class="cs-full-foot"><span class="lead">Totals dihitung ulang server-side saat save — rail ini preview.</span>
      <div class="btn-row"><button class="btn" onclick="c4Go(1)">← Kembali</button>
      <button class="btn primary" onclick="c4Go(3)">Review rute →</button></div></div>`;
  }
  return `<div class="cs-full-foot"><span class="lead">Shipment + route dibuat dari data ini.</span>
    <div class="btn-row"><button class="btn" onclick="c4Go(2)">← Kembali</button>
    <button class="btn primary" onclick="c4Submit()">Buat shipment</button></div></div>`;
}

/* live-toggle the step-1 Next button without a full re-render (keeps input focus) */
function c4SyncNext(){if(c4.step!==1)return;const b=document.getElementById("c4NextBtn");if(!b)return;const ready=c4.imported&&c4.client&&c4.booking;b.disabled=!ready;b.onclick=ready?(()=>c4Go(2)):null;if(ready)b.removeAttribute("title");else b.title="Import UJP + isi Client & Booking dulu";}
/* ---------- Stop editing (step 2) ---------- */
function c4Type(i,t){c4.stops[i].type=t;if(!STEPPERS.find(s=>s.id===c4.stops[i].stepper&&s.type===t)){c4.stops[i].stepper="";}renderCreate4W();}
function c4Add(){c4.stops.push({type:"DROPOFF",stepper:"",name:""});renderCreate4W();}
function c4Del(i){c4.stops.splice(i,1);renderCreate4W();}
function c4Submit(){
  if(!c4.imported){toast("Import dari UJP dulu — shipment 4W butuh request yang sudah di-approve",false);return;}
  if(!c4.client){toast("Pilih client dulu",false);return;}
  const flow=c4.stops.map(s=>stopLabel(s).t).join(" · ");
  closeCreate4W();toast(`Shipment 4W dibuat · ${c4.stops.length} stop (${flow})${c4.returnToOrigin?" · kembali ke origin":""} · siap dispatch & driver app`);
}

/* taxonomy note */
.sb-taxo{display:flex;gap:9px;align-items:flex-start;background:#f4f1fb;border:1px solid var(--primary-lighter);border-radius:10px;padding:11px 13px;margin:0 0 16px;font-size:11.5px;line-height:1.55;color:var(--text-sub)}
.sb-taxo svg{width:16px;height:16px;color:var(--primary-main);flex-shrink:0;margin-top:1px}
/* create — import card */
.c4-import{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#f4f1fb;border:1px solid var(--primary-lighter);border-radius:12px;padding:13px 15px;margin-bottom:14px;flex-wrap:wrap}
.c4-import-l{display:flex;gap:11px;align-items:flex-start;flex:1;min-width:260px}
.c4-import-l svg{width:22px;height:22px;color:var(--primary-main);flex-shrink:0;margin-top:1px}
.c4-import-t{font-size:13px;font-weight:800;color:var(--text-strong-950)}
.c4-import-d{font-size:11.5px;color:var(--text-sub);line-height:1.5;margin-top:3px}
.c4-import-r{display:flex;gap:12px;align-items:center}
.c4-import-r .tmpl-link{display:inline-flex;align-items:center;gap:6px;margin:0;white-space:nowrap}
/* exim step-activity timeline (detail drawer) */
.ex-stop{border:1px solid var(--stroke-soft);border-radius:12px;margin-bottom:11px;overflow:hidden}
.ex-stop-head{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--bg-soft,#fafafa);border-bottom:1px solid var(--stroke-soft);flex-wrap:wrap}
.ex-no{width:22px;height:22px;border-radius:50%;background:var(--primary-main);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-sname{font-size:13px;font-weight:700;color:var(--text-strong-950);flex:1;min-width:80px}
.ex-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.ex-badge.done{background:var(--success-light,#e7f8ef);color:var(--success-dark,#0b7a43)}
.ex-badge.active{background:#fff3eb;color:#b75310}
.ex-badge.todo{background:var(--bg-weak,#f3f4f6);color:var(--text-soft)}
.ex-stepper{font-size:11px;color:var(--text-soft);padding:8px 12px 2px}
.ex-acts{padding:6px 12px 12px}
.ex-act{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--stroke-soft)}
.ex-act:last-child{border-bottom:none}
.ex-dot{width:9px;height:9px;border-radius:50%;background:var(--stroke-sub);flex-shrink:0}
.ex-act.done .ex-dot{background:var(--success-dark,#0b7a43)}
.ex-act.now .ex-dot{background:#f6a723;box-shadow:0 0 0 3px #fdecc9}
.ex-aic{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.ex-aname{flex:1;font-size:12.5px;color:var(--text-strong-950)}
.ex-act.todo .ex-aname{color:var(--text-soft)}
.ex-ats{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--text-sub)}
/* create — section headers, imported/gray fields, legend */
.c4-fsec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-strong-950);margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.c4-src{font-size:10px;font-weight:700;text-transform:none;letter-spacing:0;background:var(--bg-weak,#f3f4f6);color:var(--text-soft);border:1px solid var(--stroke-soft);padding:2px 8px;border-radius:20px}
.c4-imp{background:var(--bg-weak,#f3f4f6)!important;color:var(--text-sub)}
.c4-legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-soft);margin-top:10px}
.c4-swatch{width:22px;height:13px;border-radius:4px;background:var(--bg-weak,#f3f4f6);border:1px solid var(--stroke-sub);flex-shrink:0}
/* import popup result */
.imp-result{margin-top:14px;border:1px solid var(--stroke-soft);border-radius:11px;overflow:hidden}
.imp-row{display:flex;align-items:center;gap:8px;padding:10px 13px;font-size:13px;font-weight:700}
.imp-row.ok{background:var(--success-light,#e7f8ef);color:var(--success-dark,#0b7a43)}
.imp-row.ok svg{width:16px;height:16px}
.imp-map,.imp-note{padding:9px 13px;font-size:11.5px;line-height:1.55;color:var(--text-sub);border-top:1px solid var(--stroke-soft)}
/* spine — pra/pasca trip evidence */
.sp-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.sp-two{grid-template-columns:1fr}}
.sp-col{border:1px solid var(--stroke-soft);border-radius:11px;padding:11px}
.sp-lbl{font-size:12px;font-weight:800;color:var(--text-strong-950);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.sp-ts{font-size:11px;font-weight:700;font-family:var(--mono);color:var(--text-soft)}
.sp-shots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.sp-shot{font-size:10.5px;background:var(--bg-weak,#f3f4f6);border:1px solid var(--stroke-soft);border-radius:6px;padding:3px 7px;color:var(--text-sub)}
.sp-odo{font-size:12px;color:var(--text-sub);border-top:1px dashed var(--stroke-soft);padding-top:8px}
/* proof thumbnails */
/* builder: foto count + presets */
.sb-count input{width:44px;padding:2px 5px;border:1px solid var(--stroke-sub);border-radius:6px;font-size:11px;margin:0 2px}
.sb-count{color:var(--text-sub)}
.sb-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--text-soft)}
.sb-presets button{border:1px dashed var(--stroke-sub);background:var(--bg-weak,#f5f7fa);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--text-sub);cursor:pointer}
.sb-presets button:hover{border-color:var(--primary-main);color:var(--primary-main)}
/* Gap A: stop shipments placeholder */
.c4-stop-shipments{background:#f0f4ff;border:1px dashed #b3c6ff;border-radius:8px;padding:8px 10px;margin-top:6px}
.c4-stop-ship-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#335CFF;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.c4-stop-ship-val{font-size:12.5px;color:var(--text-strong-950);margin-bottom:4px}
.c4-ship-ref{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text-strong-950)}
.c4-stop-ship-eng{font-size:10px;color:var(--state-information-base);line-height:1.45;border-top:1px dashed #b3c6ff;margin-top:5px;padding-top:5px}
/* Gap C: mixed-client warning */
.c4-mixed-warn{display:flex;gap:10px;align-items:flex-start;background:var(--state-warning-lighter);border:1px solid var(--state-warning-light);border-radius:10px;padding:11px 13px;margin-top:6px;font-size:12px;color:var(--state-warning-dark);line-height:1.5}
.c4-mixed-warn svg{width:18px;height:18px;color:var(--state-warning-base);flex-shrink:0;margin-top:1px}
/* disabled field styling */
.sel-field:disabled,.sel-field[disabled]{background:var(--bg-weak,#f5f7fa);color:var(--text-disabled-300);cursor:not-allowed;border-color:var(--stroke-soft);opacity:.7}
/* create: workflow preview per stop */
.c4-wfprev{background:var(--bg-weak,#f5f7fa);border:1px solid var(--stroke-soft);border-radius:9px;padding:9px 11px;margin-top:2px}
.c4-wfprev-h{font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:6px}
.c4-wfstep{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.c4-wfno{width:18px;height:18px;border-radius:50%;background:var(--primary-lighter);color:var(--primary-main);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.c4-wfname{flex:1;color:var(--text-strong-950)}
.c4-wffields{color:var(--text-soft);font-size:12px;display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.c4-wfbody{flex:1;min-width:0}
.c4-fchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#fff;border:1px solid var(--stroke-soft);border-radius:20px;padding:2px 8px;color:var(--text-sub)}
.c4-ftype{color:var(--primary-main);font-weight:700;font-size:10px}
.c4-wfedit{font-size:11px;color:var(--text-soft);margin-top:9px;padding-top:8px;border-top:1px dashed var(--stroke-soft)}
/* demo example section */
.c4-demo{background:repeating-linear-gradient(45deg,var(--bg-weak,#f5f7fa),var(--bg-weak,#f5f7fa) 8px,#eef0f4 8px,#eef0f4 16px);border:1px dashed var(--stroke-sub);border-radius:10px;padding:9px 12px}
.c4-demo-tag{font-size:9.5px;font-weight:800;letter-spacing:.05em;background:var(--text-soft);color:#fff;padding:2px 7px;border-radius:20px}
/* builder preview readable fields */
.pv-fpill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;background:var(--bg-weak,#f5f7fa);border:1px solid var(--stroke-soft);border-radius:6px;padding:2px 6px;margin:2px 3px 0 0;color:var(--text-sub)}
.pv-fpill em{color:var(--primary-main);font-style:normal;font-weight:700;font-size:9.5px}
.pv-fmeta{display:flex;flex-wrap:wrap}
/* print tools + disabled rows */
.pp-tools{display:flex;gap:8px;padding:2px 0 10px;border-bottom:1px solid var(--stroke-soft);margin-bottom:6px}
.pp-row.pp-off{opacity:.45}
.pp-row.pp-off input{cursor:not-allowed}
/* invoice disabled action */
.mi-off{opacity:.6;cursor:not-allowed;color:var(--text-soft)!important;background:var(--bg-weak,#f5f7fa);border:1px solid var(--stroke-soft);border-radius:8px}
/* print photos modal + print layout */
.pp-list{display:flex;flex-direction:column;gap:2px}
.pp-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer}
.pp-row:hover{background:var(--bg-weak,#f5f7fa)}
.pp-ph{width:34px;height:34px;border-radius:7px;background:linear-gradient(135deg,#ede9fb,#f5f7fa);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pp-l{display:flex;flex-direction:column}.pp-l b{font-size:13px}.pp-l small{font-size:11px;color:var(--text-soft)}
#printarea{display:none}
/* ---- Dokumen Lampiran evidence sheet (preview + print) ---- */
.dl-sheet{background:#fff;max-width:720px;margin:0 auto;padding:22px;border-radius:8px;box-shadow:0 2px 12px rgba(14,18,27,.12);font-family:var(--sans);color:var(--text-strong-950)}
.dl-sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #5e2aac;padding-bottom:12px;margin-bottom:16px}
.dl-doc-title{font-size:15px;font-weight:800}
.dl-doc-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:11px;color:var(--text-sub)}
.dl-doc-meta b{color:var(--text-strong-950);font-weight:700}
.dl-brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:-.01em;flex:0 0 auto}
.dl-brand svg{flex:0 0 auto}
.dl-sec{margin-bottom:16px}
.dl-sec-h{font-size:12px;font-weight:700;color:#5e2aac;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--stroke-soft)}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dl-img{position:relative;height:180px;background:linear-gradient(135deg,#5b4a8a,#2d2545);color:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;border-radius:8px;overflow:hidden}
.dl-wm{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.55) 62%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--mono);font-size:8px;line-height:1.5;color:#fff;text-align:left;text-shadow:0 1px 2px rgba(0,0,0,.75)}
.dl-wm .pw-row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-cap{font-size:11px;font-weight:600;margin-top:5px}
@media print{body>*{display:none!important}#printarea{display:block!important;padding:0}.dl-sheet{box-shadow:none;max-width:100%;border-radius:0;padding:10px}.dl-sec{break-inside:avoid}.dl-cell{break-inside:avoid}.dl-img{height:150px}}
.sp-thumb{display:flex;flex-direction:column;gap:0;width:74px;border:1px solid var(--stroke-soft);border-radius:9px;overflow:hidden;background:#fff;cursor:pointer;padding:0;text-align:left}
.sp-thumb:hover{border-color:var(--primary-main);box-shadow:0 0 0 3px var(--primary-lighter)}
.sp-thumb-ph{height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#ede9fb,#f6f7f9);color:var(--primary-main)}
.sp-thumb-cap{font-size:9.5px;line-height:1.25;padding:5px 6px;color:var(--text-sub);border-top:1px solid var(--stroke-soft);min-height:30px}
.ex-view{font-size:10.5px;font-weight:700;color:var(--primary-main);margin-right:8px}
/* proof lightbox + watermark */
.proof-img{position:relative;height:380px;background:linear-gradient(135deg,#5b4a8a,#2d2545);display:flex;align-items:center;justify-content:center;overflow:hidden}
.proof-cam{font-size:72px;opacity:.5}
.proof-wm{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.55) 62%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-family:var(--mono);font-size:8px;line-height:1.5;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75)}
.proof-wm .pw-row{letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proof-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.proof-foot{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;gap:12px}
.proof-t{font-size:14px;font-weight:800;color:var(--text-strong-950)}
.proof-sub{font-size:11px;color:var(--text-soft);margin-top:2px}
/* workflow row actions */
.wf-act{border:1px solid var(--stroke-sub);background:#fff;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--text-sub);cursor:pointer}
.wf-act:hover{border-color:var(--primary-main);color:var(--primary-main)}
.wf-act.del:hover{border-color:var(--error-base,#d92d20);color:var(--error-base,#d92d20)}
.wf-act.warn:hover{border-color:#b75310;color:#b75310}
.wf-act[disabled]{opacity:.5;cursor:not-allowed}
tr.wf-off{opacity:.55}
/* import template details */
.imp-tmpl{margin-top:12px;border:1px solid var(--stroke-soft);border-radius:9px;padding:0 12px}
.imp-tmpl summary{cursor:pointer;font-size:12px;font-weight:700;padding:10px 0;color:var(--text-sub)}
.imp-tmpl>div{font-size:11.5px;line-height:1.9;color:var(--text-sub);padding-bottom:10px}
.imp-tmpl code{background:var(--bg-weak,#f3f4f6);border:1px solid var(--stroke-soft);border-radius:4px;padding:1px 5px;font-size:10.5px}

/* ============================================================
   5 Aug revision — Create Shipment wizard + Workflow master
   ============================================================ */
/* ---- Wizard overlay chrome ---- */
.c4w .cs-full-head{gap:16px}
.c4w-crumb{font-size:11px;color:var(--text-soft);margin-bottom:2px}
.c4w-crumb b{color:var(--text-strong-950);font-weight:700}
.badge-4w{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:20px;background:var(--bg-weak);border:1px solid var(--stroke-soft);font-size:11px;font-weight:600;color:var(--text-sub)}
.badge-4w .mono{font-family:var(--mono);font-size:10.5px}
.cs-full-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:13px 24px;border-top:1px solid var(--stroke-soft);background:#fff;flex-shrink:0}
.cs-full-foot .lead{font-size:12.5px;color:var(--text-soft)}
.cs-full-foot .btn-row{display:flex;gap:10px}
.c4w-single{max-width:880px;margin:0 auto;width:100%;background:#fff;border:1px solid var(--stroke-soft);border-radius:16px;padding:24px}
/* step indicator (from route-mockup) */
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px}
.steps .dot{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--stroke-soft);color:var(--text-sub);background:#fff}
.steps .lbl{font-size:13px;color:var(--text-sub)}
.steps li.current .dot{background:var(--primary-main);border-color:var(--primary-main);color:#fff}
.steps li.current .lbl{color:var(--text-strong-950);font-weight:600}
.steps li.done .dot{background:var(--success-base);border-color:var(--success-base);color:#fff}
.steps .chev{color:var(--text-soft-400);font-size:14px}
.c4w-steps{margin-left:auto}
@media(max-width:820px){.c4w-steps .lbl{display:none}}
/* section header */
.c4-sec-h{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--stroke-soft);margin-bottom:14px;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--text-strong-950)}
.c4-sec-h .req{margin-left:auto;font-size:11px;color:var(--text-soft);font-weight:500;font-family:var(--mono)}
.c4-fnote{font-size:11px;color:var(--text-soft);margin-top:5px}
/* type cards */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.type-grid{grid-template-columns:1fr}.c4-grid-3{grid-template-columns:1fr!important}}
.type-card{border:1px solid var(--stroke-soft);border-radius:12px;padding:14px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:8px}
.type-card.soon{opacity:.6;cursor:default;background:var(--bg-weak)}
.type-card.selected{border-color:var(--primary-main);box-shadow:0 0 0 2px var(--primary-lighter)}
.type-card .head{display:flex;align-items:center;gap:8px}
.type-card .radio{width:16px;height:16px;border-radius:999px;border:1.5px solid var(--stroke-sub);flex:0 0 auto;display:grid;place-items:center}
.type-card.selected .radio{border-color:var(--primary-main)}
.type-card.selected .radio::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--primary-main)}
.type-card .name{font-size:15px;font-weight:700}
.type-card .code{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em}
.type-card .desc{font-size:12px;line-height:1.45;color:var(--text-sub)}
.type-card .conseq{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.45;color:var(--text-strong-950);padding-top:8px;border-top:1px solid var(--stroke-soft);margin-top:auto}
.type-card .conseq .k{font-family:var(--mono);font-size:9px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em;flex:0 0 auto;padding-top:2px}
/* alert 4W */
.alert-4w{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;background:var(--bg-weak);color:var(--text-strong-950);margin-top:14px}
.alert-4w .ico{flex:0 0 auto;width:18px;height:18px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--bg-strong-950,#0E121B);margin-top:1px}
.alert-4w.warn{background:var(--state-warning-lighter);color:var(--state-warning-dark)}
.alert-4w.warn .ico{background:var(--state-warning-base)}
.c4-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:6px}
.c4-rute-grid{grid-template-columns:1fr 1fr}
.c4-col-full{grid-column:1/-1}
/* toggle cards */
.c4-toggle-card,.c4-opt-card{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--stroke-soft);border-radius:11px;padding:13px 15px;background:var(--bg-weak)}
.c4-opt-card{margin-top:14px}
.c4-toggle-t{font-size:13px;font-weight:700;color:var(--text-strong-950)}
.c4-toggle-d{font-size:11.5px;color:var(--text-soft);line-height:1.5;margin-top:3px;max-width:520px}
/* map */
.c4-map{position:relative;border:1px solid var(--stroke-soft);border-radius:12px;overflow:hidden;background:#F7F5FC}
.c4-map-badge{position:absolute;right:12px;bottom:12px;background:#fff;border:1px solid var(--stroke-soft);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:700;font-family:var(--mono);color:var(--primary-main);box-shadow:0 1px 3px rgba(14,18,27,.08)}
/* summary rail */
.rail-card{border:1px solid var(--stroke-soft);border-radius:12px;background:#fff;overflow:hidden}
.rail-card .rc-head{padding:11px 14px;border-bottom:1px solid var(--stroke-soft);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-sub);background:var(--bg-weak)}
.rail-card .rc-body{padding:4px 14px 10px}
.rc-note{font-size:11px;color:var(--text-soft);line-height:1.5;padding:8px 0 6px;border-bottom:1px solid var(--stroke-soft)}
