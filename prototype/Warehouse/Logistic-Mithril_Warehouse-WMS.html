  return String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1);
};
const isExpired = (dateStr) => !!dateStr && new Date(dateStr).getTime() < Date.now();
const daysUntil = (dateStr) => (dateStr ? Math.round((new Date(dateStr).getTime() - Date.now()) / DAY) : null);
const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const clone = (o) => JSON.parse(JSON.stringify(o));

let UID = 0;
const uid = (p) => `${p || 'id'}_${(++UID).toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
const ALNUM = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const randAlnum = (n) => Array.from({ length: n }, () => ALNUM[Math.floor(Math.random() * ALNUM.length)]).join('');
const randHex = (n) => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
const fmtBytes = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const slugFile = (name) => String(name || 'dokumen.pdf').toLowerCase().replace(/\.pdf$/i, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) + '.pdf';
const dayIso = (offsetDays) => new Date(Date.now() + offsetDays * DAY).toISOString().slice(0, 10);
const toNum = (v) => { const t = String(v == null ? '' : v).trim().replace(',', '.'); if (!t) return null; const n = Number(t); return Number.isFinite(n) ? n : NaN; };

/**

 * icon mengikuti pola app: `<i class="ri-… mr-1.5 text-[14px]">` → svg 14px + mr-1.5.
 */
function btn(o) {
  const tone = o.tone || 'primary';
  const style = o.style || 'filled';
  const size = o.size || 'md';
  const iconOnly = size.startsWith('icon');
  const icon = o.icon ? ic(o.icon, iconOnly ? 'size-4' : cx('!size-[14px]', o.label ? 'mr-1.5' : '')) : '';
  const a = attrs({
    type: 'button',
    'data-act': o.act,
    'data-nav': o.nav,
    'data-menu': o.menu,
    disabled: o.disabled,
    title: o.title,
    'aria-label': iconOnly ? o.title : undefined,

  return `<button ${a} class="${cx(BTN_BASE, BTN_SIZE[size], BTN_STYLE[style], BTN_TONE[tone + ':' + style], tone === 'neutral' ? 'focus-visible:ring-(--dash-slate-alpha-16)' : '', o.cls)}">${icon}${o.label ? esc(o.label) : ''}${o.after || ''}</button>`;

/* StepIndicator (design-system/step-indicator.tsx, horizontal) — wizard WMS */
function stepIndicator(steps, current, opt) {
  const o = opt || {};
  const bad = o.errorSteps || new Set();
  return `<ol data-slot="step-indicator" class="flex flex-row flex-wrap items-center gap-2">${steps
    .map((s, i) => {
      const n = i + 1;
      const status = n < current ? 'completed' : n === current ? 'current' : 'upcoming';
      const dot = status === 'completed' ? 'bg-(--state-success-base) text-static-white' : status === 'current' ? 'bg-(--theme-accent-base) text-static-white' : 'bg-bg-white-0 text-text-sub-600 border border-stroke-soft-200';
      const lbl = status === 'current' ? 'text-text-strong-950 font-medium' : status === 'completed' ? 'text-text-sub-600' : 'text-text-soft-400';
      const marker = `<span aria-hidden class="relative inline-flex size-5 shrink-0 items-center justify-center rounded-full text-xs font-medium ${dot}">${status === 'completed' ? ic('r:RiCheckLine', 'size-3') : n}${bad.has(n) ? '<span class="absolute -right-0.5 -top-0.5 size-2 rounded-full border border-bg-white-0 bg-(--state-error-base)"></span>' : ''}</span>`;
      const inner = `${marker}<span class="text-sm ${lbl}">${esc(s)}</span>`;
      const body = status === 'completed' && o.gotoAct
        ? `<button type="button" data-act="${o.gotoAct}" data-key="${n}" class="inline-flex items-center gap-2 rounded-md hover:underline underline-offset-4" title="Kembali ke langkah ini">${inner}</button>`
        : `<span class="inline-flex items-center gap-2" ${status === 'current' ? 'aria-current="step"' : ''}>${inner}</span>`;
      return `<li data-slot="step" data-status="${status}" class="flex items-center gap-2">${body}${i < steps.length - 1 ? `<span class="text-icon-soft-400">${ic('r:RiArrowRightSLine', 'size-5')}</span>` : ''}</li>`;
    })
    .join('')}</ol>`;
}
/** WizardFooter: Batal · Kembali · Lanjut — atau aksi submit di langkah terakhir. */
function wizardFooter(o) {
  const last = o.step >= o.total;
  return `<div class="flex w-full items-center justify-between gap-2"><div>${o.cancelAct ? btn({ label: 'Batal', tone: 'neutral', style: 'ghost', act: o.cancelAct }) : ''}</div><div class="flex items-center gap-2">${o.note ? `<span class="${metaCls} mr-1">${o.note}</span>` : ''}${o.step > 1 || o.backAlways ? btn({ label: 'Kembali', icon: 'r:RiArrowLeftLine', tone: 'neutral', style: 'stroke', act: o.backAct }) : ''}${
    last ? btn({ label: o.submitLabel, icon: o.submitIcon || 'r:RiCheckLine', act: o.submitAct, disabled: o.nextDisabled }) : btn({ label: 'Lanjut', act: o.nextAct, disabled: o.nextDisabled, after: ic('r:RiArrowRightLine', '!size-[14px] ml-1.5') })
  }</div></div>`;
}
/** Ringkasan error wizard: pesan dari langkah lain diberi label langkah asalnya. */

/* ══ Master: vendor (global, dipakai PO tipe Regular) ══ */
const PHONE_RE = /^(\+62|62|0)8[0-9]{7,12}$/;

function validateVendor(p, selfId) {
  const errs = [];
  const add = (field, message) => errs.push({ field, message });

  if (!name) add('name', 'Nama vendor wajib diisi.');
  else if (name.length > 120) add('name', 'Nama vendor maksimal 120 karakter.');
  else {
    const dup = db.vendors.find((v) => v.id !== selfId && v.name.trim().toLowerCase() === name.toLowerCase());
    if (dup) add('name', `Nama vendor sudah dipakai ${dup.code} (VENDOR_NAME_TAKEN).`);
  }
  if (String(p.phone || '').trim() && !PHONE_ANY_RE.test(normPhone(p.phone))) add('phone', 'Telepon harus nomor Indonesia (021… / 08… / +62…).');
  if (String(p.email || '').trim() && !EMAIL_RE.test(String(p.email).trim())) add('email', 'Format email tidak valid.');
  if (String(p.address || '').trim().length > 500) add('address', 'Alamat maksimal 500 karakter.');
  if (String(p.picName || '').trim().length > 120) add('picName', 'Nama PIC maksimal 120 karakter.');
  if (String(p.picPhone || '').trim() && !PHONE_ANY_RE.test(normPhone(p.picPhone))) add('picPhone', 'Telepon PIC harus nomor Indonesia (08… / +62…).');

/* ══ Outbound request intake: form manual, upload CSV, client API (next phase) ══

  if (!h) add('hub', 'Hub wajib dipilih.');

  if (type === 'TRANSFER') {
    const dh = hub(Number(p.destHubId));
    if (!dh) add('dest_hub', 'Hub tujuan wajib dipilih untuk outbound transfer.');

  else if (String(r.name).trim().length > 120) add('recipient_name', 'Nama penerima maksimal 120 karakter.');
  if (!PHONE_RE.test(normPhone(r.phone))) add('recipient_phone', 'Telepon harus nomor HP Indonesia (08… atau +628…).');

/* ── CSV: template, parse, preview (dry-run), commit — pola sama dengan import Shipments. Selalu REGULAR. ── */

  const rows = parseCsv(inp.text);
  if (!rows.length) { res.fileError = 'File kosong.'; return res; }

  const missing = CSV_REQUIRED.filter((k) => !header.includes(k));
  if (missing.length) { res.fileError = `Kolom wajib tidak ditemukan: ${missing.join(', ')}. Pakai template terbaru.`; return res; }

  const err = (row, field, value, message) => res.errors.push({ row, field, value: value == null ? '' : String(value), message });
  const groups = new Map();
  body.forEach((r, i) => {
    const rec = { rowNo: i + 2 };

    if (!groups.has(rec.external_id)) groups.set(rec.external_id, []);
    groups.get(rec.external_id).push(rec);
  });
  groups.forEach((recs, ext) => {
    const first = recs[0];
    const before = res.errors.length;
    const ord = { externalId: ext, rows: recs.map((r) => r.rowNo), recipient: first.recipient_name, address: first.destination_address, lineCount: recs.length, qty: sum(recs.map((r) => Number(r.qty) || 0)), status: 'NEW', existingCode: null, payload: null, errorCount: 0 };

      const p = {
        type: 'REGULAR', hubId: h.id, clientId: c.id, externalId: ext,
        recipient: { name: first.recipient_name, phone: first.recipient_phone },
        destination: { address: first.destination_address, lat: first.latitude, lng: first.longitude, notes: first.destination_notes },
        expectedDate: first.expected_delivery_date, serviceType: first.service_type || 'SAME_DAY', notes: first.notes,
        lines: recs.map((r) => ({ sku: r.sku, qty: r.qty })),

}

    candidates.forEach((s) => {
      if (remaining <= 0) return;

    });

  });

    throw new AppError('Stok available tidak cukup — tidak ada yang di-reserve (INSUFFICIENT_STOCK).', shortfalls);
  }

    id: uid('gi'),

    hubId: o.hubId,

    shippedAt: null,
    shipmentId: null,

  return g;

/* 1 ── WMS module: submit shipping. Hanya kenal port FulfillmentGateway. Satu transaksi:

function submitShipping(giId) {

  const h = hub(g.hubId);
  g.lines.forEach((l) => {
    const s = db.stocks.find((x) => x.id === l.stockId);

    client: { id: c.id, name: c.name }, hub: { id: h.id, name: h.name, code: h.code }, serviceType: o.serviceType,
    recipient: o.recipient, destination: o.destination,
    lines: o.lines.map((line) => { const k = skuOf(c.id, line.sku) || {}; return { sku: line.sku, itemName: k.name || line.sku, uomName: k.uom || 'pcs', qty: line.qty, weightKg: k.weightKg || null }; }),

/* 3 ── WMS port masuk: update status pengiriman (WMS hanya kenal "fulfillment", bukan shipment) */

/* ── shipment lanjut di flow logistic (simulasi presenter: Dispatched → In delivery → Delivered / Failed) ── */
const SH_STEPS = {

  IN_DELIVERY: { label: 'In delivery (rider berangkat)', short: 'In delivery', icon: 'r:RiTruckLine' },

}
function advanceShipment(id, step) {

  const from = sh.status;
  const push = (status, text, by) => sh.timeline.push({ at: nowIso(), status, fromStatus: from, title: null, note: text, by: by || 'System' });
  if (step === 'DISPATCH') {
    sh.status = 'DISPATCHED'; sh.dispatchedAt = nowIso(); sh.riderCode = sh.riderCode || 'RDR-0042';

/* ══ Supply & inbound: PO (Regular / Return; Transfer otomatis) → inbound request → goods receipt ══ */
const PO_FIELD_STEP = { type: 1, client: 1, hub: 1, vendor: 1, returned_from: 1, est_arrival: 1, notes: 1, lines: 2, sku: 2, qty: 2 };
function poSourceOf(x) {
  if (x.type === 'TRANSFER') { const h = hub(x.sourceHubId); return { label: 'Hub asal', value: h ? h.name : x.supplier, sub: h ? h.code : null }; }
  if (x.type === 'RETURN') return { label: 'Diterima dari', value: x.returnedFrom || x.supplier, sub: null };
  const v = vendor(x.vendorId);
  return { label: 'Vendor', value: v ? v.name : x.supplier, sub: v ? v.code : null };
}
function validatePO(p) {
  const errs = [];
  const add = (field, message, line) => errs.push({ field, message, line });
  const type = p.type || 'REGULAR';
  const c = client(Number(p.clientId));
  if (type === 'TRANSFER') add('type', 'PO transfer terbit otomatis dari outbound transfer di hub asal — tidak bisa dibuat manual.');
  else if (!PO_TYPE_META[type]) add('type', 'Tipe PO harus REGULAR atau RETURN.');
  if (!c) add('client', 'Client wajib dipilih.');
  const h = hub(Number(p.hubId));
  if (!h) add('hub', 'Hub tujuan wajib dipilih.');
  else if (!db.storages.some((s) => s.hubId === h.id && s.status === 'ACTIVE')) add('hub', `${h.name} belum punya storage aktif.`);
  if (type === 'REGULAR') {
    const v = vendor(p.vendorId);
    if (!v) add('vendor', 'Vendor wajib dipilih.');
    else if (v.status !== 'ACTIVE') add('vendor', `Vendor ${v.name} nonaktif — pilih vendor aktif (VENDOR_INACTIVE).`);
  }
  if (type === 'RETURN') {
    const rf = String(p.returnedFrom || '').trim();
    if (!rf) add('returned_from', 'Diterima dari wajib diisi untuk PO Return.');
    else if (rf.length > 120) add('returned_from', 'Diterima dari maksimal 120 karakter.');
  }
  if (p.estArrival && Number.isNaN(Date.parse(p.estArrival))) add('est_arrival', 'Est. arrival tidak valid.');
  const lines = (p.lines || []).filter((l) => l.sku || String(l.qty == null ? '' : l.qty).trim() !== '');
  if (!lines.length) add('lines', 'Minimal satu baris SKU.');
  const seen = new Set();
  lines.forEach((l, i) => {
    const pre = `Baris ${i + 1}: `;
    if (!l.sku) add('sku', `${pre}SKU wajib dipilih.`, i);
    else if (c && !skuOf(c.id, l.sku)) add('sku', `${pre}SKU ${l.sku} tidak ada di katalog ${c.name} (SKU_NOT_IN_CATALOG).`, i);
    else if (seen.has(l.sku)) add('sku', `${pre}SKU ${l.sku} dobel — gabungkan qty-nya.`, i);
    if (l.sku) seen.add(l.sku);
    if (!(Number(l.qty) > 0)) add('qty', `${pre}Qty harus lebih dari 0.`, i);

}

  const errs = [];
  const add = (field, message) => errs.push({ field, message, step: GR_FIELD_STEP[field] || 2 });
  const lines = (p.lines || []).filter((l) => Number(l.qty) > 0);
  if (!lines.length) add('lines', 'Isi qty diterima minimal satu baris.');

  lines.forEach((l) => { bySku[l.sku] = (bySku[l.sku] || 0) + Number(l.qty); });

    g.lines.push({ sku: l.sku, name: skuName(x.clientId, l.sku), uom: skuUom(x.clientId, l.sku), qty: q, expiry: l.expiry || null, storageId: st.id, lot });

  });

    orEvent(outbound(x.transferOutboundId), null, `Diterima di ${hub(x.hubId).name}`, `${g.code} · ${fmtQty(sum(g.lines.map((l) => l.qty)))} unit · PO transfer ${x.code} ${IR_LABEL[x.grStatus].toLowerCase()}`);

      items: Array.from({ length: n }, (_, i) => ({ id: uid('it'), code: `${wb}-${pad2(i + 1)}`, name: `PO-${booking}-${i + 1}`, sku: null, invoice: booking, qty: 1, koli: 2, weight: 4.2, status: itemStatus })),
      timeline: [{ at: nowIso(), status: 'CREATED', fromStatus: null, title: null, note: upl ? `CSV import ${upl}` : 'H2H create', by: 'client:' + c.code }],
      dispatchedAt: ['DISPATCHED', 'IN_DELIVERY', 'FAILED', 'COMPLETED'].includes(status) ? nowIso() : null, riderCode: ['DISPATCHED', 'IN_DELIVERY', 'FAILED', 'COMPLETED'].includes(status) ? 'RDR-0017' : null, createdAt: nowIso(), wms: null,
    };
    if (status !== 'CREATED') sh.timeline.push({ at: new Date(nowMs() + 2 * HOUR).toISOString(), status: status === 'AT_HUB' ? 'AT_HUB' : status, fromStatus: 'CREATED', title: null, note: status === 'AT_HUB' ? 'Inbound scan di hub' : 'Status dari delivery-service', by: 'System' });
    db.shipments.push(sh);
  }));
  db.shipments.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
  db.movements.sort((a, b) => (a.at < b.at ? 1 : -1));

  db.ui.refs = { scheduledPoId: po7.id, draftPoId: po8.id, shortfallId: o8.id, readyId: o4.id };
  save();
}

function loadDb() {
  try { OLD_STORE_KEYS.forEach((k) => localStorage.removeItem(k)); } catch (e) { /* storage terblokir */ }
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const ok = parsed && parsed.v === DB_VERSION && ['vendors', 'outbounds', 'pos', 'storages', 'stocks', 'skus', 'hubs', 'clients'].every((k) => Array.isArray(parsed[k])) && parsed.ui && parsed.ui.demo;
      if (ok) { db = parsed; return; }
    }
  } catch (e) { /* data rusak → reseed */ }
  seedAll();
}

function pageStorage() {

  const directQty = (s) => sum(db.stocks.filter((x) => x.storageId === s.id).map((x) => x.onHand));
  const subtreeQty = (s) => sum(db.stocks.filter((x) => { const t = storage(x.storageId); return t && t.hubId === s.hubId && (t.path === s.path || t.path.startsWith(s.path + '.')); }).map((x) => x.onHand));
  const hubHeader = (h) => `<div class="flex items-center gap-2 border-b border-stroke-soft-200 bg-bg-weak-50 px-4 py-2"><span class="text-icon-sub-600">${ic('l:warehouse', 'size-4')}</span><span class="text-[13px] font-semibold tracking-tight">${esc(h.name)}</span><span class="font-mono text-[11px] text-text-sub-600">${esc(h.code)}</span></div>`;
  const node = (s) => {
    const d = depth(s);
    const t = lineage(s).type;
    const own = directQty(s);
    const all = subtreeQty(s);
    return `<div class="grid grid-cols-[minmax(0,1.6fr)_90px_110px_70px_110px_110px_80px] items-center gap-3 border-b border-stroke-soft-200 px-4 py-2 last:border-b-0 hover:bg-bg-weak-50">

const OR_FLOW = [
  ['OPEN', 'Open', 'Order masuk (manual, CSV, atau API)'],
  ['PREPARING', 'Preparing', 'Picking order dibuat, stok di-reserve FEFO'],
  ['READY_TO_PICKUP', 'Ready to pick up', 'Picking selesai, surat jalan terbit'],
  ['SHIPPED', 'Shipped · AWB di Shipments', 'Stok dipotong, AWB lahir (At hub)'],
  ['IN_DELIVERY', 'In delivery', 'Mengikuti status shipment'],
  ['DELIVERED', 'Delivered', 'Shipment completed + POD'],
];
function orFlowSteps(o) {
  const idx = OR_FLOW.findIndex(([k]) => k === o.status);
  const terminalBad = o.status === 'CANCELLED' || o.status === 'FAILED';
  const lastIdx = terminalBad ? Math.max(0, OR_FLOW.findIndex(([k]) => k === (o.status === 'FAILED' ? 'IN_DELIVERY' : o.giId ? 'PREPARING' : 'OPEN'))) : idx;
  const steps = OR_FLOW.map(([k, title, desc]) => ({ title, desc: k === 'SHIPPED' && o.type === 'TRANSFER' ? 'Stok dipotong, AWB lahir + PO transfer terbit di hub tujuan' : desc }))
    .map((s, i) => ({ ...s, state: terminalBad ? (i < lastIdx ? 'done' : i === lastIdx ? 'failed' : 'pending') : i < idx || (i === idx && o.status === 'DELIVERED') ? 'done' : i === idx ? 'current' : 'pending' }));
  if (o.type === 'TRANSFER') {
    const tp = o.transferPoId ? po(o.transferPoId) : null;
    steps.push({ title: `Diterima di ${hub(o.destHubId).name}`, desc: tp ? `${tp.code} · receipt ${IR_LABEL[tp.grStatus] || '—'}` : 'Goods receipt PO transfer di hub tujuan', state: tp && tp.grStatus === 'FINISHED' ? 'done' : tp ? 'current' : 'pending' });
  }
  return steps;
}

function mfLocalCheck(step) {
  const d = view.draft;
  const out = [];
  const add = (field, message, line) => out.push({ field, message, line, step });
  if (step === 1) {
    if (!d.mfHub) add('hub', 'Hub wajib dipilih.');
    if (!d.mfClient) add('client', 'Client wajib dipilih.');
    if (d.mfType === 'TRANSFER') {
      if (!d.mfDestHub) add('dest_hub', 'Hub tujuan wajib dipilih.');
      else if (Number(d.mfDestHub) === Number(d.mfHub)) add('dest_hub', 'Hub tujuan harus beda dari hub asal.');
    }
    if (!d.mfDate) add('expected_delivery_date', 'Expected delivery wajib diisi.');
  }
  if (step === 2) {
    if (!String(d.mfName).trim()) add('recipient_name', 'Nama penerima wajib diisi.');
    if (!String(d.mfPhone).trim()) add('recipient_phone', 'Telepon wajib diisi.');
    if (!String(d.mfAddr).trim()) add('destination_address', 'Alamat tujuan wajib diisi.');
    const lat = toNum(d.mfLat);
    const lng = toNum(d.mfLng);
    if (lat === null) add('latitude', 'Latitude wajib diisi.'); else if (Number.isNaN(lat) || lat < -90 || lat > 90) add('latitude', 'Latitude harus angka -90…90.');
    if (lng === null) add('longitude', 'Longitude wajib diisi.'); else if (Number.isNaN(lng) || lng < -180 || lng > 180) add('longitude', 'Longitude harus angka -180…180.');
  }
  if (step === 3) {
    const filled = mfFilledLines();
    if (!filled.length) add('lines', 'Minimal satu produk.');
    d.mfLines.forEach((l, i) => {
      if (!l.sku && String(l.qty).trim() === '') return;
      if (!l.sku) add('sku', `Baris ${i + 1}: SKU wajib dipilih.`, i);
      if (!(Number(l.qty) > 0)) add('qty', `Baris ${i + 1}: qty harus > 0.`, i);
    });
  }
  return out;
}

      ${shortages.length ? alertBox('warning', 'Stok belum cukup (tidak memblokir)', `Order tetap bisa dibuat (Open), tapi Create picking order akan gagal sampai stok tersedia: ${shortages.map((x) => `<span class="font-mono">${esc(x.sku)}</span> butuh ${fmtQty(x.requested)}, tersedia ${fmtQty(x.available)}`).join(' · ')}.`) : `<p class="${metaCls}">SKU diambil dari katalog client. Qty dicek terhadap stok available (FEFO, tipe Storage) di hub sebagai peringatan, bukan reserve.</p>`}

        ['Expected delivery', d.mfDate ? fmtDate(d.mfDate) : null],
        ['Service', `<span class="font-mono">${esc(d.mfService)}</span>`],
        ['Catatan', d.mfNotes.trim() ? esc(d.mfNotes.trim()) : null],
      ])}</div>
      <div><p class="label-eyebrow">Penerima &amp; tujuan</p>${kvGrid([

      ${shortages.length ? alertBox('warning', 'Stok belum cukup', `Order tetap dibuat Open; Create picking order akan gagal sampai ada goods receipt. ${shortages.map((x) => `<span class="font-mono">${esc(x.sku)}</span> butuh ${fmtQty(x.requested)}, tersedia ${fmtQty(x.available)}`).join(' · ')}`) : ''}

    </div>`;

  return formModal({

function csvPreviewModal(d, c) {
  const pv = d.csvPreview;
  const s = pv.summary;
  const ORD_BADGE = { NEW: ['Baru', 'success'], EXISTS: ['Sudah ada', 'information'], ERROR: ['Error', 'error'] };
  const ordCols = [
    { key: 'ext', title: 'External ID', render: (o) => `<span class="${codeCls}">${esc(o.externalId)}</span>` },
    { key: 'rcp', title: 'Penerima', render: (o) => `<div><p class="${nameCls}">${esc(o.recipient || '—')}</p><p class="${metaCls} max-w-[220px] truncate">${esc(o.address || '')}</p></div>` },
    { key: 'rows', title: 'Baris CSV', render: (o) => `<span class="font-mono text-[11px] text-text-sub-600">${o.rows.join(', ')}</span>` },
    { key: 'lines', title: 'Lines / qty', align: 'right', render: (o) => `<span class="text-[13px] tabular-nums text-text-sub-600">${o.lineCount} / ${fmtQty(o.qty)}</span>` },
    { key: 'st', title: 'Status', render: (o) => `${badge(o.status === 'ERROR' ? `${o.errorCount} error` : ORD_BADGE[o.status][0], ORD_BADGE[o.status][1])}${o.existingCode ? `<p class="mt-0.5 font-mono text-[10px] text-text-soft-400">${esc(o.existingCode)}</p>` : ''}` },
  ];
  const errTable = pv.errors.length ? `<div class="overflow-hidden rounded-xl border border-stroke-soft-200">
      <div class="flex items-center justify-between border-b border-stroke-soft-200 bg-bg-weak-50 px-3 py-2"><p class="text-[12px] text-text-sub-600">${pv.errors.length} error memblokir import</p><button type="button" data-act="csvErrors" class="inline-flex items-center gap-1 text-xs font-semibold text-accent hover:underline">${ic('r:RiDownload2Line', 'size-3.5')}Download error CSV</button></div>
      <div class="max-h-[220px] overflow-auto"><table class="w-full text-left text-[12px]"><thead class="sticky top-0 bg-bg-weak-50 text-[11px] font-medium text-text-soft-400"><tr><th class="px-3 py-2">Row</th><th class="px-3 py-2">Field</th><th class="px-3 py-2">Value</th><th class="px-3 py-2">Reason</th></tr></thead><tbody>${pv.errors.map((e) => `<tr class="border-t border-stroke-soft-200"><td class="px-3 py-1.5 tabular-nums text-text-sub-600">${e.row}</td><td class="px-3 py-1.5 font-mono text-[11px]">${esc(e.field)}</td><td class="px-3 py-1.5 font-mono text-[11px] text-text-sub-600">${e.value ? esc(e.value) : '<span class="italic text-text-soft-400">kosong</span>'}</td><td class="px-3 py-1.5 text-(--state-error-dark)">${esc(e.message)}</td></tr>`).join('')}</tbody></table></div>
    </div>` : '';
  const canImport = !s.errors && s.toCreate > 0;
  return formModal({
    width: 'max-w-4xl', icon: 'r:RiUpload2Line', title: 'Preview upload CSV',
    desc: `${d.csvFileName} · ${c.name} · ${hub(Number(d.csvHub)).name} · ${s.rows} baris di-parse menjadi ${s.orders} order`,
    body: `<div class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">${sumTile('Order baru', s.toCreate, 'success')}${sumTile('Sudah ada · dilewati', s.existing, 'information')}${sumTile('Error', s.errors, s.errors ? 'error' : 'neutral')}${sumTile('Peringatan stok', s.warnings, s.warnings ? 'warning' : 'neutral')}</div>
      ${pv.ignoredColumns.length ? alertBox('warning', 'Kolom tidak dikenal diabaikan', `<span class="font-mono">${pv.ignoredColumns.map(esc).join(', ')}</span>`) : ''}
      ${errTable}
      ${s.errors ? alertBox('warning', 'Import all-or-nothing', 'Perbaiki semua error di file lalu upload ulang. Tidak ada order yang dibuat selama masih ada error.') : ''}
      ${!s.errors && !s.toCreate ? alertBox('information', 'Tidak ada order baru', 'Semua external_id di file ini sudah ada — tidak ada yang dibuat ulang.') : ''}
      ${pv.warnings.length ? alertBox('information', 'Stok belum cukup (tidak memblokir)', `Order tetap dibuat Open; Create picking order akan gagal sampai stok tersedia. ${pv.warnings.map((w) => `<span class="font-mono">${esc(w.sku)}</span> total ${fmtQty(w.requested)}, tersedia ${fmtQty(w.available)}`).join(' · ')}`) : ''}
      <div class="overflow-hidden rounded-xl border border-stroke-soft-200"><div class="max-h-[260px] overflow-auto px-2 pb-2">${table({ columns: ordCols, rows: pv.orders })}</div></div>
    </div>`,
    footer: `${btn({ label: 'Ganti file', icon: 'r:RiArrowLeftLine', tone: 'neutral', style: 'stroke', act: 'csvBack' })}<span class="flex-1"></span>${btn({ label: 'Batal', tone: 'neutral', style: 'stroke', act: 'closeModal' })}${btn({ label: canImport ? `Import ${s.toCreate} order` : 'Import', icon: 'r:RiCheckLine', act: 'csvCommit', disabled: !canImport })}`,
  });
}

/* GR wizard: Inbound request → Put-away → Penerimaan → Review */
const GR_STEPS = ['Inbound request', 'Put-away', 'Penerimaan', 'Review'];
const PDF_BLOBS = new Map();
const localNow = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
function grDefaultStorages(x) {
  const all = activeStoragesOf(x.hubId);
  if (x.type === 'RETURN') { const q = all.filter((s) => lineage(s).type === 'QUARANTINE'); if (q.length) return q; }
  const bins = all.filter((s) => s.category === 'BIN' && lineage(s).type === 'STORAGE');
  return bins.length ? bins : all.filter((s) => lineage(s).type === 'STORAGE').concat(all).slice(0, 1);
}
function grDraftFor(poId) {
  const d = view.draft;
  if (d.grPo === poId && d.grLines) return;
  const x = po(poId);
  const defaults = grDefaultStorages(x);
  Object.assign(d, { grPo: poId, grStep: 2, grArrival: localNow(), grDn: '', grDoc: null, grUpload: null, grNotes: '', grClose: false, grErrors: null });
  d.grLines = x.lines.filter((l) => l.qty - l.received > 0).map((l, i) => {
    const k = skuOf(x.clientId, l.sku) || {};
    return { key: uid('grl'), sku: l.sku, qty: l.qty - l.received, expiry: k.expiry ? dayIso(365) : '', storageId: (defaults[i % Math.max(1, defaults.length)] || {}).id || '' };
  });
}
function grLocalCheck(step) {
  const d = view.draft;
  const x = po(d.grPo);
  const out = [];
  const add = (field, message) => out.push({ field, message, step });
  if (step === 2) {
    const filled = d.grLines.filter((l) => Number(l.qty) > 0);
    if (!filled.length) add('lines', 'Isi qty diterima minimal satu baris.');
    d.grLines.forEach((l) => { if (String(l.qty).trim() !== '' && !(Number(l.qty) >= 0)) add('qty', `${l.sku}: qty harus angka ≥ 0.`); });
    filled.forEach((l) => { if (!l.storageId) add('storage', `${l.sku}: storage tujuan wajib dipilih.`); });
    const totals = {};
    filled.forEach((l) => { totals[l.sku] = (totals[l.sku] || 0) + Number(l.qty); });
    Object.entries(totals).forEach(([sku, q]) => { if (q > poRemaining(x, sku)) add('qty', `${sku}: total ${fmtQty(q)} melebihi sisa PO ${fmtQty(poRemaining(x, sku))}.`); });
  }
  if (step === 3) {
    if (d.grUpload && !d.grUpload.error) add('delivery_note', 'Tunggu upload PDF selesai.');
    if (d.grUpload && d.grUpload.error) add('delivery_note', 'Hapus file yang gagal diunggah atau pilih PDF lain.');
  }
  return out;
}
function grRemainingAfter(x, lines) {
  return x.lines.filter((l) => l.qty - l.received > 0).map((l) => ({ sku: l.sku, uom: skuUom(x.clientId, l.sku), left: Math.max(0, l.qty - l.received - sum(lines.filter((f) => f.sku === l.sku).map((f) => Number(f.qty) || 0))) })).filter((r) => r.left > 0);
}

/* ── PDF demo: upload disimulasikan (progress), file dibuka dari blob URL; tanpa file → PDF contoh ── */
function samplePdfText(title, sub) {
  const clean = (s) => String(s).replace(/[^\x20-\x7e]/g, '').replace(/[()\\]/g, '');
  const content = `BT /F1 20 Tf 56 770 Td (${clean(title)}) Tj ET\nBT /F1 11 Tf 56 744 Td (${clean(sub)}) Tj ET\nBT /F1 10 Tf 56 720 Td (Dokumen contoh - mockup Dash Logistic WMS) Tj ET`;
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>', '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>', `<< /Length ${content.length} >>\nstream\n${content}\nendstream`, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];
  let out = '%PDF-1.4\n';
  const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n${offs.map((n) => `${String(n).padStart(10, '0')} 00000 n \n`).join('')}trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return out;
}
function samplePdfFile(name, sub) {
  const blob = new Blob([samplePdfText('Surat jalan supplier', sub || name)], { type: 'application/pdf' });
  try { return new File([blob], name, { type: 'application/pdf' }); } catch (e) { blob.name = name; return blob; }
}
function startPdfUpload(file) {
  const d = view.draft;
  if (!file) return;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  if (!isPdf) { d.grUpload = { token: null, name: file.name || 'file', size: file.size || 0, progress: 0, error: 'File harus PDF.' }; d.grDoc = null; render(); return; }
  if (file.size > 10 * 1024 * 1024) { d.grUpload = { token: null, name: file.name, size: file.size, progress: 0, error: 'Maksimal 10 MB.' }; d.grDoc = null; render(); return; }
  const token = uid('upl');
  let blobUrl = null;
  try { blobUrl = URL.createObjectURL(file); } catch (e) { blobUrl = null; }
  d.grDoc = null;
  d.grUpload = { token, name: file.name, size: file.size, progress: 0, error: null };
  render();
  const tick = () => {
    const u = view.draft.grUpload;
    if (!u || u.token !== token) return;
    u.progress = Math.min(100, u.progress + 20);
    if (u.progress >= 100) {
      const url = `https://storage.googleapis.com/logistic-bucket-main/logistic/${randHex(8)}-${slugFile(file.name)}`;
      if (blobUrl) PDF_BLOBS.set(url, blobUrl);
      view.draft.grDoc = { url, name: file.name, size: file.size };
      view.draft.grUpload = null;
      view.draft.grErrors = (view.draft.grErrors || []).filter((e) => e.field !== 'delivery_note');
      render();
      toast('PDF tersimpan', 'success', `${esc(file.name)} · ${fmtBytes(file.size)}`);
      return;
    }
    render();
    setTimeout(tick, 160);
  };
  setTimeout(tick, 160);
}
function openPdf(url, name) {
  let blobUrl = PDF_BLOBS.get(url);
  if (!blobUrl) {
    // File seed / hasil reload: blob tidak ada di sesi ini → tampilkan PDF contoh dengan nama yang sama.
    try { blobUrl = URL.createObjectURL(samplePdfFile(name || 'surat-jalan.pdf', `${name || ''} (salinan demo)`)); PDF_BLOBS.set(url, blobUrl); } catch (e) { blobUrl = null; }
  }
  const w = blobUrl ? window.open(blobUrl, '_blank') : null;
  if (!w) toast('Browser memblokir tab baru', 'warning', 'Izinkan pop-up untuk halaman ini lalu klik Buka PDF lagi.');
}

// QR tiruan deterministik (mockup tanpa library). Di web: paket `qrcode` yang sudah terpasang.
function fakeQr(text, size) {
  const n = 25;
  let h = 2166136261;
  const bits = [];
  for (let i = 0; i < n * n; i += 1) { h ^= (text.charCodeAt(i % text.length) + i) & 255; h = Math.imul(h, 16777619) >>> 0; bits.push(h & 1); }
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  const ring = (x, y) => { const fx = x >= n - 7 ? x - (n - 7) : x; const fy = y >= n - 7 ? y - (n - 7) : y; return fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4); };
  let rects = '';
  for (let y = 0; y < n; y += 1) for (let x = 0; x < n; x += 1) { const on = finder(x, y) ? ring(x, y) : bits[y * n + x]; if (on) rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 ${n} ${n}" width="${size}" height="${size}" shape-rendering="crispEdges" fill="#171717">${rects}</svg>`;
}

function printPaper(kind, id) {

const OR_ORDER = ['OPEN', 'PREPARING', 'READY_TO_PICKUP', 'SHIPPED', 'IN_DELIVERY', 'DELIVERED'];
const DEMO_ACTS = [
  { key: 1, title: 'Inbound', sub: 'Vendor → PO + SKU baru → confirm → goods receipt ke location + PDF' },
  { key: 2, title: 'Outbound', sub: 'Order (validasi) → picking FEFO → ready → ship → AWB → delivered' },

const gcode = (s) => `<span class="rounded bg-bg-weak-50 px-1 font-mono text-[10.5px] text-text-strong-950">${esc(s)}</span>`;
const gstrong = (s) => `<span class="font-semibold text-text-strong-950">${esc(s)}</span>`;

  if (!o) return '#/warehouse/outbound-request';

  const miniBody = cur

    </div>

      const on = a.key === act;

    }).join('')}</div>
    <div class="${cx('overflow-y-auto px-4 py-3', full ? 'max-h-[48vh]' : 'max-h-[34vh]')}" id="guide-body">
      ${full ? `<p class="mb-3 ${metaCls}">${esc(meta.sub)}</p>${flowSteps(flow)}${doneBox}${bonus}` : miniBody}

  </div>`;
}

  sendApiOrder: () => {

  deletePickingConfirm: (el) => { const g = gi(idOf(el)); guard(() => { commit(() => deletePicking(g.id)); view.modal = null; toast('Picking dihapus', 'information', 'Reserve dilepas.'); go('#/warehouse/outbound-request/' + g.outboundId); }); },
  readyToPickup: (el) => { guard(() => { commit(() => readyToPickup(idOf(el))); const g = gi(idOf(el)); toast('Ready to pick up', 'success', `Surat jalan ${esc(g.suratJalan)} terbit — dokumen pindah ke Shipping.`); go('#/warehouse/shipping/' + g.id); }); },

  },
  bulkSubmitShipping: () => {

    });
  },
  // ── purchase order: wizard ──
  openCreatePo: () => { dropDraft('po'); view.modal = { type: 'createPo' }; render(); },
  poType: (el) => { const d = view.draft; const t = keyOf(el); if (t === 'TRANSFER') return; d.poType = t; d.poErrors = (d.poErrors || []).filter((e) => !['vendor', 'returned_from', 'type'].includes(e.field)); render(); },
  poClientChange: () => { Object.assign(view.draft, { poLines: [{ sku: '', qty: '' }], poSku: null, poSkuLine: null }); view.draft.poErrors = (view.draft.poErrors || []).filter((e) => e.field !== 'client'); render(); },
  poVendorToggle: () => {

  },
  poPickVendor: (el) => { const d = view.draft; Object.assign(d, { poVendor: idOf(el), poVendorOpen: false, poVendorQ: '' }); d.poErrors = (d.poErrors || []).filter((e) => e.field !== 'vendor'); render(); },
  poVendorManage: () => { view.modal = null; go('#/warehouse/vendor'); toast('Draft PO disimpan sementara', 'information', 'Buka Create PO lagi setelah menambah vendor.'); },
  poLineSku: (el) => {
    const d = view.draft;
    const i = Number(el.getAttribute('data-i'));
    if (el.value === NEW_SKU) {
      d.poLines[i].sku = '';
      d.poSku = skuDraftEmpty();
      d.poSkuLine = i;
      render();
      const f = document.querySelector('[data-fk="draft.poSku.code"]'); if (f) f.focus();
      return;
    }
    d.poErrors = (d.poErrors || []).filter((e) => e.line !== i);
    render();

  poNewSku: () => {
    const d = view.draft;
    let i = d.poLines.findIndex((l) => !l.sku);
    if (i < 0) { d.poLines.push({ sku: '', qty: '' }); i = d.poLines.length - 1; }
    d.poSku = skuDraftEmpty();
    d.poSkuLine = i;
    render();
    const f = document.querySelector('[data-fk="draft.poSku.code"]'); if (f) f.focus();
  },
  poSkuCancel: () => { Object.assign(view.draft, { poSku: null, poSkuLine: null }); view.draft.poErrors = null; render(); },
  poSkuSave: () => {
    const d = view.draft;
    const cid = Number(d.poClient);
    try {
      const k = commit(() => createSku(skuPayload(cid, d.poSku)));
      const i = d.poSkuLine != null && d.poLines[d.poSkuLine] ? d.poSkuLine : d.poLines.length;

      d.poSku.errors = e.details || [{ field: '', message: e.message }];

  poAddLine: () => { view.draft.poLines.push({ sku: '', qty: '' }); render(); },
  poDelLine: (el) => {

    if (d.poSkuLine === i) Object.assign(d, { poSku: null, poSkuLine: null });

  poNext: () => {

  poBack: () => { const d = view.draft; d.poErrors = null; d.poStep = Math.max(1, d.poStep - 1); render(); scrollTopOf('modal-body'); },

    const pre = [...poLocalCheck(1), ...poLocalCheck(2)];

    let x;
    try {
      x = commit(() => createPO({ type: d.poType, clientId: Number(d.poClient), hubId: Number(d.poHub), vendorId: d.poVendor, returnedFrom: d.poReturnedFrom, estArrival: d.poEta ? new Date(`${d.poEta}T10:00:00`).toISOString() : null, notes: d.poNotes, lines: poFilledLines() }));

      if (!(e instanceof AppError)) throw e;
      d.poErrors = (e.details && e.details.length ? e.details : [{ field: '', message: e.message, step: 1 }]).map((y) => ({ ...y, step: y.step || 1 }));
      d.poStep = minStep(d.poErrors);
      render();
      toast('Server menolak — 422 VALIDATION', 'error', `${d.poErrors.length} isian perlu diperbaiki`);
      return;

  // ── goods receipt: wizard ──
  grSplit: (el) => {
    const d = view.draft;
    const i = Number(el.getAttribute('data-i'));
    const l = d.grLines[i];
    const x = po(d.grPo);
    const pool = activeStoragesOf(x.hubId).filter((s) => lineage(s).type === (lineage(storage(l.storageId) || {}).type ? lineage(storage(l.storageId)).type : 'STORAGE'));
    const list = pool.length ? pool : activeStoragesOf(x.hubId);
    const next = list[(list.findIndex((b) => b.id === l.storageId) + 1) % list.length];
    const total = Number(l.qty) || 0;
    const half = Math.floor(total / 2);
    d.grLines.splice(i + 1, 0, { key: uid('grl'), sku: l.sku, qty: total - half, expiry: l.expiry, storageId: next ? next.id : '' });
    l.qty = half;
    render();

  grGoto: (el) => { const d = view.draft; const n = Number(keyOf(el)); if (n === 1) { go('#/warehouse/goods-receipt/new'); return; } if (n < d.grStep) { d.grStep = n; d.grErrors = null; render(); } },
  grSamplePdf: () => { const d = view.draft; const dn = String(d.grDn || '').trim() || `SJ-SUP-${randAlnum(4)}`; startPdfUpload(samplePdfFile(`surat-jalan-${dn.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.pdf`, `${dn} · ${po(d.grPo) ? po(d.grPo).code : ''}`)); },

  submitGr: () => {
    const d = view.draft;
    const pre = [...grLocalCheck(2), ...grLocalCheck(3)];
    if (pre.length) { d.grErrors = pre; d.grStep = minStep(pre); render(); return; }
    const x = po(d.grPo);
    let g;
    try {
      g = commit(() => submitGR({ poId: d.grPo, dateArrival: d.grArrival ? new Date(d.grArrival).toISOString() : nowIso(), deliveryNote: d.grDn, deliveryNoteDoc: d.grDoc, notes: d.grNotes, closeBackorder: d.grClose, lines: d.grLines.map((l) => ({ sku: l.sku, qty: Number(l.qty), expiry: l.expiry || null, storageId: l.storageId })) }));

      if (!(e instanceof AppError)) throw e;
      d.grErrors = (e.details && e.details.length ? e.details : [{ field: '', message: e.message, step: 2 }]).map((y) => ({ ...y, step: y.step || 2 }));

      render();
      toast('Server menolak goods receipt', 'error', esc(e.message));
      return;
    }
    const dm = demo();
    const t = dm.transferId ? outbound(dm.transferId) : null;
    if (x.id === dm.poId) dm.grId = g.id;
    if (t && t.transferPoId === x.id) dm.transferGrId = g.id;
    if (x.id === dm.returnPoId) dm.returnGrId = g.id;
    save();
    dropDraft('gr');
    toast('Goods receipt posted', 'success', `${g.code} · ${g.lines.length} lot baru · stok on hand naik${x.type === 'RETURN' ? ' (karantina)' : ''}`);
    go('#/warehouse/goods-receipt/' + g.id);
  },
  // ── storage ──
  openCreateStorage: () => { ['stHub', 'stCat', 'stParent', 'stType', 'stCode', 'stName', 'stError'].forEach((k) => delete view.draft[k]); view.modal = { type: 'createStorage' }; render(); },
  submitCreateStorage: () => {
    const d = view.draft;
    const hubId = Number(d.stHub || (db.ui.hubId === 'all' ? 3 : db.ui.hubId));

      const s = commit(() => createStorage({ hubId, category: d.stCat || 'BIN', parentId: d.stParent, code: d.stCode, name: d.stName, type: d.stType }));

      render();
      toast('Storage dibuat', 'success', `${esc(storageOptionLabel(s))}`);
    } catch (e) {
      if (!(e instanceof AppError)) throw e;
      d.stError = e.message;
      render();
    }
  },
};
