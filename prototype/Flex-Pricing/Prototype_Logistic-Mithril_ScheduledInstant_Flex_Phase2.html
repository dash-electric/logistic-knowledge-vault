          <input class="c4-inp" value="${escv(st.name)}" placeholder="Nama / lokasi stop${c4.imported?' (auto-filled dari UJP)':''}" oninput="c4.stops[${i}].name=this.value">
          <select class="dev-select c4-sel" onchange="c4.stops[${i}].stepper=this.value;renderCreate4W()"><option value="">Pilih workflow…</option>${stepperOpts(st)}</select>
        </div>
        <div class="c4-stop-shipments">
          <div class="c4-stop-ship-lbl">Shipments di stop ini <span class="c4-src">diisi sistem saat route dibuat</span></div>

        </div>
        ${(()=>{const wfd=STEPPERS.find(w=>w.id===st.stepper);if(!wfd)return "";return `<div class="c4-wfprev"><div class="c4-wfprev-h">Preview workflow · ${wfd.steps.length} langkah</div>${wfd.steps.map((sp,k)=>`<div class="c4-wfstep"><span class="c4-wfno">${k+1}</span><div class="c4-wfbody"><div class="c4-wfname">${escv(sp.name)||'(langkah '+(k+1)+')'}</div><div class="c4-wffields">${sp.fields.map(fd=>{const m=ftMeta(fd.type);const cnt=fd.type==='image'&&(fd.max||1)>1?(fd.min!==fd.max?' 1+':' ×'+fd.max):'';return `<span class="c4-fchip">${m.ic} ${escv(fd.label)||m.l} <span class="c4-ftype">${m.l}${cnt}</span></span>`;}).join("")||'<span class="muted" style="font-size:11px">confirmation only</span>'}</div></div></div>`).join("")}</div>`;})()}
      </div>
      ${c4.stops.length>1?`<button class="sb-ic del" onclick="c4Del(${i})">✕</button>`:'<span style="width:26px"></span>'}
    </div>`;}).join("")+
    (hasMixedClient?`<div class="c4-mixed-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><div><b>Multi-client stop terdeteksi</b> — stop ini melayani shipment dari lebih dari satu client (${uniqueClients.join(", ")}).<br>V1: <code>workflow: null</code> — fallback ke POP/POD standar.</div></div>`:"");

      <div class="c4-stops">${stops}</div>
      <button class="sb-add-step" style="margin-top:10px" onclick="c4Add()">＋ Tambah stop</button>
    </div>
  </div>
  <div class="cs-side">${c4Rail()}</div>`;
}

/* schematic route map (SVG, no external tiles) */
function c4Map(){
  const n=c4.stops.length;
  const W=560,H=200,padX=48,padY=64;
  const xs=n>1?(W-2*padX)/(n-1):0;
  const ys=[0,-26,20,-14,14];
  const pts=c4.stops.map((st,i)=>({x:padX+xs*i,y:H/2+(ys[i%ys.length]||0),st}));
  const line=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const ret=c4.returnToOrigin&&n>1?`<path d="M${pts[n-1].x},${pts[n-1].y} C ${pts[n-1].x},${H-14} ${pts[0].x},${H-14} ${pts[0].x},${pts[0].y}" fill="none" stroke="var(--primary-main)" stroke-width="2" stroke-dasharray="5 5" opacity=".65"/>`:"";
  const pins=pts.map((p,i)=>{const lab=stopLabel(p.st);const fill=lab.c==="purple"?"#5E2AAC":lab.c==="amber"?"#B8740A":"#0b6f65";
    return `<g><circle cx="${p.x}" cy="${p.y}" r="15" fill="#fff" stroke="${fill}" stroke-width="2.5"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="12" font-weight="800" fill="${fill}">${i+1}</text><text x="${p.x}" y="${p.y-22}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#525866">${lab.t}</text></g>`;}).join("");
  return `<div class="c4-map">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto">
      <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E1E4EA" stroke-width="1"/></pattern></defs>
      <rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="#F7F5FC"/>
      <rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="url(#grid)"/>
      <polyline points="${line}" fill="none" stroke="#5E2AAC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${ret}${pins}
    </svg>
    <div class="c4-map-badge">${c4.km||"—"} km${c4.returnToOrigin?" + kembali ke origin":""}</div>
  </div>`;
}

function c4Rail(){
  const nPick=c4.stops.filter(s=>s.type==="PICKUP").length;
  const nDrop=c4.stops.length-nPick;
  const nWf=c4.stops.filter(s=>s.stepper).length;
  const is4W=c4.type==="DIRECT_4W";
  return `<div class="rail-card">
    <div class="rc-head">Ringkasan rute</div>
    <div class="rc-body">
      <div class="stat-row"><span class="k">Jumlah stop</span><span class="v">${c4.stops.length} <small>${nPick} pickup · ${nDrop} dropoff</small></span></div>
      <div class="stat-row"><span class="k">Client</span><span class="v" style="font-size:13px">${c4.client||"—"}</span></div>
      <div class="stat-row"><span class="k">Tipe pengiriman</span><span class="v" style="font-size:13px">${c4.shipmode||"—"}</span></div>
      <div class="stat-row"><span class="k">Jarak (KM)</span><span class="v">${c4.km||"—"} <small>km</small></span></div>
      <div class="stat-row"><span class="k">Kembali ke origin</span><span class="v" style="font-size:13px">${c4.returnToOrigin?"Ya":"Tidak"}</span></div>
      <div class="stat-row"><span class="k">Workflow terpasang</span><span class="v">${nWf} <small>dari ${c4.stops.length} stop</small></span></div>
    </div>
  </div>
  <div class="rail-card" style="margin-top:14px">
    <div class="rc-head">Dicek otomatis saat simpan</div>
    <div class="rc-body">
      <div class="rc-note">Sistem memeriksa aturan ini sebelum route dibuat — kalau ada yang gagal, route tidak tersimpan.</div>
      <div class="stat-row"><span class="k">Pickup sebelum dropoff-nya</span><span class="badge-pass">OK</span></div>
      <div class="stat-row"><span class="k">Tiap shipment punya pickup &amp; dropoff</span><span class="badge-pass">OK</span></div>
      <div class="stat-row"><span class="k">Workflow cocok dgn tipe stop</span><span class="badge-pass">OK</span></div>
    </div>
  </div>
  ${is4W?`<div class="alert-4w warn" style="margin-top:14px"><span class="ico">!</span><span><b>Cek kendaraan belum dilakukan.</b> Untuk rute 4W, driver wajib submit 7 item foto cek kendaraan (selfie, 4 sisi, bak muatan, odometer) di app sebelum bisa mulai stop pertama.</span></div>`:""}`;
}

/* ---------- STEP 3 · Review ---------- */
function c4Step3(){
  const kv=(k,v)=>`<div class="c4-rv-row"><span class="k">${k}</span><span class="v">${v||"—"}</span></div>`;
  const flowDriverLabel=(()=>{const chips=c4.stops.map((st,idx)=>{const l=stopLabel(st);const isLastDrop=st.type==="DROPOFF"&&c4.stops.slice(idx+1).every(x=>x.type!=="DROPOFF");const label=isLastDrop?"Completed":l.t;const cls=isLastDrop?"teal":l.c;return `<span class="flowchip ${cls}">${label}</span>`;});return chips.join('<span class="flow-arrow">→</span>');})();
  const stopRows=c4.stops.map((st,i)=>{const lab=stopLabel(st);const wfd=STEPPERS.find(w=>w.id===st.stepper);
    return `<div class="c4-rv-stop"><span class="c4-stop-no">${i+1}</span><div><div class="strong">${escv(st.name)||"(stop "+(i+1)+")"} <span class="flowchip ${lab.c}" style="margin-left:4px">${lab.t}</span></div><div class="muted" style="font-size:12px;margin-top:3px">Workflow: ${wfd?escv(wfd.name)+" · "+wfd.steps.length+" langkah":'<span style="color:var(--warning-base)">belum dipilih → fallback POP/POD</span>'}</div></div></div>`;}).join("");
  return `<div class="c4w-single c4w-review">
    <div class="alert-4w"><span class="ico">✓</span><span>Periksa ringkasan di bawah. <b>Buat shipment</b> akan membuat shipment + route + snapshot workflow ke tiap stop, siap dispatch &amp; aplikasi driver.</span></div>
    <div class="c4-rv-grid">
      <div class="c4-rv-card"><div class="c4-rv-h">Pengiriman</div>${kv("Tipe","DIRECT_4W")}${kv("Client",c4.client)}${kv("Booking ID",c4.booking)}${kv("Delivery type",c4.shipmode)}${kv("Tipe kontainer",c4.ctype)}${kv("Tanggal",c4.delivDate)}</div>
      <div class="c4-rv-card"><div class="c4-rv-h">Rute</div>${kv("Origin",c4.origin)}${kv("Destination",c4.dest)}${kv("Jarak",(c4.km||"—")+" km")}${kv("Return to origin",c4.returnToOrigin?"Ya":"Tidak")}</div>
      <div class="c4-rv-card"><div class="c4-rv-h">Kendaraan &amp; driver</div>${kv("Plat",c4.plat)}${kv("Jenis unit",c4.unit)}${kv("Driver",c4.driver)}${kv("Layanan",c4.layanan)}${kv("Shift",c4.shift)}</div>
    </div>

}

/* ---------- Footer per step ---------- */
function c4Foot(){
  if(c4.step===1){
    const ready=c4.imported&&c4.client&&c4.booking;
    return `<div class="cs-full-foot"><span class="lead">Tipe & data UJP terkunci; lengkapi Client + Booking untuk lanjut.</span>
      <div class="btn-row"><button class="btn" onclick="closeCreate4W()">Batal</button>
      <button class="btn primary" id="c4NextBtn" ${ready?`onclick="c4Go(2)"`:`disabled title="Import UJP + isi Client & Booking dulu"`}>Lanjut ke rute →</button></div></div>`;
  }
  if(c4.step===2){
    return `<div class="cs-full-foot"><span class="lead">Totals dihitung ulang server-side saat save — rail ini preview.</span>
      <div class="btn-row"><button class="btn" onclick="c4Go(1)">← Kembali</button>
      <button class="btn primary" onclick="c4Go(3)">Review rute →</button></div></div>`;
  }
  return `<div class="cs-full-foot"><span class="lead">Shipment + route dibuat dari data ini.</span>
    <div class="btn-row"><button class="btn" onclick="c4Go(2)">← Kembali</button>
    <button class="btn primary" onclick="c4Submit()">Buat shipment</button></div></div>`;
}

/* live-toggle the step-1 Next button without a full re-render (keeps input focus) */
function c4SyncNext(){if(c4.step!==1)return;const b=document.getElementById("c4NextBtn");if(!b)return;const ready=c4.imported&&c4.client&&c4.booking;b.disabled=!ready;b.onclick=ready?(()=>c4Go(2)):null;if(ready)b.removeAttribute("title");else b.title="Import UJP + isi Client & Booking dulu";}
/* ---------- Stop editing (step 2) ---------- */
function c4Type(i,t){c4.stops[i].type=t;if(!STEPPERS.find(s=>s.id===c4.stops[i].stepper&&s.type===t)){c4.stops[i].stepper="";}renderCreate4W();}
function c4Add(){c4.stops.push({type:"DROPOFF",stepper:"",name:""});renderCreate4W();}
function c4Del(i){c4.stops.splice(i,1);renderCreate4W();}
function c4Submit(){
  if(!c4.imported){toast("Import dari UJP dulu — shipment 4W butuh request yang sudah di-approve",false);return;}
  if(!c4.client){toast("Pilih client dulu",false);return;}
  const flow=c4.stops.map(s=>stopLabel(s).t).join(" · ");
  closeCreate4W();toast(`Shipment 4W dibuat · ${c4.stops.length} stop (${flow})${c4.returnToOrigin?" · kembali ke origin":""} · siap dispatch & driver app`);
}

.si-cal-row .t{font-size:10.5px;color:var(--text-soft);padding:8px;font-family:var(--mono);border-top:1px solid var(--stroke-soft)}
.si-cal-cell{border-left:1px solid var(--stroke-soft);border-top:1px solid var(--stroke-soft);padding:6px}
.si-slotchip{border-left:3px solid var(--primary-base);background:var(--state-feature-lighter);border-radius:7px;padding:6px 8px;font-size:11px;margin-bottom:5px;cursor:pointer}
.si-slotchip.g{border-left-color:var(--state-success-base)}.si-slotchip.o{border-left-color:var(--state-warning-base)}.si-slotchip.r{border-left-color:var(--state-error-base)}
.si-slotchip .tt{font-weight:700}.si-slotchip .rr{color:var(--text-sub)}
/* drawer bits */
.si-sd-sec{margin-bottom:18px}
.si-sd-h{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text-soft);margin-bottom:9px}
.si-rider{display:flex;align-items:center;gap:10px;border:1px solid var(--stroke-soft);border-radius:var(--radius-10);padding:10px 12px;margin-bottom:8px}
.si-kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--stroke-soft)}
.si-kv:last-child{border:none}.si-kv .k{color:var(--text-sub)}.si-kv .v{font-weight:700}
.si-photo{border:1.5px dashed var(--stroke-sub);border-radius:var(--radius-10);padding:14px;text-align:center;color:var(--text-soft);font-size:12.5px;cursor:pointer}
.si-photo.on{border-style:solid;border-color:var(--state-success-base);background:#E0FAEF;color:#176448;font-weight:700}
.si-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-sub);margin-bottom:12px}
.si-mini{font-size:11px;color:var(--text-soft)}
</style>
<script>
/* ===== Scheduled Instant · Flex enhancement ===== */
let siTab='slot', siView='table', siFClient='all', siFOt=false, siDrawerIdx=null;
const SI_SEL=new Set();
const SI_RATE_FMT=n=>'Rp '+(n||0).toLocaleString('id-ID');
let SI_SLOTS=[
 {id:'S1',klien:'MAP Boga',flex:true,rate:200000,ot:35000,otMode:'time',minH:6,jam:'08:00–16:00',utama:'Abilillah Pramata',cadangan:'Giar Juliansyah',conf:true,att:'in',ci:'08:02',co:'',valBy:'Isumi Karina',valAt:'12 Agu 08:05',ots:'none',otj:0,otkm:0,dot:'g'},
 {id:'S2',klien:'MAP Boga',flex:true,rate:200000,ot:35000,otMode:'time',minH:6,jam:'08:00–16:00',utama:'Pandhu Satria',cadangan:'',conf:true,att:'in',ci:'08:10',co:'',valBy:'Isumi Karina',valAt:'12 Agu 08:12',ots:'pending',otj:2,otkm:0,dot:'o'},
 {id:'S3',klien:'MAP Boga',flex:true,rate:200000,ot:35000,otMode:'time',minH:6,jam:'08:00–16:00',utama:'Giar Juliansyah',cadangan:'',conf:true,att:'in',ci:'08:05',co:'',valBy:'Isumi Karina',valAt:'12 Agu 08:07',ots:'pending',otj:2,otkm:0,dot:'o'},
 {id:'S4',klien:'Alpha',flex:true,rate:230000,ot:1500,otMode:'dist',minH:6,jam:'07:00–15:00',utama:'Chandra Wirayuda',cadangan:'Aldyanto Kurniawan',conf:true,att:'partial',ci:'07:01',co:'11:30',valBy:'',valAt:'',ots:'none',otj:0,otkm:0,dot:'o'},
 {id:'S5',klien:'Alpha',flex:true,rate:230000,ot:1500,otMode:'dist',minH:6,jam:'07:00–15:00',utama:'Aldyanto Kurniawan',cadangan:'',conf:false,att:'none',ci:'',co:'',valBy:'',valAt:'',ots:'none',otj:0,otkm:0,dot:'r'},
 {id:'S6',klien:'Goreca',flex:true,rate:200000,ot:35000,otMode:'time',minH:6,jam:'05:00–12:00',utama:'Yusuf Supriyadi',cadangan:'',conf:true,att:'in',ci:'05:03',co:'12:00',valBy:'Isumi Karina',valAt:'12 Agu 12:05',ots:'rejected',otj:1,otkm:0,dot:'g'},
 {id:'S7',klien:'NCS (Bali)',flex:true,rate:210000,ot:0,otMode:'time',minH:6,jam:'08:00–16:00',utama:'',cadangan:'',conf:false,att:'none',ci:'',co:'',valBy:'',valAt:'',ots:'none',otj:0,otkm:0,dot:'r'},
 {id:'S8',klien:'SwipeRX (per-kirim)',flex:false,rate:0,ot:0,otMode:'time',minH:0,jam:'09:00–17:00',utama:'Eko Prasetyo',cadangan:'',conf:true,att:'in',ci:'09:01',co:'',valBy:'Isumi Karina',valAt:'12 Agu 09:03',ots:'none',otj:0,otkm:0,dot:'g'},
];
const SI_CLIENTS=[...new Set(SI_SLOTS.map(s=>s.klien))];
function siRefresh(){$("#page-root").innerHTML=renderSchedule();}
function siFiltered(){return SI_SLOTS.map((s,i)=>({s,i})).filter(o=>(siFClient==='all'||o.s.klien===siFClient)&&(!siFOt||o.s.ots==='pending'||o.s.ots==='approved'));}
const SI_MASTER=[
 {klien:'Batukarang Kopi Indonesia',jam:'08:00–16:00',hari:'Sel, Rab, Kam, Jum',utama:'Abilillah Pramata',cadangan:'—',status:'Aktif'},
 {klien:'MAP Boga',jam:'08:00–16:00',hari:'Sen–Sab',utama:'Pandhu Satria',cadangan:'Giar Juliansyah',status:'Aktif'},
 {klien:'Goreca',jam:'05:00–12:00',hari:'Setiap hari',utama:'Yusuf Supriyadi',cadangan:'—',status:'Aktif'},
];
const SI_DAYOFF=[{rider:'Giar Juliansyah',tgl:'13 Aug 2026',alasan:'Cuti tahunan'},{rider:'Eko Prasetyo',tgl:'14 Aug 2026',alasan:'Sakit'}];
const SI_DED=['Abilillah Pramata','Giar Juliansyah','Pandhu Satria','Aldyanto Kurniawan','Chandra Wirayuda'];

function renderSchedule(){
  const actions=`<button class="btn" onclick="siRekon()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download Rekon <span class="si-tag si-p1">P1</span></button>
    <button class="btn" onclick="siBulk()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Import Slot Massal <span class="si-tag si-p1">P1</span></button>
    <button class="btn primary" onclick="siTambah()">+ Tambah Slot</button>`;
  let body=pageHead('','Hub Ops','Schedule','Scheduled Instant — jadwal rider harian, konfirmasi & pengganti. Kini juga dasar tagih untuk klien Flex (dedicated manpower).',actions);
  body+=`<div class="si-scope"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <div><b>Enhancement Phase 2</b> di fitur existing (bukan menu baru). <span class="si-tag si-p1">P1</span> Flex billing-basis · Kehadiran validasi · Overtime · Bulk upload · Download Rekon.
    &nbsp; <span class="si-tag si-p2">P2</span> Otomasi invoice/payroll (modul Finance terpisah) · Peringatan 8 jam di Driver App · integrasi Dispatch mendalam — <i>bisa ditunda tanpa blocking.</i></div></div>`;
  body+=tabsBar([['slot','Slot Harian',null],['master','Master Jadwal',null],['dayoff','Day Off Rider',null]],siTab,'siSetTab');
  if(siTab==='slot') body+=siSlotHarian();
  else if(siTab==='master') body+=siMasterJadwal();
  else body+=siDayOff();
  return body;
}
function siSetTab(t){siTab=t;$("#page-root").innerHTML=renderSchedule();}
function siStat(l,n,c){return `<div class="si-stat"><div class="l">${l}</div><div class="n" ${c?`style="color:${c}"`:''}>${n}</div></div>`;}

function siSlotHarian(){
  const total=SI_SLOTS.length,
    konf=SI_SLOTS.filter(s=>s.conf).length,
    hadir=SI_SLOTS.filter(s=>s.att==='in').length,
    perhatian=SI_SLOTS.filter(s=>!s.utama||s.att==='none'||s.att==='partial'||s.ots==='pending').length;
  let h=`<div class="si-stats">${siStat('Total Slot',total)}${siStat('Terkonfirmasi (akan hadir)',konf,'#335CFF')}${siStat('Hadir Tervalidasi',hadir,'var(--state-success-base)')}${siStat('Perlu Perhatian',perhatian,'var(--state-error-base)')}</div>`;
  h+=`<div class="si-toolbar"><span style="font-size:13px;font-weight:700">Rabu, 12 Agu 2026</span>
    <div class="si-seg"><button class="${siView==='table'?'on':''}" onclick="siSetView('table')">☰ Table</button><button class="${siView==='cal'?'on':''}" onclick="siSetView('cal')">▦ Calendar</button></div>
    <div style="flex:1"></div>
    <select onchange="siSetFClient(this.value)" style="border:1px solid var(--stroke-sub);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;background:#fff"><option value="all">Semua klien</option>${SI_CLIENTS.map(c=>`<option ${siFClient===c?'selected':''}>${c}</option>`).join('')}</select>
    <button onclick="siToggleOt()" style="border:1px solid ${siFOt?'var(--primary-base)':'var(--stroke-sub)'};background:${siFOt?'var(--state-feature-lighter)':'#fff'};color:${siFOt?'var(--primary-dark)':'var(--text-sub)'};border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer">⏱ Ada Overtime</button></div>`;
  if(SI_SEL.size){ h+=`<div style="display:flex;align-items:center;gap:12px;background:var(--state-feature-lighter);border:1px solid var(--primary-lighter);border-radius:var(--radius-10);padding:10px 14px;margin-bottom:12px">
    <b style="color:var(--primary-dark)">${SI_SEL.size} rider terpilih</b><span class="si-mini">— aksi massal untuk klien &amp; hari yang sama</span>
    <div style="flex:1"></div>
    <button class="btn sm" onclick="siBatchValidate()">Validasi Kehadiran</button>
    <button class="btn primary sm" onclick="siBatchOt()">Catat Overtime</button>
    <button class="btn ghost sm" onclick="siClearSel()">✕</button></div>`; }
  h+= siView==='table'? siSlotTable() : siSlotCalendar();
  return h;
}
function siSetFClient(v){siFClient=v;siRefresh();}
function siToggleOt(){siFOt=!siFOt;siRefresh();}
function siToggleSel(id){SI_SEL.has(id)?SI_SEL.delete(id):SI_SEL.add(id);siRefresh();}
function siClearSel(){SI_SEL.clear();siRefresh();}
function siBatchValidate(){SI_SEL.forEach(id=>{const s=SI_SLOTS.find(x=>x.id===id);if(s&&s.att!=='in'){s.att='in';s.ci=s.ci||'08:00';s.unpaid=false;s.dot='g';s.valBy='Isumi Karina';s.valAt='12 Agu 16:22';}});const c=SI_SEL.size;SI_SEL.clear();siRefresh();toast(`Kehadiran ${c} rider divalidasi`);}
function siBatchOt(){siOtModal(Array.from(SI_SEL));}
function siAttChip(s){
  if(s.att==='in') return `<span class="si-chip si-ok-l"><span class="si-dot" style="background:var(--state-success-base)"></span>Hadir ${s.ci}${s.co?'–'+s.co:''}</span>`;
  if(s.att==='partial') return `<span class="si-chip si-warn"><span class="si-dot" style="background:var(--state-warning-base)"></span>Hadir sebagian</span>`;
  return `<span class="si-chip si-bad"><span class="si-dot" style="background:var(--state-error-base)"></span>Belum check-in</span>`;
}
function siOtAmt(s){return s.otMode==='dist'?`${s.otkm||0} km`:`${s.otj||0}j`;}
function siOtVal(s){return s.ots==='approved'?(s.otMode==='dist'?s.ot*(s.otkm||0):s.ot*(s.otj||0)):0;}
function siOtChip(s){
  if(!s.flex||!s.ot) return `<span class="si-chip si-muted">—</span>`;
  if(s.ots==='approved') return `<span class="si-chip si-ok-l">OT ${siOtAmt(s)} · disetujui</span>`;
  if(s.ots==='pending') return `<span class="si-chip si-warn">OT ${siOtAmt(s)} · perlu bukti</span>`;
  if(s.ots==='rejected') return `<span class="si-chip si-bad">OT ditolak</span>`;
  return `<span class="si-chip si-muted">—</span>`;
}
function siSlotTable(){
  const rows=siFiltered();
  const allSel=rows.length&&rows.every(({s})=>SI_SEL.has(s.id));
  return `<table class="si-tbl"><thead><tr>
    <th style="width:34px"><input type="checkbox" ${allSel?'checked':''} onclick="siSelAll(this.checked)"></th>
    <th>Klien</th><th>Shift</th><th>Rider Utama · Cadangan</th>
    <th>Dasar Tagih <span class="si-tag si-p1">P1</span></th><th>Kehadiran <span class="si-tag si-p1">P1</span></th><th>Overtime <span class="si-tag si-p1">P1</span></th></tr></thead><tbody>
    ${rows.map(({s,i})=>`<tr class="clk" onclick="siOpenSlot(${i})">
      <td onclick="event.stopPropagation()"><input type="checkbox" ${SI_SEL.has(s.id)?'checked':''} onclick="siToggleSel('${s.id}')"></td>
      <td><div style="font-weight:700">${s.klien}</div>${s.flex?'<span class="si-flex">✦ Flex</span>':''}</td>
      <td class="mono">${s.jam}</td>
      <td>${s.utama?`<span class="si-av">${s.utama[0]}</span>${s.utama}`:'<span class="si-chip si-bad">Belum ada rider utama</span>'}${s.cadangan?`<div class="si-mini" style="margin-top:4px">↳ cadangan: ${s.cadangan}</div>`:'<div class="si-mini" style="margin-top:4px">↳ cadangan: —</div>'}</td>
      <td>${s.flex?`<span class="si-basis">${SI_RATE_FMT(s.rate)}<small>/ shift · OT ${s.ot?SI_RATE_FMT(s.ot)+'/jam':'—'}</small></span>`:'—'}</td>
      <td>${siAttChip(s)}</td>
      <td>${siOtChip(s)}</td>
    </tr>`).join('')}
    ${rows.length?'':'<tr><td colspan="7" style="text-align:center;color:var(--text-soft);padding:26px">Tidak ada slot untuk filter ini.</td></tr>'}
  </tbody></table>
  <div class="si-mini" style="margin-top:10px">Klik baris untuk detail. Centang beberapa rider (klien &amp; hari sama) untuk <b>validasi kehadiran / catat overtime massal</b>.</div>`;
}
function siSelAll(ch){siFiltered().forEach(({s})=>{ch?SI_SEL.add(s.id):SI_SEL.delete(s.id);});siRefresh();}
function siSlotCalendar(){
  const days=[['SEN','10'],['SEL','11'],['RAB','12','today'],['KAM','13'],['JUM','14'],['SAB','15'],['MIN','16']];
  const rows=['05:00','07:00','08:00'];
  const cell=(day,time)=>{
    const list=SI_SLOTS.filter(s=>s.jam.startsWith(time.slice(0,2)));
    if(day!==2) { // only populate a few days for demo besides today
      if(!(day===0||day===3||day===4)) return '<div class="si-cal-cell"></div>';
    }
    return `<div class="si-cal-cell">${list.map(s=>{const i=SI_SLOTS.indexOf(s);return `<div class="si-slotchip ${s.dot}" onclick="siOpenSlot(${i})"><div class="tt">${s.klien} ${s.flex?'✦':''}</div><div class="rr">${s.utama||'belum ada rider'}</div></div>`;}).join('')}</div>`;
  };
  return `<div class="si-legend"><span>✦ Flex/Dedicated</span><span><span class="si-dot" style="background:var(--state-success-base)"></span>Hadir</span><span><span class="si-dot" style="background:var(--state-warning-base)"></span>Perlu perhatian</span><span><span class="si-dot" style="background:var(--state-error-base)"></span>Belum ada rider</span></div>
  <div class="si-cal"><div class="si-cal-h"><div></div>${days.map(d=>`<div class="${d[2]?'today':''}">${d[0]}<br>${d[1]}</div>`).join('')}</div>
  ${rows.map(t=>`<div class="si-cal-row"><div class="t">${t}</div>${days.map((d,di)=>cell(di,t)).join('')}</div>`).join('')}</div>`;
}
function siSetView(v){siView=v;$("#page-root").innerHTML=renderSchedule();}

function siMasterJadwal(){
  return `<div class="si-mini" style="margin-bottom:12px">Template jadwal berulang per klien (hari + shift + rider utama/cadangan). Sumber "shift master" — kini di Logistik, bukan BackOffice.</div>
  <table class="si-tbl"><thead><tr><th>Klien</th><th>Shift</th><th>Hari</th><th>Rider Utama</th><th>Rider Cadangan</th><th>Status</th></tr></thead><tbody>
  ${SI_MASTER.map((m,i)=>`<tr class="clk" onclick="siOpenMaster(${i})"><td style="font-weight:700">${m.klien}</td><td class="mono">${m.jam}</td><td>${m.hari}</td><td><span class="si-av">${m.utama[0]}</span>${m.utama}</td><td>${m.cadangan}</td><td><span class="si-chip si-ok-l">● ${m.status}</span></td></tr>`).join('')}
  </tbody></table>`;
}
function siDayOff(){
  return `<div class="si-toolbar"><span style="font-size:13px;font-weight:700">Day Off Rider</span><div style="flex:1"></div><button class="btn primary" onclick="toast('Tambah day off — prototype')">+ Tambah Day Off</button></div>
  <table class="si-tbl"><thead><tr><th>Rider</th><th>Tanggal Off</th><th>Alasan</th><th></th></tr></thead><tbody>
  ${SI_DAYOFF.map(d=>`<tr><td><span class="si-av">${d.rider[0]}</span>${d.rider}</td><td class="mono">${d.tgl}</td><td>${d.alasan}</td><td style="text-align:right"><button class="btn xs" onclick="toast('Edit day off')">Edit</button></td></tr>`).join('')}
  </tbody></table>`;
}

/* ---- slot detail drawer (kehadiran + overtime) ---- */
function siOpenSlot(i){
  siDrawerIdx=i;
  const s=SI_SLOTS[i];
  const absent=s.att!=='in';
  const dr=$("#drawer");
  dr.innerHTML=`<div class="drawer-head"><div><h3 style="display:flex;align-items:center;gap:8px">${s.klien} ${s.flex?'<span class="si-flex">✦ Flex</span>':''}</h3><div class="sub">${s.jam} · Rabu 12 Agu 2026</div></div><button class="x" onclick="closeDrawer()">✕</button></div>
  <div class="drawer-body">
    <div class="si-sd-sec"><div class="si-sd-h">Dasar Tagih (Flex) <span class="si-tag si-p1">P1</span></div>
      <div class="si-kv"><span class="k">Tarif harian</span><span class="v">${SI_RATE_FMT(s.rate)} / shift</span></div>
      <div class="si-kv"><span class="k">Overtime</span><span class="v">${s.ot?SI_RATE_FMT(s.ot)+' / jam':'—'}</span></div>
      <div class="si-mini" style="margin-top:6px">1 shift hadir tervalidasi = 1 shift tertagih. Dibaca dari pricing Flex (Phase 1).</div>
    </div>
    <div class="si-sd-sec"><div class="si-sd-h">Rider Ditugaskan</div>
      ${s.utama?`<div class="si-rider"><span class="si-av">${s.utama[0]}</span><div style="flex:1"><div style="font-weight:700">${s.utama}</div><div class="si-mini">Rider Utama · Dedicated</div></div></div>`:'<div class="si-chip si-bad">Belum ada rider utama</div>'}
      ${s.cadangan?`<div class="si-rider"><span class="si-av">${s.cadangan[0]}</span><div style="flex:1"><div style="font-weight:700">${s.cadangan}</div><div class="si-mini">Rider Cadangan · first-call jika utama TIDAK/No Response</div></div></div>`:'<div class="si-mini">Rider Cadangan: belum ditetapkan.</div>'}
      ${s.att==='none'?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${s.cadangan?`<button class="btn primary sm" onclick="siPromote(${i})">Panggil cadangan (${s.cadangan.split(' ')[0]})</button>`:''}<button class="btn ghost sm" onclick="siToDispatch(${i})">Lepas ke Dispatch (zona)</button></div><div class="si-mini" style="margin-top:6px">Jika rider utama tidak hadir / No Response.</div>`:''}
    </div>
    <div class="si-sd-sec"><div class="si-sd-h">Kehadiran <span class="si-tag si-p1">P1</span></div>
      <div class="si-kv"><span class="k">Konfirmasi rider</span><span class="v">${s.conf?'<span class="si-chip si-info">Terkonfirmasi via WA</span>':'<span class="si-chip si-muted">Belum konfirmasi</span>'}</span></div>
      <div class="si-kv"><span class="k">Check-in / out</span><span class="v">${s.ci||'—'}${s.co?' / '+s.co:''}</span></div>
      <div class="si-kv"><span class="k">Status</span><span class="v">${s.att==='in'?'<span class="si-chip si-ok">Hadir tervalidasi</span>':s.att==='partial'?(s.unpaid?'<span class="si-chip si-bad">Tidak dibayar</span>':'<span class="si-chip si-warn">Hadir sebagian</span>'):'<span class="si-chip si-bad">Belum check-in</span>'}</span></div>
      ${s.att==='in'?`<div class="si-mini" style="margin-top:6px">Divalidasi oleh <b>${s.valBy||'—'}</b>${s.valAt?' · '+s.valAt:''}. Menjadi dasar bayar shift ini.</div>`
       :s.att==='partial'?`<div class="si-mini" style="margin:6px 0 10px">Kerja &lt; minimum <b>${s.minH} jam</b> (aturan: hadir = check-in + min ${s.minH} jam). Keputusan bayar butuh SOP Ops.</div>${s.unpaid?`<div class="si-mini">Ditandai tidak dibayar oleh <b>${s.valBy}</b> · ${s.valAt}.</div>`:`<div style="display:flex;gap:8px"><button class="btn primary sm" onclick="siValidate(${i})">Bayar penuh (1 shift)</button><button class="btn ghost sm" onclick="siUnpaid(${i})">Tandai tidak dibayar</button></div>`}`
       :`<div class="si-mini" style="margin:6px 0 10px">Aturan: hadir = check-in + minimal <b>${s.minH} jam</b>.</div><button class="btn primary" style="width:100%;justify-content:center" onclick="siValidate(${i})">Validasi Kehadiran</button>`}
    </div>
    <div class="si-sd-sec"><div class="si-sd-h">Overtime <span class="si-tag si-p1">P1</span></div>
      ${(!s.flex||!s.ot)?`<div class="si-mini">Tidak berlaku — bukan skema harian / klien tanpa overtime.</div>`
       :absent?`<div class="si-mini">⚠️ Validasi kehadiran dulu — overtime hanya untuk rider yang hadir.</div>`
       :s.ots==='approved'?`<div class="si-chip si-ok-l" style="margin-bottom:8px">${siOtAmt(s)} · disetujui klien · ada bukti</div><button class="btn ghost sm" onclick="siOtModal(['${s.id}'])">Ubah</button>`
       :s.ots==='pending'?`<div class="si-chip si-warn" style="margin-bottom:10px">${siOtAmt(s)} diklaim · butuh izin klien + bukti</div><button class="btn primary" style="width:100%;justify-content:center" onclick="siOtModal(['${s.id}'])">Catat Overtime</button>`
       :s.ots==='rejected'?`<div class="si-chip si-bad" style="margin-bottom:10px">Overtime ditolak — tanpa izin klien</div><button class="btn ghost sm" onclick="siOtModal(['${s.id}'])">Catat ulang (dengan bukti)</button>`
       :`<div class="si-mini" style="margin-bottom:10px">Belum ada overtime. Hanya sah bila ada kesepakatan dengan client di awal — dihitung ${s.otMode==='dist'?'per km':'per jam'}.</div><button class="btn primary" style="width:100%;justify-content:center" onclick="siOtModal(['${s.id}'])">Catat Overtime</button>`}
    </div>
    <div class="si-sd-sec"><div class="si-sd-h">Riwayat Slot</div>
      <div class="si-kv"><span class="k">Dibuat</span><span class="v si-mini">Master Jadwal · 30 Jul 2026</span></div>
      <div class="si-kv"><span class="k">Perubahan terakhir</span><span class="v si-mini">replace rider · 06 Agu</span></div>
    </div>
  </div>`;
  showDrawer();
}
function siPromote(i){const s=SI_SLOTS[i];if(!s.cadangan)return;s.utama=s.cadangan;s.cadangan='';toast('Rider cadangan dipromosikan jadi rider utama');siRefresh();siOpenSlot(i);}
function siToDispatch(i){const s=SI_SLOTS[i];s.utama='Dispatch (zona)';s.cadangan='';s.dot='o';toast('Slot dilepas ke Dispatch berbasis zona');siRefresh();siOpenSlot(i);}
function siValidate(i){const s=SI_SLOTS[i];s.att='in';s.ci=s.ci||('08:0'+((i%9)+1));s.unpaid=false;s.dot='g';s.valBy='Isumi Karina';s.valAt='12 Agu 16:2'+(i%9);siRefresh();siOpenSlot(i);toast('Kehadiran tervalidasi — shift jadi dasar tagih');}
function siUnpaid(i){const s=SI_SLOTS[i];s.unpaid=true;s.dot='r';s.valBy='Isumi Karina';s.valAt='12 Agu 16:20';siRefresh();siOpenSlot(i);toast('Shift ditandai tidak dibayar (di bawah minimum jam)');}
let siOtIds=[];
function siOtModal(ids){
  siOtIds=ids.slice();
  const slots=ids.map(id=>SI_SLOTS.find(x=>x.id===id)).filter(Boolean);
  if(!slots.length){toast('Pilih minimal 1 rider',false);return;}
  const klien=[...new Set(slots.map(s=>s.klien))], many=slots.length>1, mixed=klien.length>1;
  const dist=slots.every(s=>s.otMode==='dist');
  const title=many?`${slots.length} rider · ${klien.join(', ')}`:(slots[0].utama||slots[0].klien);
  const riderList=slots.map(s=>`<span class="si-chip si-muted" style="margin:0 6px 6px 0">${s.utama||s.klien}</span>`).join('');
  openModal(`<div class="modal" style="max-width:540px">
    <div class="modal-head"><div class="modal-ic purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div><div><h3>Catat Overtime</h3><div class="sub">${title}</div></div></div>
    <div class="modal-body">
      ${many?`<div style="margin-bottom:14px"><div class="lbl-field" style="margin-bottom:8px">Rider (${slots.length}) — izin &amp; bukti berlaku untuk semua</div>${riderList}${mixed?'<div class="hint" style="margin-top:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><span>Rider dari klien berbeda — pastikan izinnya memang sama.</span></div>':''}</div>`:''}
      <label class="lbl-field">Disetujui oleh (PIC klien)<span class="req-tag">*</span></label>
      <input class="sel-field" id="siOtAppr" placeholder="cth. Bp. Tim — ${klien[0]}">
      ${dist?`<label class="lbl-field" style="margin-top:12px">Jarak lembur (km)<span class="req-tag">*</span></label><input class="sel-field" id="siOtKm" placeholder="cth. 12"><div class="si-mini" style="margin-top:5px">Klien ini dihitung berbasis jarak.</div>`:`<label class="lbl-field" style="margin-top:12px">Durasi<span class="req-tag">*</span></label><select class="sel-field" id="siOtJam"><option>1 jam</option><option selected>2 jam</option><option>3 jam</option></select>`}
      <label class="lbl-field" style="margin-top:12px">Waktu permintaan</label>
      <input class="sel-field" value="Hari ini · 15:40 (WA klien)">
      <label class="lbl-field" style="margin-top:12px">Bukti (foto/screenshot izin)<span class="req-tag">*</span></label>
      <div class="si-photo" id="siOtPhoto" onclick="this.classList.add('on');this.textContent='✓ bukti_izin_overtime.jpg'">📷 Ketuk untuk lampirkan bukti</div>
      <div class="hint" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Tanpa izin + bukti, overtime otomatis ditolak dan tidak masuk rekon tagih. (Fix dispute Alpha.)</span></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="siOtSave()">Simpan Overtime</button></div>
  </div>`);
}
function siOtSave(){
  const appr=($("#siOtAppr").value||'').trim(), photo=$("#siOtPhoto").classList.contains('on');
  if(!appr||!photo){toast('Butuh nama PIC klien + bukti foto',false);return;}
  const kmEl=$("#siOtKm"), jamEl=$("#siOtJam");
  const km=kmEl?(parseInt((kmEl.value||'').replace(/[^\d]/g,''))||0):0;
  const jam=jamEl?(parseInt(jamEl.value)||2):2;
  if(kmEl && !km){toast('Isi jarak lembur (km)',false);return;}
  siOtIds.forEach(id=>{const s=SI_SLOTS.find(x=>x.id===id);if(s){s.ots='approved';if(s.otMode==='dist')s.otkm=km;else s.otj=jam;}});
  const n=siOtIds.length; SI_SEL.clear(); closeModal(); siRefresh();
  if(siDrawerIdx!=null && $("#drawer").classList.contains('show')) siOpenSlot(siDrawerIdx);
  toast(`Overtime ${n} rider tercatat dengan bukti — masuk rekon`);
}
/* ---- master detail ---- */
function siOpenMaster(i){
  const m=SI_MASTER[i];const dr=$("#drawer");
  dr.innerHTML=`<div class="drawer-head"><div><h3>${m.klien} · ${m.jam}</h3><div class="sub">${m.hari} · <span class="si-chip si-ok-l">● ${m.status}</span></div></div><button class="x" onclick="closeDrawer()">✕</button></div>
  <div class="drawer-body">
    <div style="display:flex;gap:8px;margin-bottom:16px"><button class="btn sm" onclick="toast('Edit jadwal')">Edit Jadwal</button><button class="btn ghost sm" onclick="toast('Nonaktifkan')">Nonaktifkan</button></div>
    <div class="si-sd-sec"><div class="si-sd-h">Rider Ditugaskan</div>
      <div class="si-rider"><span class="si-av">${m.utama[0]}</span><div style="flex:1"><div style="font-weight:700">${m.utama}</div><div class="si-mini">Rider Utama</div></div></div>
      <div class="si-mini">Rider Cadangan: ${m.cadangan}</div></div>
    <div class="si-sd-sec"><div class="si-sd-h">Riwayat Slot Terbaru</div>
      ${['14 Agu ●o','13 Agu ●o','12 Agu ●g','11 Agu ●g','07 Agu ●r'].map(x=>{const dot=x.slice(-1);const col=dot==='g'?'var(--state-success-base)':dot==='o'?'var(--state-warning-base)':'var(--state-error-base)';return `<div class="si-kv"><span class="k"><span class="si-dot" style="background:${col}"></span>${x.slice(0,6)}</span><span class="v si-mini">1 rider · <a style="color:var(--primary-dark);cursor:pointer" onclick="toast('Edit slot')">Edit</a></span></div>`;}).join('')}</div>
  </div>`;
  showDrawer();
}

    <div class="modal-body">
      <label class="lbl-field">Klien<span class="req-tag">*</span></label><select class="sel-field"><option value="">Cari klien Scheduled Instant…</option><option>MAP Boga (✦ Flex)</option><option>Alpha (✦ Flex)</option><option>Goreca (✦ Flex)</option></select>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px">
        <div><label class="lbl-field">Tanggal<span class="req-tag">*</span></label><input class="sel-field" type="date" value="2026-08-12"></div>
        <div><label class="lbl-field">Jam Mulai<span class="req-tag">*</span></label><input class="sel-field" type="time" value="08:00"></div>
        <div><label class="lbl-field">Jam Selesai<span class="req-tag">*</span></label><input class="sel-field" type="time" value="16:00"></div>
      </div>
      <label class="lbl-field" style="margin-top:12px">Rider Utama<span class="req-tag">*</span> &nbsp;<span class="si-tag si-p1" style="cursor:pointer">Dedicated Riders</span> <span class="si-mini">| All Riders</span></label>
      <select class="sel-field"><option value="">Cari & tambah rider…</option>${SI_DED.map(r=>`<option>${r}</option>`).join('')}</select>
      <label class="lbl-field" style="margin-top:12px">Rider Cadangan <span class="si-mini">opsional — first-call jika rider utama TIDAK/No Response</span></label>
      <select class="sel-field"><option value="">Cari & tambah rider…</option>${SI_DED.map(r=>`<option>${r}</option>`).join('')}</select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"><div><label class="lbl-field">Batch <span class="si-mini">(opsional)</span></label><input class="sel-field" placeholder="cth. Pagi"></div><div><label class="lbl-field">Catatan Ops</label><input class="sel-field" placeholder="cth. Pickup di gudang belakang"></div></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="closeModal();toast('Slot dibuat')">Buat Slot</button></div>
  </div>`);
}
/* ---- Bulk upload (P1) ---- */
function siBulk(){
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div class="modal-ic purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div><div><h3>Import Slot Massal <span class="si-tag si-p1">P1</span></h3><div class="sub">Buat banyak slot rider sekaligus lewat CSV</div></div></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span><b>Kapan dipakai:</b> klien <b>tanpa Master Jadwal</b> atau yang jumlah rider hariannya berubah-ubah (mis. TPI, klien Next Portal). Klien dengan Master Jadwal → slot terbentuk <b>otomatis</b>, tak perlu import.</span></div>
      <div class="dropzone" onclick="toast('Preview import — 24 baris, 2 baris perlu rider')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg><div>Drag & drop CSV (.csv · max 5 MB)</div></div>
      <div class="hint" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Header: <b>Klien · Tanggal · Jam Mulai · Jam Selesai · Rider Utama (opsional) · Rider Cadangan · Batch</b>. Kolom Rider kosong → masuk antrean <b>Dispatch</b>.</span></div>
      <a class="tmpl-link" onclick="toast('Download template CSV slot')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download template</a>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="closeModal();toast('24 slot di-import')">Import 24 slot</button></div>
  </div>`);
}
/* ---- Download Rekon (P1) ---- */
function siRekon(){
  const rows=SI_SLOTS.filter(s=>s.flex&&s.att==='in');
  const rev=rows.reduce((a,s)=>a+s.rate+siOtVal(s),0);
  openModal(`<div class="modal" style="max-width:820px">
    <div class="modal-head"><div class="modal-ic purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></div><div><h3>Download Rekon <span class="si-tag si-p1">P1</span></h3><div class="sub">Ringkasan shift + overtime untuk Finance — invoicing masih manual</div></div></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px"><div><label class="lbl-field">Dari</label><input class="sel-field" type="date" value="2026-08-08"></div><div><label class="lbl-field">Sampai</label><input class="sel-field" type="date" value="2026-08-14"></div><div><label class="lbl-field">Klien</label><select class="sel-field"><option>Semua Flex</option>${SI_CLIENTS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
      <table class="si-tbl"><thead><tr><th>Klien</th><th>Rider</th><th>Shift</th><th>OT</th><th>Nilai</th></tr></thead><tbody>
      ${rows.map(s=>`<tr><td>${s.klien}</td><td>${s.utama}</td><td class="mono">1</td><td class="mono">${s.ots==='approved'?siOtAmt(s):'—'}</td><td class="mono">${SI_RATE_FMT(s.rate+siOtVal(s))}</td></tr>`).join('')}
      <tr><td colspan="4" style="font-weight:800;text-align:right">Total rekon</td><td class="mono" style="font-weight:800">${SI_RATE_FMT(rev)}</td></tr>
      </tbody></table>
      <div class="hint" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Hanya shift dengan <b>kehadiran tervalidasi</b> yang masuk. Overtime hanya bila disetujui + ada bukti. Modul Finance/otomasi payroll = <span class="si-tag si-p2">P2</span>.</span></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Tutup</button><button class="btn primary" onclick="closeModal();toast('Rekon.csv diunduh')">Download CSV</button></div>
  </div>`);
}

try{ nav('schedule'); }catch(e){}
