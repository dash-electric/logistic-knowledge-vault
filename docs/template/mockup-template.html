<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&lt;Feature Name&gt; · Mockup · Dash</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (from docs/brand/gsm.md — never hardcode colors elsewhere) ===== */
:root {
  --primary: #5E2AAC;
  --black: #171717;
  --white: #FFFFFF;
  --neutral: #5C5C5C;
  --rule: rgba(23,23,23,0.10);
  --rule-strong: rgba(23,23,23,0.22);
  --tint: rgba(23,23,23,0.04);
  --tint-strong: rgba(23,23,23,0.07);
  --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: var(--black);
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11", "cv02";
  min-height: 100vh;
}
::selection { background: var(--primary); color: var(--white); }

/* ===== Page chrome: header / footer like a slide ===== */
.page-header, .page-footer {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px clamp(20px, 5vw, 64px);
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--neutral); font-weight: 600;
}
.page-header { border-bottom: 1px solid var(--rule); }
.page-footer { border-top: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.page-header .left { display: flex; gap: 24px; align-items: baseline; }
.page-header .right { color: var(--black); font-weight: 700; }
.brand-mark {
  display: inline-flex; align-items: center; gap: 0.42em;
  font-weight: 800; letter-spacing: -0.01em; color: var(--black);
}
.logo-mark { display: inline-block; width: 1em; height: 1em; vertical-align: -0.14em; color: var(--primary); }
.logo-mark svg { display: block; width: 100%; height: 100%; }

/* ===== Board of states ===== */
.board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 420px));
  justify-content: center;
  gap: clamp(24px, 4vw, 56px);
  padding: clamp(28px, 5vh, 56px) clamp(20px, 5vw, 64px);
}
.state-tag {
  display: inline-block;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--neutral); font-weight: 600; margin-bottom: 10px;
}
.state-tag .num { color: var(--primary); font-weight: 700; margin-right: 12px; }

/* Screen frame: 1px border, square corners, no shadow — editorial restraint */
.screen {
  background: var(--white);
  border: 1px solid var(--rule-strong);
  padding: 28px;
}

/* ===== Mock UI primitives (compose screens from these) ===== */
.screen h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 4px; }
.screen .sub { color: var(--neutral); font-size: 13px; line-height: 1.45; margin-bottom: 22px; }
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--neutral); font-weight: 600; margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; font-size: 14px;
  font-family: inherit; color: var(--black);
  background: var(--tint); border: 1px solid var(--rule);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 1px solid var(--primary); outline-offset: -1px; background: var(--white);
}
.field .hint { font-size: 11px; color: var(--neutral); margin-top: 5px; }
.field.error input { border-color: var(--black); background: var(--white); }
.field.error .error-msg { font-size: 11px; color: var(--black); font-weight: 600; margin-top: 5px; }
.field.error .error-msg::before { content: '✕'; margin-right: 6px; }

/* Primary action inverts to Ink — never a purple button (gsm.md §9) */
.btn {
  width: 100%; padding: 12px; border: 1px solid var(--black); cursor: pointer;
  background: var(--black); color: var(--white);
  font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
}
.btn.secondary { background: var(--white); color: var(--black); }
.btn.secondary:hover { background: var(--tint-strong); }
.aux { text-align: center; margin-top: 14px; font-size: 12px; }
.aux a { color: var(--black); font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
code {
  font-family: var(--mono); font-size: 11px;
  background: var(--tint); padding: 1px 5px;
  border: 1px solid var(--rule); color: var(--black);
}

/* Reviewer note: anchored to a hairline, never floating */
.note {
  margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule);
  font-size: 12px; color: var(--neutral); line-height: 1.45;
}
.note::before {
  content: 'Note'; display: block;
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600;
  margin-bottom: 4px;
}

@media (max-width: 720px) {
  .board { grid-template-columns: 1fr; }
}
</style>
</head>
