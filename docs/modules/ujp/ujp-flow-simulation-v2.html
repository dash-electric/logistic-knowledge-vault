<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UJP Flow Simulation</title>
<!-- Standalone interactive HTML in the react-logistic-web console shell. CR-2 (2026-09-17): Route Planner as a Routes-module extension — route plans get their own page + builder drawer, stops come from the Addresses lane book (manual stops write back DRAFT lanes), leg km is computed server-side with LANE / Diukur / Estimasi sources, and the UJP wizard step Rute only picks a plan. Keeps CR-1: 10% km margin, Flazz/QRIS/Transfer buckets, dated fuel price master, subcon without shipment, client config page. Data contoh. Icons: inline SVG sprite (self-contained, no CDN). Harness: light screen chrome + docked narrator. Keputusan: ASSESSMENT-UJP-PORT-4W.md §16 (CR2-D1…D19) + §15 (CR-D1…D9) + §14 (DD1…DD14). CR-3 (2026-09-17): requester edits while Menunggu/Ditolak, version + change history, stale-decision guard. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ── react-logistic-web tokens (src/design-system/styles/tokens.css + src/index.css) ── */
:root{--em:#178c4e;--muted:#5c5c5c;--faint:#a3a3a3;--ink2:#5c5c5c;--am:#f6b51e;--rd:#fb3748;--sky:#47c2ff;
  --gray-0:#ffffff;--gray-50:#f7f7f7;--gray-100:#f5f5f5;--gray-200:#ebebeb;--gray-300:#d1d1d1;--gray-400:#a3a3a3;--gray-600:#5c5c5c;--gray-800:#262626;--gray-950:#171717;
  --alpha-4:#1717170a;--alpha-7:#17171712;--alpha-10:#1717171a;--alpha-22:#17171738;
  --bg-white-0:#ffffff;--bg-weak-50:#f7f7f7;--bg-soft-200:#ebebeb;--bg-sub-300:#d1d1d1;--bg-surface-800:#262626;--bg-strong-950:#171717;
  --text-strong-950:#171717;--text-sub-600:#5c5c5c;--text-soft-400:#a3a3a3;--text-disabled-300:#d1d1d1;--text-white-0:#ffffff;
  --icon-sub-600:#5c5c5c;--icon-soft-400:#a3a3a3;
  --stroke-soft-200:#1717171a;--stroke-sub-300:#17171738;--stroke-strong-950:#171717;
  --accent:#5e2aac;--accent-dark:#431e7a;--accent-a10:#5e2aac1a;--accent-a16:#5e2aac29;--accent-a24:#5e2aac3d;
  --err-dark:#681219;--err-base:#fb3748;--err-light:#ffc0c5;--err-lighter:#ffebec;--err-700:#d02533;--err-a10:#fb37481a;--err-a16:#fb374829;
  --warn-dark:#71330a;--warn-base:#fa7319;--warn-light:#ffd9c0;--warn-lighter:#fff3eb;
  --succ-dark:#0b4627;--succ-base:#1fc16b;--succ-light:#c2f5da;--succ-lighter:#e0faec;
  --info-dark:#122368;--info-base:#335cff;--info-light:#c0d5ff;--info-lighter:#ebf1ff;
  --feat-dark:#1b0c32;--feat-base:#5e2aac;--feat-light:#b59dd9;--feat-lighter:#efeaf7;
  --ver-dark:#124b68;--ver-base:#47c2ff;--ver-light:#c0eaff;--ver-lighter:#ebf8ff;
  --away-dark:#624c18;--away-base:#f6b51e;--away-light:#ffecc0;--away-lighter:#fffaeb;
  --r:2px;--r-gsm:4px;--r-gsm-md:6px;--r-full:9999px;
  --sh-xs:inset 0 0 0 1px #1717171a;--sh-md:0 2px 8px -4px #1717171a,0 0 0 1px #1717171a;--sh-lg:0 12px 32px -12px #1717171f,0 0 0 1px #1717171a;--sh-tip:0 6px 20px -8px #1717171f,0 0 0 1px #17171738;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --dur:150ms;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-weak-50);color:var(--text-strong-950);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss01","cv11","cv02";text-rendering:optimizeLegibility;color-scheme:light}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-strong-950)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
table,.tabular{font-variant-numeric:tabular-nums}
svg.lucide{width:1em;height:1em;flex:none}
.eyebrow{color:var(--text-sub-600);font-size:10px;line-height:1.4;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.eyebrow .num{color:var(--accent);font-weight:700;margin-right:12px}

/* ── simulation harness (not part of the console) ── */
.stage{display:grid;grid-template-columns:1fr;height:100vh;background:var(--bg-weak-50)}
.stage.flowmode{grid-template-columns:330px minmax(0,1fr)}
.screen{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh}
/* faux browser chrome: which route the console shows + who is looking */
.chrome{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:44px;padding:6px 16px;background:var(--bg-white-0);border-bottom:1px solid var(--stroke-soft-200)}
.chrome .url{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-weak-50);font-family:var(--mono);font-size:12px;color:var(--text-sub-600);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .url b{color:var(--text-strong-950);font-weight:600}
.chrome .url .ld{width:6px;height:6px;border-radius:var(--r-full);background:var(--succ-base);flex:none}
.chrome .k{font-size:11px;color:var(--text-sub-600);white-space:nowrap}
.chrome .ctrls{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.chrome .grp{display:inline-flex;align-items:center;gap:8px}
.chrome .segc{height:30px;padding:3px}.chrome .segc button{height:24px;padding:0 10px;font-size:12px}
.chrome .inp{height:30px;width:auto;font-size:12px;padding:0 4px 0 8px}.chrome .inp select{font-size:12px}
.chrome .swl{gap:6px}
.chrome .ghostb{height:30px;padding:0 10px;font-size:12px;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0);color:var(--text-sub-600)}.chrome .ghostb:hover{color:var(--text-strong-950);background:var(--bg-weak-50)}
.chrome .note{font-size:11px;color:var(--text-soft-400);white-space:nowrap}
@media (max-width:1500px){.chrome .note{display:none}}
@media (max-width:900px){.chrome{padding:8px 12px}.chrome .ctrls{margin-left:0;width:100%;justify-content:flex-start}}

/* rail: the script of the walkthrough */
.rail{display:flex;flex-direction:column;min-height:0;height:100vh;background:var(--bg-white-0);border-right:1px solid var(--stroke-soft-200)}
.rail-h{flex:none;padding:18px 18px 14px;border-bottom:1px solid var(--stroke-soft-200)}
.rail-h h2{margin:8px 0 4px;font-size:18px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.rail-h .sub{margin:0 0 14px;color:var(--text-sub-600);font-size:12.5px;line-height:1.5}
.runrow{display:flex;gap:8px}.runrow .btn{flex:1;justify-content:center}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:var(--text-sub-600);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:2px;background:var(--stroke-soft-200)}.prog .bar i{display:block;height:2px;background:var(--accent);transition:width .3s var(--ease)}
.rail-b{flex:1;min-height:0;overflow:auto;padding:6px 0 12px}
.scenes{list-style:none;margin:0;padding:0}
.scenes li{border-bottom:1px solid var(--stroke-soft-200)}.scenes li:last-child{border-bottom:0}
.scenes .sc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;position:relative;padding:9px 18px 9px 15px;font-size:13px;color:var(--text-sub-600);line-height:1.3}
.scenes .sc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.scenes .sc:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.scenes .sc .n{font-family:var(--mono);font-size:11px;color:var(--text-soft-400)}
.scenes .sc .st{font-size:10px;font-family:var(--mono);color:var(--text-soft-400)}
.scenes li.done .sc .n{color:var(--succ-dark)}
.scenes li.on .sc{color:var(--text-strong-950);font-weight:600;background:var(--bg-weak-50)}.scenes li.on .sc::before{background:var(--accent)}.scenes li.on .sc .n{color:var(--accent)}
.sc-body{padding:2px 18px 14px 53px;background:var(--bg-weak-50)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.todo li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;color:var(--text-sub-600);align-items:start;line-height:1.45}
.todo li .m{width:16px;height:16px;border-radius:var(--r-full);border:1px solid var(--stroke-sub-300);display:grid;place-items:center;font-size:9px;margin-top:2px;font-family:var(--mono);background:var(--bg-white-0)}
.todo li.done .m{background:var(--succ-base);color:#fff;border-color:var(--succ-base)}
.todo li.cur{color:var(--text-strong-950);font-weight:600}.todo li.cur .m{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-a10)}
.why{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--stroke-soft-200)}
.why .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-sub-600);font-weight:700;margin-bottom:4px}
.why p{margin:0 0 8px;color:var(--text-sub-600);font-size:12px;line-height:1.5}
.why .dd{display:flex;flex-wrap:wrap;gap:4px}
.rail-f{flex:none;display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--stroke-soft-200);background:var(--bg-white-0)}
.rail-f .btn{flex:1;justify-content:center}
.rail-f .hint{width:100%;margin:4px 0 0;justify-content:center}
@media (max-width:1100px){.stage.flowmode{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.rail{height:auto;max-height:44vh;border-right:0;border-bottom:1px solid var(--stroke-soft-200)}.screen{height:auto;min-height:56vh}}

/* ── console shell (Layout.tsx + Sidebar.tsx) ── */
.shell{display:flex;flex:1;min-height:0;min-width:0;overflow:hidden;background:var(--bg-weak-50)}
.sidenav{width:15rem;flex:none;height:100%;display:flex;flex-direction:column;background:var(--bg-white-0);border-right:1px solid var(--stroke-soft-200);transition:width .2s}
.shell[data-state=collapsed] .sidenav{width:4rem;overflow-x:hidden}
.sn-head{display:flex;align-items:center;gap:10px;height:4rem;border-bottom:1px solid var(--stroke-soft-200);padding:0 20px}
.shell[data-state=collapsed] .sn-head{flex-direction:column;justify-content:center;height:auto;padding:12px 0;gap:8px}
.sn-head svg.mark{height:20px;width:22.2px;flex:none}
.sn-brand{overflow:hidden;min-width:0}
.sn-brand .t{white-space:nowrap;font-size:17px;font-weight:800;letter-spacing:-.025em;line-height:1;color:var(--text-strong-950);margin:0}
.sn-brand .s{margin:4px 0 0;white-space:nowrap;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.3em;color:var(--text-sub-600);line-height:1}
.shell[data-state=collapsed] .sn-brand,.shell[data-state=collapsed] .sn-glabel,.shell[data-state=collapsed] .sn-item span,.shell[data-state=collapsed] .sn-user{display:none}
.sn-trigger{margin-left:auto;display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:var(--r-gsm);border:0;background:transparent;color:var(--icon-sub-600);font-size:18px}
.sn-trigger:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.shell[data-state=collapsed] .sn-trigger{margin-left:0}
.sn-content{flex:1;overflow-y:auto}
.sn-group{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--stroke-soft-200)}.sn-group:last-child{border-bottom:0}
.sn-glabel{padding:6px 20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--text-sub-600)}
.sn-item{position:relative;display:flex;height:36px;width:100%;align-items:center;gap:12px;padding:0 20px;font-size:14px;font-weight:500;letter-spacing:-.025em;color:var(--text-sub-600);text-decoration:none;background:transparent;border:0;text-align:left;transition:color var(--dur),background var(--dur)}
.sn-item svg{width:17px;height:17px;flex:none}
.sn-item:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.sn-item::before{content:"";pointer-events:none;position:absolute;inset:0 auto 0 0;width:3px;background:transparent}
.sn-item[data-active=true]{font-weight:600;color:var(--text-strong-950)}.sn-item[data-active=true]::before{background:var(--accent)}
.shell[data-state=collapsed] .sn-item{justify-content:center;padding:0}
.sn-foot{display:flex;align-items:center;gap:8px;height:auto;border-top:1px solid var(--stroke-soft-200);padding:12px}
.sn-userrow{display:flex;width:100%;align-items:center;gap:12px;padding:6px 8px;border-radius:var(--r);transition:background var(--dur)}.sn-userrow:hover{background:var(--bg-weak-50)}
.shell[data-state=collapsed] .sn-userrow{flex-direction:column;padding:0;gap:8px}
.sn-av{position:relative;flex:none;width:32px;height:32px;border-radius:var(--r-full);background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.sn-av i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:var(--r-full);background:var(--succ-base);border:2px solid var(--bg-white-0)}
.sn-user{flex:1;min-width:0}.sn-user .n{font-size:13px;font-weight:600;letter-spacing:-.025em;color:var(--text-strong-950);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;margin:0}
.sn-user .e{font-size:11px;color:var(--text-sub-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;margin:0}
.sn-out{padding:6px;border-radius:var(--r);border:0;background:transparent;color:var(--icon-soft-400);display:inline-flex;font-size:16px}.sn-out:hover{background:var(--err-lighter);color:var(--err-base)}
.inset{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.topbar{background:var(--bg-white-0);border-bottom:1px solid var(--stroke-soft-200);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar .eyebrow .dotm{color:var(--accent);font-weight:700;margin-right:12px}
.main{flex:1;overflow:auto;min-width:0}

/* ── page (shipments/index.tsx) ── */
.page{padding:24px;display:flex;flex-direction:column;gap:20px}
.hdr{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--stroke-soft-200);padding-bottom:20px}
@media (min-width:1024px){.hdr{flex-direction:row;align-items:flex-end;justify-content:space-between}}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1;color:var(--text-strong-950)}
.lede{margin:8px 0 0;max-width:42rem;font-size:14px;color:var(--text-sub-600);line-height:1.625}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{display:flex;flex-direction:column;background:var(--bg-white-0);color:var(--text-strong-950);border:1px solid var(--stroke-soft-200);border-radius:var(--r)}
.cardhead{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--stroke-soft-200);padding:4px 16px 12px}
@media (min-width:1024px){.cardhead{flex-direction:row;align-items:flex-end;justify-content:space-between;padding-bottom:0}}
.cardbody{padding:16px}
.tabs{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:40px}
.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14px;font-weight:500;height:40px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0 12px;color:var(--text-sub-600);transition:color var(--dur)}
.tabs button:hover{color:var(--text-strong-950)}
.tabs button.on{border-bottom-color:var(--stroke-strong-950);color:var(--text-strong-950)}
.tabs .cnt{border-radius:var(--r-full);padding:2px 6px;font-size:10px;font-weight:600;line-height:1;background:var(--bg-weak-50);color:var(--text-sub-600);font-variant-numeric:tabular-nums}
.tabs button.on .cnt{background:var(--bg-strong-950);color:var(--text-white-0)}
.filters{display:flex;flex:1;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (min-width:1024px){.filters{padding:8px 0}}
.filters .inp{height:32px;font-size:12px;border-radius:var(--r);padding:0 6px 0 8px}
.filters .hint{display:none}
.inp{display:flex;align-items:center;gap:8px;width:100%;height:36px;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0);padding:0 8px 0 10px;font-size:14px;transition:border-color var(--dur),box-shadow var(--dur)}
.inp:focus-within{border-color:var(--stroke-strong-950);box-shadow:0 0 0 2px var(--bg-white-0),0 0 0 4px var(--accent)}
.inp input,.inp select{border:0;outline:0;background:transparent;width:100%;min-width:0;height:100%;color:var(--text-strong-950)}
.inp input::placeholder{color:var(--text-soft-400)}
.inp .ad{color:var(--text-soft-400);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center}
.inp .ad svg{width:14px;height:14px}
.inp.locked{background:var(--bg-weak-50);border-style:dashed}
.inp.err{border-color:var(--err-base)}.inp.err:focus-within{box-shadow:0 0 0 2px var(--bg-white-0),0 0 0 4px rgba(251,55,72,.3)}
.inp .mono{text-align:right}
.inp input:disabled{cursor:not-allowed}
.inp:has(input:disabled){opacity:.5;background:var(--bg-weak-50)}
.tablewrap{overflow:hidden;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0)}
.tablewrap>div{overflow-x:auto}
table{width:100%;border-collapse:collapse;caption-side:bottom;font-size:14px}
thead{background:var(--bg-weak-50)}thead tr{border-bottom:1px solid var(--stroke-soft-200)}
th{height:36px;padding:8px 12px;text-align:left;vertical-align:middle;font-size:11px;font-weight:500;color:var(--text-soft-400);white-space:nowrap;text-transform:none;letter-spacing:0}
tbody tr{border-bottom:1px solid var(--stroke-soft-200);transition:background var(--dur)}tbody tr:last-child{border-bottom:0}
td{padding:8px 12px;vertical-align:middle;font-size:12px;letter-spacing:-.025em;color:var(--text-strong-950);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td,tr.row.sel td{background:var(--bg-weak-50)}
td .sub{color:var(--text-sub-600);font-size:11px;letter-spacing:0}
.right{text-align:right}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:500;border-radius:var(--r-full);font-size:11px;line-height:12px;letter-spacing:.22px;padding:2px 8px;white-space:nowrap}
.b-am{background:var(--away-light);color:var(--away-dark)}.b-em{background:var(--succ-light);color:var(--succ-dark)}.b-rd{background:var(--err-light);color:var(--err-dark)}.b-ne{background:var(--bg-weak-50);color:var(--text-strong-950)}.b-sky{background:var(--ver-light);color:var(--ver-dark)}.b-ac{background:var(--feat-light);color:var(--feat-dark)}
.badge .dot{width:6px;height:6px;border-radius:var(--r-full);background:currentColor;display:inline-block;flex:none}
.pulse{position:relative}.pulse::after{content:"";position:absolute;inset:0;border-radius:var(--r-full);background:currentColor;opacity:.75;animation:ping 1s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse::after{animation:none}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 20px;color:var(--text-sub-600);border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0)}
.empty b{display:block;color:var(--text-strong-950);font-size:16px;font-weight:500;letter-spacing:-.025em}
.empty .eico{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:var(--r-full);background:var(--bg-weak-50);color:var(--icon-sub-600);font-size:24px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;font-size:14px;color:var(--text-sub-600)}
.pinfo b{font-weight:500;color:var(--text-strong-950)}
.pbtns{display:flex;align-items:center;gap:4px}
.pbtn{display:inline-flex;height:32px;min-width:32px;align-items:center;justify-content:center;padding:0 8px;font-size:14px;font-weight:500;border-radius:var(--r);border:1px solid var(--stroke-soft-200);background:var(--bg-white-0);color:var(--text-sub-600);font-variant-numeric:tabular-nums}
.pbtn svg{width:16px;height:16px}
.pbtn:hover{border-color:transparent;background:var(--bg-weak-50);color:var(--text-strong-950)}
.pbtn:disabled{pointer-events:none;color:var(--text-disabled-300)}
.pbtn[data-active=true]{color:var(--text-strong-950)}
.psize{display:flex;align-items:center;gap:8px}

/* ── buttons (design-system/button.tsx) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 12px;font-size:14px;font-weight:500;border-radius:var(--r);border:1px solid transparent;background:var(--bg-strong-950);color:var(--text-white-0);white-space:nowrap;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease);user-select:none}
.btn svg{width:20px;height:20px}
.btn:hover{background:rgba(23,23,23,.9)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg-white-0),0 0 0 6px var(--accent-a10)}
.btn:disabled{cursor:not-allowed;pointer-events:none;background:var(--bg-weak-50);color:var(--text-disabled-300);border-color:transparent}
.btn.primary{background:var(--bg-strong-950);color:var(--text-white-0)}
.btn.stroke,.btn.white{background:var(--bg-white-0);border-color:var(--stroke-soft-200);color:var(--text-sub-600);box-shadow:0 1px 2px rgba(0,0,0,.05)}.btn.stroke:hover,.btn.white:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.btn.ghost{background:transparent;color:var(--text-sub-600)}.btn.ghost:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.btn.od{background:var(--bg-white-0);border-color:var(--err-base);color:var(--err-base)}.btn.od:hover{background:var(--err-a10)}
.btn.danger{background:var(--err-base);color:#fff}.btn.danger:hover{background:var(--err-700)}
.btn.sm{height:32px;padding:0 10px}.btn.sm svg{width:16px;height:16px}
.btn.xs{height:28px;padding:0 10px;font-size:14px}.btn.xs svg{width:16px;height:16px}
.btn .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:var(--r-full);animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.spin2{width:14px;height:14px;border:2px solid var(--stroke-sub-300);border-top-color:var(--text-strong-950);border-radius:var(--r-full);animation:s .8s linear infinite;display:inline-block;vertical-align:middle}
a.lnk{color:var(--accent);font-weight:500;text-decoration:none}a.lnk:hover{text-decoration:underline;text-underline-offset:4px}

/* ── form modal (design-system/form-modal.tsx) ── */
.ov{position:fixed;inset:0;background:rgba(23,23,23,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:50;animation:fade .15s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:42rem;max-height:90vh;background:var(--bg-white-0);border:1px solid var(--stroke-soft-200);border-radius:var(--r);box-shadow:var(--sh-md);display:flex;flex-direction:column;animation:zoom .15s var(--ease)}
@keyframes zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal.sm{max-width:28rem;box-shadow:var(--sh-lg)}
.mh{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--stroke-soft-200)}
.mh .ic{display:grid;width:36px;height:36px;flex:none;place-items:center;border-radius:var(--r);background:var(--accent-a10);color:var(--accent);font-size:18px}
.mh .ic svg{width:18px;height:18px}

.mh>div:not(.ic){min-width:0;flex:1}
.mh .ref{flex:none;align-self:center;font-size:12px;color:var(--text-sub-600)}
.mh .x{flex:none;align-self:flex-start;display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:var(--r);border:0;background:transparent;color:var(--icon-sub-600);font-size:16px;margin-left:4px}
.mh .x:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.mb{padding:16px 20px;overflow-y:auto;flex:1}
.mf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--stroke-soft-200);background:var(--bg-weak-50)}
.mf .est{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

@media (max-width:640px){.mf{flex-direction:column-reverse;align-items:stretch}.mf .grow{margin-left:0}.mf .grow .btn{flex:1;height:44px}.mf .est{order:2;width:100%}}

/* stepper (design-system/step-indicator.tsx) */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-sub-600)}
.step .n{display:inline-flex;width:20px;height:20px;flex:none;align-items:center;justify-content:center;border-radius:var(--r-full);font-size:12px;font-weight:500;background:var(--bg-white-0);border:1px solid var(--stroke-soft-200);color:var(--text-sub-600);transition:background var(--dur)}
.step .n svg{width:10px;height:10px;stroke-width:3}
.step.done .n{background:var(--succ-base);color:#fff;border-color:var(--succ-base)}
.step.cur{color:var(--text-strong-950)}.step.cur .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.step:not(.cur):not(.done){color:var(--text-soft-400)}
.conn{width:20px;height:20px;color:var(--icon-soft-400);flex:none}
.steps.compact{display:none}
@media (max-width:640px){.steps{display:none}.steps.compact{display:block;margin-bottom:14px;font-size:12px;font-weight:600}.steps.compact .bar{height:2px;background:var(--stroke-soft-200);margin-top:6px}.steps.compact .bar i{display:block;height:2px;background:var(--accent)}}

/* boxed sections (rounded-xl border bg-weak p-4 recipe) */
.sec{border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0);margin-bottom:14px}
.sec.tint{background:var(--bg-weak-50)}
.sec.off{background:var(--bg-weak-50);opacity:.7}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--stroke-soft-200);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-sub-600)}
.sh .hint{font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
.sb{padding:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g3,.g2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px}
.f label.lab{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:var(--text-strong-950);letter-spacing:0;text-transform:none;margin:0}
.f .req{color:var(--err-base)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;font-size:10px;font-weight:500;border-radius:var(--r);background:var(--bg-weak-50);color:var(--text-sub-600);margin-left:6px;vertical-align:middle;letter-spacing:0;text-transform:none}
.tag.acc{background:var(--accent-a10);color:var(--accent)}
.hint{display:inline-flex;align-items:flex-start;gap:4px;font-size:12px;line-height:16px;color:var(--text-sub-600);margin-top:2px}
.ferr{display:inline-flex;align-items:flex-start;gap:4px;font-size:12px;line-height:16px;color:var(--err-base);margin-top:2px}
.segc{display:inline-flex;align-items:center;height:36px;border-radius:var(--r);background:var(--bg-weak-50);padding:4px;gap:4px}
.segc button{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;font-size:14px;font-weight:500;color:var(--text-soft-400);transition:color var(--dur),background var(--dur)}
.segc button:hover{color:var(--text-sub-600)}
.segc button.on{background:var(--bg-white-0);color:var(--text-strong-950);box-shadow:var(--sh-xs)}
.sh .segc{height:32px;padding:3px}.sh .segc button{height:26px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;font-size:12px;line-height:16px;font-weight:500;border-radius:var(--r);border:1px solid transparent;background:var(--bg-weak-50);color:var(--text-sub-600)}
.chip .km{font-family:var(--mono);font-size:11px;color:var(--text-soft-400)}
.chip button{border:0;background:transparent;color:var(--text-sub-600);width:14px;height:14px;border-radius:var(--r);padding:0;line-height:1;display:inline-flex;align-items:center;justify-content:center;margin-right:-2px}.chip button:hover{background:rgba(0,0,0,.1)}
.opts{border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0);margin-top:4px;max-height:240px;overflow:auto;box-shadow:var(--sh-md)}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;font-size:14px;color:var(--text-strong-950);transition:background var(--dur)}
.opt:hover{background:var(--bg-weak-50)}.opt .km{font-family:var(--mono);font-size:11px;color:var(--text-sub-600)}
.opt.sel{color:var(--accent);font-weight:500}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--stroke-soft-200);border-radius:var(--r);padding:10px 12px;font-size:12px;line-height:1.5;background:var(--bg-weak-50);color:var(--text-sub-600);margin:10px 0}
.banner.warn{border-color:var(--warn-light);background:var(--warn-lighter);color:var(--warn-dark)}
.banner.err{border-color:var(--err-light);background:var(--err-lighter);color:var(--err-dark)}
.banner .grow{margin-left:auto}
.stops{display:grid;grid-template-columns:24px 1fr 1fr 150px;gap:8px 10px;align-items:center}
.stops .h{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-sub-600)}
.stops .n{width:22px;height:22px;border-radius:var(--r-full);background:var(--bg-weak-50);border:1px solid var(--stroke-soft-200);display:grid;place-items:center;font-size:11px;font-weight:500;font-family:var(--mono)}
@media (max-width:640px){.stops{grid-template-columns:24px 1fr}.stops .h.x{display:none}}
.map{height:150px;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-weak-50);background-image:linear-gradient(0deg,var(--alpha-4) 1px,transparent 1px),linear-gradient(90deg,var(--alpha-4) 1px,transparent 1px);background-size:24px 24px;position:relative;margin-top:12px;overflow:hidden}
.map svg{width:100%;height:100%}
@media (max-width:640px){.map{height:120px}}
.kv{display:grid;grid-template-columns:1fr auto;row-gap:8px;font-size:14px}
.kv .k{color:var(--text-sub-600)}.kv .k small{color:var(--text-soft-400);font-size:12px;margin-left:6px}.kv .v{text-align:right;color:var(--text-strong-950)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{border:1px solid var(--stroke-soft-200);border-radius:var(--r-gsm);padding:16px;background:var(--bg-white-0)}
.tile .l{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--text-sub-600)}
.tile .l .dot{width:8px;height:8px;border-radius:var(--r-full);display:inline-block}
.tile .a{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1;margin-top:12px;color:var(--text-strong-950)}
.tile .hint{margin-top:10px;padding-top:8px;border-top:1px solid var(--stroke-soft-200);font-size:11px;font-family:var(--mono);color:var(--text-sub-600)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--stroke-soft-200)}
.total .a{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1}
.rv{border-bottom:1px solid var(--stroke-soft-200);padding:12px 0}.rv:last-child{border-bottom:0}
.rv .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rv .rh b{font-size:14px;font-weight:600;letter-spacing:-.025em}
.rider{display:flex;gap:12px;align-items:center;border:1px solid var(--stroke-soft-200);border-radius:var(--r);padding:10px 12px;background:var(--bg-weak-50)}
.rider .av{width:32px;height:32px;border-radius:var(--r-full);background:var(--bg-white-0);border:1px solid var(--stroke-soft-200);display:grid;place-items:center;font-weight:600;font-size:12px}

/* ── side panel (components/Modal/SideBarModal.tsx) ── */
.panelwrap{position:fixed;inset:0;z-index:45;display:flex;justify-content:flex-end;align-items:stretch;background:rgba(23,23,23,.45);backdrop-filter:blur(4px)}
.panel{width:500px;max-width:100%;height:100%;background:var(--bg-white-0);border-left:1px solid var(--stroke-soft-200);box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slidein .3s var(--ease)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--stroke-soft-200);flex:none;flex-wrap:wrap}
.ph .l1{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;flex-wrap:wrap;flex:1;min-width:0}
.ph .l2{font-size:12px;color:var(--text-sub-600);margin-top:4px;width:100%;line-height:1.5}
.ph .x{margin:-2px -4px 0 auto;display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:var(--r);border:0;background:transparent;color:var(--icon-sub-600);font-size:20px;flex:none}
.ph .x:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.pb{padding:4px 20px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.pb section{padding:16px 0;border-bottom:1px solid var(--stroke-soft-200)}.pb section:last-child{border-bottom:0}
.pb h4{margin:0 0 10px;font-size:14px;font-weight:600;letter-spacing:-.025em;color:var(--text-strong-950)}
.pf{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--stroke-soft-200);background:var(--bg-weak-50);flex-wrap:wrap;flex:none}
.pf .grow{margin-left:auto;display:flex;gap:8px}
@media (max-width:640px){.panel{width:100%}.pf{flex-direction:column-reverse;align-items:stretch}.pf .grow{margin-left:0}.pf .btn{height:44px;flex:1}}
.stop{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;font-size:14px}
.stop .n{width:22px;height:22px;border-radius:var(--r-full);background:var(--bg-weak-50);border:1px solid var(--stroke-soft-200);display:grid;place-items:center;font-size:11px;font-weight:500;font-family:var(--mono)}
.stop .ad{color:var(--text-sub-600);font-size:12px}
.hist{font-size:12px;color:var(--text-sub-600);display:grid;grid-template-columns:auto 1fr;gap:6px 12px;line-height:1.5}
/* daftar perubahan pada baris riwayat EDITED / RESUBMITTED (CR3-D4) */
.chg{margin-top:4px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:6px 8px;border-left:2px solid var(--accent-a24);background:var(--bg-weak-50);border-radius:var(--r);font-size:11.5px}
.chg .cf{color:var(--text-strong-950);font-weight:600;white-space:nowrap}
.chg .cv{color:var(--text-sub-600)}
.chg .cv i{font-style:normal;color:var(--text-soft-400);margin:0 2px}
.chg .cv .to{color:var(--text-strong-950);font-weight:600}
.vbadge{background:var(--feat-lighter);color:var(--feat-dark);box-shadow:inset 0 0 0 1px var(--accent-a16)}
.skel{height:14px;border-radius:var(--r);background:rgba(235,235,235,.8);animation:pulse 1.6s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{50%{opacity:.5}}

/* ── toast (design-system/toaster.tsx, bottom-center per App.tsx) ── */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:8px;width:max-content;max-width:420px;background:var(--bg-white-0);color:var(--text-strong-950);border:1px solid var(--stroke-soft-200);border-radius:var(--r);padding:8px 10px;font-size:14px;line-height:20px;font-weight:500;box-shadow:var(--sh-tip)}
.toast::before{content:"";width:8px;height:8px;border-radius:var(--r-full);background:var(--succ-base);flex:none}
.toast.err::before{background:var(--err-base)}
.toast a{color:var(--info-base);font-weight:500;text-decoration:none;margin-left:4px}
.toast .mono{font-weight:600}

/* ── autoplay narrator + highlight (harness) ── */
#narr{flex:none;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:12px 20px 12px 20px;background:var(--bg-white-0);border-top:1px solid var(--stroke-soft-200);position:relative}
#narr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
#narr .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
#narr .a{font-size:15px;font-weight:600;line-height:1.35;margin-top:3px;color:var(--text-strong-950);letter-spacing:-.01em;text-wrap:balance}
#narr .dots{display:flex;gap:4px;margin-top:8px}#narr .dots i{width:18px;height:3px;border-radius:2px;background:var(--stroke-soft-200)}#narr .dots i.on{background:var(--accent)}#narr .dots i.done{background:var(--accent-a24)}
#narr .ctl{display:flex;gap:6px;align-self:center}
@media (max-width:640px){#narr{grid-template-columns:1fr}#narr .ctl{justify-content:flex-end}}
.hl{outline:2px solid var(--accent) !important;outline-offset:3px;box-shadow:0 0 0 7px var(--accent-a16) !important;border-radius:var(--r-gsm);transition:box-shadow .3s}

/* CR-2: route planner page + builder drawer */
.segc.sm{height:32px;padding:3px}.segc.sm button{height:26px;padding:0 9px;font-size:12px}
.swl{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text-sub-600);cursor:pointer}.swl input{accent-color:#171717}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px}
.panel.wide{width:640px}
.src{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-full);font-size:10px;font-weight:600;background:var(--bg-weak-50);color:var(--text-sub-600);white-space:nowrap}
.src.lane{background:var(--succ-lighter);color:var(--succ-dark)}
.src.dir{background:var(--ver-lighter);color:var(--ver-dark)}
.src.hav{background:var(--warn-lighter);color:var(--warn-dark)}
.src.ed{background:var(--accent-a10);color:var(--accent)}
.pd{display:flex;flex-direction:column;gap:10px}
.pd-stop{border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pd-top .n{width:22px;height:22px;flex:none;border-radius:var(--r-full);background:var(--bg-weak-50);border:1px solid var(--stroke-soft-200);display:grid;place-items:center;font-size:11px;font-weight:500;font-family:var(--mono)}
.pd-act{display:flex;gap:2px;margin-left:auto}
.pd-leg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-sub-600);padding-bottom:2px;border-bottom:1px dashed var(--stroke-soft-200)}
.pd-leg svg{width:14px;height:14px}
.pd-leg .inp{width:112px;height:30px}
.pd-tot{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13px}
.pd-tot .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rlist{display:flex;flex-direction:column;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0);margin-top:10px}

 let out=[...map.values()];if(q)out=out.filter(p=>norm(p.name).includes(norm(q))||norm(p.addr).includes(norm(q)));

 if(prevLegs&&prevStops)prevLegs.forEach(l=>{const a=prevStops[l.fromSeq-1],b=prevStops[l.toSeq-1];if(l&&l.edited&&a&&b)keep.set(laneKey(a.name,b.name),l.km)});

/* money formula v2 — mirrors UjpCostService (server). */
function calc(f){
  const cfg=cfgFor(f.clientId);const split=kmSplit(f.stops,f.legs);
  const km=+f.km||0, price=+f.price||0;
  const baseline=f.vehicleEnergy==='EV'?(f.konsumsi>0?1/f.konsumsi:0):(+f.baseline||0);
  const kmM=km*(1+KM_MARGIN_PCT/100);
  const liters=baseline>0?Math.round((kmM/baseline)*10)/10:0;
  const computed=Math.round(liters*price);
  const bbm=f.overrideBbm!=null?+f.overrideBbm:computed;
  const c=f.costs;const hasQ=f.eMoney==='QRIS'||f.eMoney==='FLAZZ_QRIS';const hasF=f.eMoney==='FLAZZ'||f.eMoney==='FLAZZ_QRIS';
  const manual=(+c.parkirManual||0)+(+c.bongkar||0)+(+c.lain||0)+(+c.makan||0);
  const tollTap=(+c.toll||0)+(+c.parkirTap||0);
  const rev=f.isReverse&&cfg.reverse>0?cfg.reverse:0;
  let F=0,Q=0,T=0;
  if(f.payee==='subcon'){T=+f.nominalTransfer||0}
  else{ if(hasQ)Q+=bbm;else if(hasF)F+=bbm;else T+=bbm; if(hasF)F+=tollTap;else T+=tollTap; T+=manual+rev }
  const complete=f.payee==='subcon'?(+f.nominalTransfer>0):(km>0&&baseline>0&&price>0);
  return {kmM,liters,computed,bbm,tollTap,manual,rev,F,Q,T,total:F+Q+T,complete,baseline,kmAll:split.all,kmCharged:split.charged,charged:cfg.charged,marginPct:KM_MARGIN_PCT,hasQ,hasF};
}

function scheduleEstimate(){clearTimeout(estTimer);const f=S.ui.wizard;if(!f)return;const c=calc(f);if(!c.complete){est={status:'idle',lastGood:null,at:0};renderEstimate();return}
  est.status=est.lastGood?'stale':'pending';renderEstimate();estTimer=setTimeout(fireEstimate,300)}
function fireEstimate(){const seq=++estSeq;const f=S.ui.wizard;if(!f)return;const snapshot=JSON.parse(JSON.stringify(f));setTimeout(()=>{if(seq!==estSeq||!S.ui.wizard)return;if(S.sim.fail){est.status='error';renderEstimate();return}est.lastGood=calc(snapshot);est.status='ok';est.at=Date.now();renderEstimate()},S.sim.latency)}

/* POST/PATCH /v1/route-plans — simpan dulu, lalu lane write-back best-effort (CR2-D5/D8/D12) */
function savePlan(){const p=S.ui.plan;const e={};
  if(!p.clientId)e.clientId='Pilih client';
  if(!p.name.trim())e.name='Nama rute wajib diisi';
  else if(S.routes.some(r=>r.clientId===p.clientId&&r.id!==p.id&&norm(r.name)===norm(p.name)))e.name='Nama rute sudah dipakai client ini';
  if(p.stops.length<2)e.stops='Butuh minimal 2 stop';
  else if(p.stops.some(s=>!String(s.name).trim()||!String(s.addr).trim()))e.stops='Nama dan alamat setiap stop wajib diisi';
  else if(!p.stops.some(s=>s.role==='PICKUP')||!p.stops.some(s=>s.role==='DROP_OFF'))e.stops='Butuh minimal 1 Pickup dan 1 Drop';
  else if(p.legs.some(l=>!(+l.km>0)))e.stops='Semua leg wajib punya km > 0';
  p.errors=e;if(Object.keys(e).length){renderAll();return}
  let written=0;const wasManual=p.stops.map(s=>!s.addressId); // pasangan yang menyentuh stop manual ikut ditulis balik
  p.stops.forEach((a,i)=>{const b=p.stops[i+1];if(!b||(!wasManual[i]&&!wasManual[i+1]))return;const leg=p.legs[i];const ex=laneFor(a.name,b.name);
    if(ex){if(!a.addressId){a.addressId=ex.id;a.endpoint='origin'}if(!b.addressId){b.addressId=ex.id;b.endpoint='destination'}return}
    const l={id:'a'+uid(),clientId:p.clientId,o:{name:a.name,addr:a.addr,lat:a.lat,lng:a.lng},d:{name:b.name,addr:b.addr,lat:b.lat,lng:b.lng},distance:Math.round((+leg.km||0)*1000),state:'DRAFT'};
    ADDRESSES.push(l);written++;
    if(!a.addressId){a.addressId=l.id;a.endpoint='origin'}if(!b.addressId){b.addressId=l.id;b.endpoint='destination'}});
  const now=Date.now();const me=USERS[S.persona].email;let plan=S.routes.find(r=>r.id===p.id);
  if(plan)Object.assign(plan,{name:p.name.trim(),clientId:p.clientId,stops:p.stops.map(s=>({...s})),legs:p.legs.map(l=>({...l})),updatedAt:now});
  else{plan={id:'rt'+uid(),clientId:p.clientId,name:p.name.trim(),stops:p.stops.map(s=>({...s})),legs:p.legs.map(l=>({...l})),active:true,createdBy:me,updatedAt:now};S.routes.push(plan)}
  const from=p.from;S.ui.plan=null;
  if(from==='wizard'&&S.ui.wizard){const f=S.ui.wizard;f.kmTouched=false;applyRoute(f,plan);f.routeQuery='';f.routeOpen=false;scheduleEstimate()}
  else S.ui.view='planner';
  renderAll();toast(`Rute tersimpan${written?` · ${written} alamat masuk Addresses sebagai DRAFT`:''}`)}

function validate(step){const f=S.ui.wizard;const e={};
  const ed=S.ui.wizardEdit;
  if(step===1){if(!f.clientId)e.clientId='Pilih client';
    /* saat mengubah UJP lama, tanggal yang sudah lewat boleh dipertahankan apa adanya (CR3-D2) */

    else if(f.deliveryDate<iso(new Date())&&!(ed&&f.deliveryDate===ed.date0))e.deliveryDate='Tanggal kirim tidak boleh sebelum hari ini (WIB)'}
  if(step===2){if(!f.routePlanId)e.route='Pilih rute tersimpan untuk client ini';else if(f.legs.some(l=>!(+l.km>0)))e.route='Rute punya leg tanpa km; perbaiki di Route Planner';if(!(+f.km>0))e.km='KM diajukan wajib > 0'}

function bindWizard(){const f=S.ui.wizard;if(!f)return;const step=f.step;const refocus=sel=>{const el=document.querySelector(sel);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}};
  $('#wzx').onclick=closeWizard;$('#cancel').onclick=closeWizard;const bk=$('#back');if(bk)bk.onclick=()=>{f.step--;renderAll()};
  const nx=$('#next');if(nx)nx.onclick=()=>{if(validate(step)){f.step++;f.errors={};renderAll();if(f.step===3)scheduleEstimate();if(f.step===5)fireEstimate()}else{renderAll();const first=document.querySelector('#wzb .err input,#wzb .err select,#wzb .ferr');if(first)first.scrollIntoView({block:'center'})}};
  const sb=$('#submit');if(sb)sb.onclick=()=>{S.ui.wizardEdit?saveEdit():submitUjp()};const rt=$('#retry');if(rt)rt.onclick=()=>{S.sim.fail=false;renderChrome();fireEstimate()};
  document.querySelectorAll('#wzb [data-go]').forEach(b=>b.onclick=()=>{f.step=+b.dataset.go;renderAll()});
  const gc=$('#gocfg2');if(gc)gc.onclick=()=>{S.ui.wizard=null;S.ui.view='config';renderAll()};
  if(step===1){$('#cl').onchange=e=>{f.clientId=+e.target.value||null;f.routePlanId=null;f.stops=[];f.legs=[];f.kmTouched=false;f.km=0;f.eMoney=cfgFor(f.clientId).defaultEMoney||'NONE';renderAll()};$('#dd').onchange=e=>{f.deliveryDate=e.target.value;if(f.vehicleId&&!f.priceTouched)f.price=priceFor(f.fuel,f.deliveryDate)};$('#ot').onchange=e=>{f.opsTeam=e.target.value};$('#sv').onchange=e=>{f.serviceType=e.target.value};$('#sh').onchange=e=>{f.shift=e.target.value};$('#jm').onchange=e=>{f.jamMulai=e.target.value};$('#js').onchange=e=>{f.jamSelesai=e.target.value};$('#rev').onchange=e=>{f.isReverse=e.target.checked;renderAll()}}
  if(step===2){const openDrawer=o=>openPlanDrawer(Object.assign({clientId:f.clientId,locked:true,from:'wizard'},o));
    const rq=$('#rq');if(rq){rq.oninput=e=>{f.routeQuery=e.target.value;f.routeOpen=true;renderAll();refocus('#rq')};rq.onfocus=()=>{if(!f.routeOpen){f.routeOpen=true;renderAll();refocus('#rq')}}}
    document.querySelectorAll('[data-route]').forEach(o=>o.onclick=()=>{f.kmTouched=false;applyRoute(f,S.routes.find(r=>r.id===o.dataset.route));f.routeQuery='';f.routeOpen=false;renderAll()});
    const np=$('#newplan');if(np)np.onclick=()=>openDrawer();const np2=$('#newplan2');if(np2)np2.onclick=()=>openDrawer();
    const ep=$('#editplan');if(ep)ep.onclick=()=>openDrawer({plan:S.routes.find(r=>r.id===f.routePlanId)});
    const rc2=$('#rclear2');if(rc2)rc2.onclick=()=>{f.routePlanId=null;f.stops=[];f.legs=[];f.km=0;f.kmTouched=false;renderAll()};
    const km=$('#km');km.oninput=e=>{const v=parseFloat(e.target.value.replace(/\./g,'').replace(',','.'));f.km=isNaN(v)?0:Math.round(v*10)/10;f.kmTouched=true};km.onblur=()=>{km.value=f.km?fmtKm(f.km):'';scheduleEstimate()};km.onkeydown=e=>{if(e.key==='Enter')e.preventDefault()}}
  if(step===3){document.querySelectorAll('[data-py]').forEach(b=>b.onclick=()=>{f.payee=b.dataset.py;if(f.payee==='driver'){const r=RIDERS.find(x=>x.id===f.riderId);f.bank=r?{...r.bank}:{name:'',acct:'',holder:''}}else{const v=VENDORS.find(x=>x.id===f.vendorId);f.bank=v?{...v.bank}:{name:'',acct:'',holder:''}}renderAll();scheduleEstimate()});
    const vq=$('#vq');if(vq){vq.oninput=e=>{f.vendorQuery=e.target.value;f.vendorId=null;renderAll();refocus('#vq')}}document.querySelectorAll('[data-vend]').forEach(o=>o.onclick=()=>{applyVendor(f,VENDORS.find(v=>v.id===o.dataset.vend));renderAll()});
    const pl=$('#plate');pl.oninput=e=>{f.plate=e.target.value;f.vehicleId=null;f.plateOpen=true;renderAll();refocus('#plate')};pl.onfocus=()=>{if(!f.plateOpen&&!f.vehicleId&&f.payee==='driver'){f.plateOpen=true;renderAll();refocus('#plate')}};
    document.querySelectorAll('[data-v]').forEach(o=>o.onclick=()=>{applyVehicle(f,VEHICLES.find(v=>v.id===o.dataset.v));f.plateOpen=false;renderAll();scheduleEstimate()});

    const base=$('#base');if(base){base.oninput=e=>{const v=parseFloat(e.target.value.replace(',','.'));f.baseline=isNaN(v)?0:v;f.baselineTouched=true;scheduleEstimate()};base.onblur=()=>renderAll()}
    const kons=$('#kons');if(kons){kons.oninput=e=>{const v=parseFloat(e.target.value.replace(',','.'));f.konsumsi=isNaN(v)?0:v;f.baselineTouched=true;scheduleEstimate()};kons.onblur=()=>renderAll()}

    const vd=$('#vdrv');if(vd)vd.oninput=e=>{f.vendorDriver=e.target.value};
    $('#bn').oninput=e=>{f.bank.name=e.target.value};$('#ba').oninput=e=>{f.bank.acct=e.target.value.replace(/\D/g,'')};$('#bh').oninput=e=>{f.bank.holder=e.target.value};$('#cs').oninput=e=>{f.cargo.sender=e.target.value};$('#cr').oninput=e=>{f.cargo.receiver=e.target.value};$('#ci').oninput=e=>{f.cargo.item=e.target.value};$('#cb').oninput=e=>{f.cargo.bobot=e.target.value}}}
function submitUjp(){const f=S.ui.wizard;if(!validate(1)||!validate(2)||!validate(3)||!validate(4)){renderAll();return}if(!est.lastGood||est.status==='error')return;S.ui.busy='submit';renderAll();

    const t=calc(snap);const ref=nextRef();const r=RIDERS.find(x=>x.id===snap.riderId);
    const u={id:uid(),ref,status:'SUBMITTED',version:1,form:snap,totals:t,createdAt:Date.now(),requester:USERS[S.persona].email,client:CLIENTS.find(c=>c.id===snap.clientId),rider:r||null,vendor:VENDORS.find(x=>x.id===snap.vendorId)||null,history:[{at:Date.now(),by:USERS[S.persona].email,from:null,to:'SUBMITTED'}],shipmentId:null,shipmentSkipped:null,reason:null,note:null,decidedBy:null,decidedAt:null};

/* PUT /v1/ujp/:id — requester mengubah UJP yang Menunggu atau Ditolak (CR3-D2/D3/D4).

function saveEdit(){const f=S.ui.wizard;const ed=S.ui.wizardEdit;if(!ed)return;
  const u=S.ujps.find(x=>x.id===ed.id);if(!u)return;
  if(!validate(1)||!validate(2)||!validate(3)||!validate(4)){renderAll();return}if(!est.lastGood||est.status==='error')return;
  S.ui.busy='submit';renderAll();
  setTimeout(()=>{
    if(u.status!=='SUBMITTED'&&u.status!=='REJECTED'){S.ui.busy=null;S.ui.wizard=null;S.ui.wizardEdit=null;S.ui.detailId=u.id;renderAll();toast(`<span class="mono">${u.ref}</span> sudah diputuskan · perubahan tidak disimpan`,'err');return}
    const before=u.form;const snap=JSON.parse(JSON.stringify(f));const changes=diffForm(before,snap);
    const was=u.status;const me=USERS[S.persona].email;const now=Date.now();
    u.form=snap;u.totals=calc(snap);u.version=(u.version||1)+1;
    u.client=CLIENTS.find(c=>c.id===snap.clientId);u.rider=RIDERS.find(x=>x.id===snap.riderId)||null;u.vendor=VENDORS.find(x=>x.id===snap.vendorId)||null;
    if(was==='REJECTED'){u.status='SUBMITTED';u.reason=null;u.note=null;u.decidedBy=null;u.decidedAt=null;
      u.history.push({at:now,by:me,from:'REJECTED',to:'SUBMITTED',changes})}
    else u.history.push({at:now,by:me,from:'SUBMITTED',to:'SUBMITTED',changes});
    S.ui.busy=null;S.ui.wizard=null;S.ui.wizardEdit=null;S.ui.tab='SUBMITTED';S.ui.detailId=u.id;S.ui.panelId=null;S.ui.panelVersion=null;S.ui.conflict=null;
    renderAll();toast(`<span class="mono">${u.ref}</span> ${was==='REJECTED'?'diajukan ulang':'diperbarui'}${changes.length?` · ${changes.length} perubahan`:''}`)},S.sim.latency+300)}

function bindPanel(){const u=S.ujps.find(x=>x.id===S.ui.detailId);if(!u)return;const close=()=>{S.ui.detailId=null;S.ui.conflict=null;S.ui.panelId=null;S.ui.panelVersion=null;renderAll()};

  const cp=$('#copy');if(cp)cp.onclick=()=>{try{navigator.clipboard?.writeText(u.form.bank.acct)}catch(_){}toast('Nomor rekening disalin')};
  const ap=$('#papprove');if(ap)ap.onclick=()=>decide(u,'approved');const rj=$('#preject');if(rj)rj.onclick=()=>{S.ui.decision={id:u.id,mode:'reject',reason:'',note:''};renderAll()};
  const pc=$('#pcancel');if(pc)pc.onclick=()=>{S.ui.decision={id:u.id,mode:'cancel'};renderAll()};
  /* CR3-D6: Ubah (Menunggu) / Ubah & ajukan ulang (Ditolak) — wizard terbuka prefilled dalam mode ubah */
  const pe=$('#pedit');if(pe)pe.onclick=()=>{const pf=JSON.parse(JSON.stringify(u.form));pf.step=1;pf.errors={};openWizard(pf,{editId:u.id});estimateNow();renderAll()};
  const pr=$('#preload');if(pr)pr.onclick=()=>{S.ui.panelVersion=u.version||1;S.ui.conflict=null;renderAll();toast(`<span class="mono">${u.ref}</span> dimuat ulang · v${u.version||1}`)};
  const pg=$('#pchg');if(pg)pg.onclick=e=>{if(e&&e.preventDefault)e.preventDefault();const h=$('#phist');if(h){h.classList.add('hl');try{h.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}setTimeout(()=>h.classList.remove('hl'),1600)}return false}}
function decide(u,action,reason,note){const me=USERS[S.persona].email;if(!isApprover(me)||u.requester===me)return;
  /* expectedVersion ikut dikirim; requester yang mengubah UJP di sela-sela → 409 UJP_STALE, status tidak berubah (CR3-D5) */
  if(S.ui.panelVersion!=null&&(u.version||1)!==S.ui.panelVersion){S.ui.conflict={id:u.id,kind:'STALE'};S.ui.decision=null;S.ui.busy=null;renderAll();toast(`<span class="mono">${u.ref}</span> diperbarui requester · keputusan tidak dikirim`,'err');return}
  S.ui.busy='approve';S.ui.decision=null;renderAll();
  setTimeout(()=>{if(u.status!=='SUBMITTED'){S.ui.conflict={id:u.id,kind:'DECIDED'};S.ui.busy=null;renderAll();return}
    if(action==='approved'){u.status='APPROVED';u.decidedBy=me;u.decidedAt=Date.now();if(u.form.payee==='subcon'){u.shipmentSkipped='SUBCON';u.history.push({at:Date.now(),by:me,from:'SUBMITTED',to:'APPROVED',note:'Subcon: shipment tidak dibuat'});toast(`<span class="mono">${u.ref}</span> disetujui · subcon, tanpa shipment`)}else{const sh=mkShipment(u);u.shipmentId=sh.id;u.history.push({at:Date.now(),by:me,from:'SUBMITTED',to:'APPROVED',note:`Shipment ${sh.waybill} dibuat (${sh.stops.length} stop)`});toast(`<span class="mono">${u.ref}</span> disetujui · Shipment <span class="mono">${sh.waybill}</span> dibuat <a href="#" onclick="return false">Lihat shipment</a>`)}}
    else{u.status='REJECTED';u.reason=reason;u.note=note;u.decidedBy=me;u.decidedAt=Date.now();u.history.push({at:Date.now(),by:me,from:'SUBMITTED',to:'REJECTED',note:`${REASONS.find(r=>r.code===reason).label}${note?' · '+note:''}`});toast(`<span class="mono">${u.ref}</span> ditolak`)}
    S.ui.busy=null;renderAll()},S.sim.latency+500)}
function renderDecision(){const d=S.ui.decision;if(!d)return '';const u=S.ujps.find(x=>x.id===d.id);
  if(d.mode==='cancel')return `<div class="ov" id="dov" style="z-index:55"><div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="mh"><div class="ic dn"><i data-lucide="triangle-alert"></i></div><div><h3 id="dt">Batalkan pengajuan ${u.ref}?</h3><p>Pengajuan akan ditandai Dibatalkan. Tidak dapat dibuka kembali.</p></div></div><div class="mb"><p style="margin:0;color:var(--ink2)">Anda bisa membuat pengajuan baru dari data ini nanti.</p></div><div class="mf"><div class="grow"><button type="button" class="btn stroke" id="dno">Kembali</button><button type="button" class="btn danger" id="dyes">Batalkan pengajuan</button></div></div></div></div>`;
  const rs=REASONS.find(r=>r.code===d.reason);const needNote=rs?.note&&!d.note.trim();
  return `<div class="ov" id="dov" style="z-index:55"><div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="mh"><div class="ic dn"><i data-lucide="triangle-alert"></i></div><div><h3 id="dt">Tolak ${u.ref}</h3><p>Requester akan melihat alasan ini dan dapat membuat ulang.</p></div></div>

    <div class="f" style="margin-top:12px"><label class="lab" for="nt">Catatan ${rs?.note?'<span class="req">*</span>':'(opsional)'}</label><textarea id="nt" rows="3" style="width:100%;border:1px solid var(--stroke-soft-200);border-radius:2px;padding:8px 10px;resize:vertical;font:inherit" placeholder="Apa yang harus diperbaiki requester?">${esc(d.note)}</textarea>${needNote?'<div class="ferr">Alasan “Lainnya” wajib disertai catatan.</div>':''}</div></div>
   <div class="mf"><div class="grow"><button type="button" class="btn stroke" id="dno">Batal</button><button type="button" class="btn danger" id="dyes" ${!d.reason||needNote?'disabled':''}>Tolak UJP</button></div></div></div></div>`}
function bindDecision(){const d=S.ui.decision;if(!d)return;const u=S.ujps.find(x=>x.id===d.id);$('#dno').onclick=()=>{S.ui.decision=null;renderAll()};
  if(d.mode==='cancel'){$('#dyes').onclick=()=>{u.status='CANCELLED';u.history.push({at:Date.now(),by:u.requester,from:'SUBMITTED',to:'CANCELLED'});S.ui.decision=null;renderAll();toast('Pengajuan dibatalkan')};return}

let scene=0;
const auto={on:false,paused:false,k:0,i:0,t:null,done:false};
const ACT_MS=2600, SCENE_GAP_MS=1100;
function applyScene(i){scene=Math.max(0,Math.min(SCENES.length-1,i));seed();est={status:'idle'};for(let k=0;k<=scene;k++)SCENES[k].run(S);if(S.ui.wizard)estimateNow();renderAll()}
function highlight(sel){document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));if(!sel)return;const el=document.querySelector(sel);if(el){el.classList.add('hl');try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}}}
function autoStart(){clearTimeout(auto.t);Object.assign(auto,{on:true,paused:false,k:0,i:0,done:false});applyScene(0);autoTick()}
function autoTick(){if(!auto.on||auto.paused)return;const sc=SCENES[auto.k];const acts=sc.do||[];
  if(auto.i<acts.length){renderNarr();renderRail();highlight(acts[auto.i].hl);auto.t=setTimeout(()=>{auto.i++;autoTick()},ACT_MS)}
  else{auto.t=setTimeout(()=>{if(auto.k<SCENES.length-1){auto.k++;auto.i=0;applyScene(auto.k);autoTick()}else{auto.on=false;auto.done=true;highlight(null);renderNarr();renderRail()}},SCENE_GAP_MS)}}
function autoPause(){if(!auto.on)return;auto.paused=!auto.paused;clearTimeout(auto.t);if(!auto.paused)autoTick();else{renderNarr();renderRail()}}
function autoStop(){clearTimeout(auto.t);auto.on=false;auto.paused=false;auto.done=false;highlight(null);renderNarr();renderRail()}
function renderNarr(){const n=$('#narr');if(!n)return;if(MODE!=='flow'||(!auto.on&&!auto.done)){n.hidden=true;return}n.hidden=false;
  if(auto.done){n.innerHTML=`<div><div class="k">Selesai · ${SCENES.length} adegan</div><div class="a">Alur lengkap: Route Planner dan builder-nya, lane DRAFT dari stop manual, wizard yang hanya memilih rute, biaya tiga instrumen, subcon tanpa shipment, aturan client, persetujuan menjadi shipment — dan jalur CR-3: requester mengubah UJP selama Menunggu atau Ditolak, nomor tetap, versi dan daftar perubahan tercatat, keputusan dari panel basi ditolak server. Layar sekarang bebas dicoba.</div></div><div class="ctl"><button type="button" class="btn primary sm" id="nAgain">Ulangi alur</button><button type="button" class="btn stroke sm" id="nClose">Tutup</button></div>`;$('#nAgain').onclick=autoStart;$('#nClose').onclick=autoStop;return}
  const sc=SCENES[auto.k];const acts=sc.do||[];const a=acts[Math.min(auto.i,acts.length-1)];
  n.innerHTML=`<div><div class="k">Adegan ${pad(auto.k+1,2)}/${SCENES.length} · ${esc(sc.t)}${auto.paused?' · jeda':''}</div><div class="a">${esc(a?.t||'')}</div><div class="dots" aria-hidden="true">${acts.map((_,j)=>`<i class="${j<auto.i?'done':j===auto.i?'on':''}"></i>`).join('')}</div></div><div class="ctl"><button type="button" class="btn stroke sm" id="nPause">${auto.paused?'Lanjutkan':'Jeda'}</button><button type="button" class="btn ghost sm" id="nStop">Berhenti</button></div>`;
  $('#nPause').onclick=autoPause;$('#nStop').onclick=autoStop}
function renderRail(){const st=$('#stage');if(MODE!=='flow'){$('#rail').hidden=true;st.classList.remove('flowmode');return}$('#rail').hidden=false;st.classList.add('flowmode');const sc=SCENES[scene];const running=auto.on;
  const item=(s,i)=>{const acts=s.do||[];const on=i===scene;const done=running?i<auto.k:i<scene;const st=on&&running&&auto.k===scene?`${Math.min(auto.i,acts.length)}/${acts.length}`:`${acts.length} langkah`;
    return `<li class="${on?'on':''} ${done?'done':''}"><button type="button" class="sc" data-s="${i}" aria-current="${on?'step':'false'}"><span class="n">${done&&!on?'✓':pad(i+1,2)}</span><span>${esc(s.t)}</span><span class="st">${st}</span></button>
     ${on?`<div class="sc-body"><ol class="todo">${acts.map((a,j)=>{const k=running&&auto.k===scene?(j<auto.i?'done':j===auto.i?'cur':''):'';return `<li class="${k}"><span class="m">${k==='done'?'✓':j+1}</span><span>${esc(a.t)}</span></li>`}).join('')}</ol>
      <div class="why"><div class="k">Mengapa begini</div><p>${s.c}</p><div class="dd">${s.dd.map(d=>`<span class="badge b-ne mono" style="font-size:10px">${d}</span>`).join('')}</div></div></div>`:''}</li>`};
  $('#rail').innerHTML=`<div class="rail-h"><span class="eyebrow"><span class="num">UJP</span>Simulasi alur · CR-2 + CR-3</span><h2>Dari pengajuan UJP sampai jadi shipment</h2><p class="sub">Satu klik menjalankan ${SCENES.length} adegan dan menjelaskan apa yang diisi di setiap langkah. Setiap layar tetap bisa dicoba langsung.</p>
   ${running?`<div class="runrow"><button type="button" class="btn primary" id="rPause"><i data-lucide="${auto.paused?'play':'pause'}"></i>${auto.paused?'Lanjutkan':'Jeda'}</button><button type="button" class="btn stroke" id="rStop"><i data-lucide="square"></i>Berhenti</button></div>`:`<div class="runrow"><button type="button" class="btn primary" id="run"><i data-lucide="play"></i>Jalankan alur</button></div>`}
   <div class="prog"><span>Adegan ${pad(scene+1,2)}/${SCENES.length}</span><span class="bar"><i style="width:${Math.round(((scene+(running?Math.min(auto.i,(sc.do||[]).length)/Math.max(1,(sc.do||[]).length):0))/SCENES.length)*100)}%"></i></span></div></div>
  <div class="rail-b"><ol class="scenes">${SCENES.map(item).join('')}</ol></div>
  <div class="rail-f"><button type="button" class="btn stroke sm" id="prev" ${scene===0?'disabled':''}><i data-lucide="chevron-left"></i>Sebelumnya</button><button type="button" class="btn ${running?'stroke':'primary'} sm" id="nxt" ${scene===SCENES.length-1?'disabled':''}>Berikutnya<i data-lucide="chevron-right"></i></button></div>`;
  const run=$('#run');if(run)run.onclick=autoStart;const rp=$('#rPause');if(rp)rp.onclick=autoPause;const rs=$('#rStop');if(rs)rs.onclick=autoStop;
  $('#rail').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(+b.dataset.s===scene)return;autoStop();applyScene(+b.dataset.s)});$('#prev').onclick=()=>{autoStop();applyScene(scene-1)};$('#nxt').onclick=()=>{autoStop();applyScene(scene+1)};
  const cur=$('#rail li.on');if(cur){try{cur.scrollIntoView({block:'nearest'})}catch(_){}}icons()}

  $('#sidenav').querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{if(e&&e.preventDefault)e.preventDefault();const k=a.dataset.nav;S.ui.view=k==='planner'?'planner':'list';S.ui.plan=null;S.ui.cfgEdit=null;renderAll();return false})}
function icons(){if(window.lucide&&lucide.createIcons){try{lucide.createIcons({attrs:{'stroke-width':1.75}})}catch(_){}}}

/* ───────────────────────── root ───────────────────────── */
function renderAll(){renderChrome();renderRail();renderNarr();renderSidebar();renderPage();$('#layer').innerHTML=renderPanel()+renderWizard()+renderDecision()+renderPlanDrawer();bindPanel();bindWizard();bindDecision();bindPlanDrawer();icons()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.ui.plan){closePlanDrawer()}else if(S.ui.decision){S.ui.decision=null;renderAll()}else if(S.ui.wizard&&S.ui.busy!=='submit'){closeWizard()}else if(S.ui.detailId){S.ui.detailId=null;renderAll()}}
  if(MODE==='flow'&&!e.target.matches('input,select,textarea')){if(e.key==='ArrowRight'){autoStop();applyScene(scene+1)}if(e.key==='ArrowLeft'){autoStop();applyScene(scene-1)}if(e.key===' '&&auto.on){e.preventDefault();autoPause()}}});
seed();if(MODE==='flow')applyScene(0);else renderAll();

</script>
