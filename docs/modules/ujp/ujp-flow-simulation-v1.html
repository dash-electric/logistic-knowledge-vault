<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UJP Flow Simulation</title>
<!-- Standalone interactive HTML in the react-logistic-web console shell. CR-1 (2026-09-15): saved/manual routes with pool legs, 10% km margin, Flazz/QRIS/Transfer buckets, fuel price master, subcon without shipment, client config page. Data contoh. Icons: inline SVG sprite (self-contained, no CDN). Keputusan: ujp-trd-v2.md §15. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ── react-logistic-web tokens (src/design-system/styles/tokens.css + src/index.css) ── */
:root{--em:#178c4e;--muted:#5c5c5c;--faint:#a3a3a3;--ink2:#5c5c5c;--am:#f6b51e;--rd:#fb3748;--sky:#47c2ff;
  --gray-0:#ffffff;--gray-50:#f7f7f7;--gray-100:#f5f5f5;--gray-200:#ebebeb;--gray-300:#d1d1d1;--gray-400:#a3a3a3;--gray-600:#5c5c5c;--gray-800:#262626;--gray-950:#171717;
  --alpha-4:#1717170a;--alpha-7:#17171712;--alpha-10:#1717171a;--alpha-22:#17171738;
  --bg-white-0:#ffffff;--bg-weak-50:#f7f7f7;--bg-soft-200:#ebebeb;--bg-sub-300:#d1d1d1;--bg-surface-800:#262626;--bg-strong-950:#171717;
  --text-strong-950:#171717;--text-sub-600:#5c5c5c;--text-soft-400:#a3a3a3;--text-disabled-300:#d1d1d1;--text-white-0:#ffffff;
  --icon-sub-600:#5c5c5c;--icon-soft-400:#a3a3a3;
  --stroke-soft-200:#1717171a;--stroke-sub-300:#17171738;--stroke-strong-950:#171717;
  --accent:#5e2aac;--accent-dark:#431e7a;--accent-a10:#5e2aac1a;--accent-a16:#5e2aac29;--accent-a24:#5e2aac3d;
  --err-dark:#681219;--err-base:#fb3748;--err-light:#ffc0c5;--err-lighter:#ffebec;--err-700:#d02533;--err-a10:#fb37481a;--err-a16:#fb374829;
  --warn-dark:#71330a;--warn-base:#fa7319;--warn-light:#ffd9c0;--warn-lighter:#fff3eb;
  --succ-dark:#0b4627;--succ-base:#1fc16b;--succ-light:#c2f5da;--succ-lighter:#e0faec;
  --info-dark:#122368;--info-base:#335cff;--info-light:#c0d5ff;--info-lighter:#ebf1ff;
  --feat-dark:#1b0c32;--feat-base:#5e2aac;--feat-light:#b59dd9;--feat-lighter:#efeaf7;
  --ver-dark:#124b68;--ver-base:#47c2ff;--ver-light:#c0eaff;--ver-lighter:#ebf8ff;
  --away-dark:#624c18;--away-base:#f6b51e;--away-light:#ffecc0;--away-lighter:#fffaeb;
  --r:2px;--r-gsm:4px;--r-gsm-md:6px;--r-full:9999px;
  --sh-xs:inset 0 0 0 1px #1717171a;--sh-md:0 2px 8px -4px #1717171a,0 0 0 1px #1717171a;--sh-lg:0 12px 32px -12px #1717171f,0 0 0 1px #1717171a;--sh-tip:0 6px 20px -8px #1717171f,0 0 0 1px #17171738;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --dur:150ms;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-weak-50);color:var(--text-strong-950);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss01","cv11","cv02";text-rendering:optimizeLegibility;color-scheme:light}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-strong-950)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
table,.tabular{font-variant-numeric:tabular-nums}
svg.lucide{width:1em;height:1em;flex:none}
.eyebrow{color:var(--text-sub-600);font-size:10px;line-height:1.4;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.eyebrow .num{color:var(--accent);font-weight:700;margin-right:12px}

/* ── simulation harness (not part of the console) ── */
.simbar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:6px 14px;background:var(--bg-strong-950);color:#e9e6f0;font-size:12px}
.simbar .t{font-weight:700;letter-spacing:-.01em}.simbar .t small{opacity:.55;font-weight:500;margin-left:6px}
.simbar label{opacity:.7}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;color:#cfcad9;padding:3px 10px;font-size:12px;font-weight:600}
.seg button.on{background:#e9e6f0;color:var(--bg-strong-950)}
.simbar select{background:#2a2733;color:#e9e6f0;border:1px solid rgba(255,255,255,.22);border-radius:var(--r);padding:3px 6px;font-size:12px}
.simbar .sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.simbar .sw input{accent-color:#b195ea}
.simbar .ghostb{background:transparent;border:1px solid rgba(255,255,255,.22);color:#e9e6f0;border-radius:var(--r);padding:3px 10px;font-size:12px}
.simbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}

/* ── stage: [rail] [shell] ── */
.stage{display:flex;min-height:calc(100vh - 34px)}
.rail{width:300px;flex:none;background:var(--bg-white-0);border-right:1px solid var(--stroke-soft-200);padding:16px 14px 24px;position:sticky;top:34px;align-self:flex-start;max-height:calc(100vh - 34px);overflow:auto}
@media (max-width:1100px){.stage{flex-direction:column}.rail{width:auto;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--stroke-soft-200)}}
.rail h2{margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:-.025em}
.rail .sub{color:var(--text-sub-600);font-size:12px;margin-bottom:12px;line-height:1.5}
.scenes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.scenes li button{width:100%;text-align:left;background:transparent;border:0;position:relative;padding:6px 10px 6px 14px;font-size:12.5px;color:var(--text-sub-600);border-radius:0 var(--r) var(--r) 0}
.scenes li button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.scenes li button:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.scenes li button.on{color:var(--text-strong-950);font-weight:600}.scenes li button.on::before{background:var(--accent)}
.scenes li button .n{font-family:var(--mono);font-size:10.5px;margin-right:8px;opacity:.6}
.cap{margin-top:14px;border-top:1px solid var(--stroke-soft-200);padding-top:12px}
.cap .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-sub-600);font-weight:700;margin-bottom:6px}
.cap p{margin:0 0 10px;color:var(--text-sub-600);font-size:12.5px;line-height:1.5}
.cap .dd{display:flex;flex-wrap:wrap;gap:4px}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}
.runbtn{width:100%;justify-content:center;margin-bottom:10px}
.runrow{display:flex;gap:8px;margin-bottom:10px}.runrow .btn{flex:1;justify-content:center}
.todo{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;color:var(--text-sub-600);align-items:start;line-height:1.45}
.todo li .m{width:16px;height:16px;border-radius:var(--r-full);border:1px solid var(--stroke-sub-300);display:grid;place-items:center;font-size:9px;margin-top:2px;font-family:var(--mono)}
.todo li.done .m{background:var(--succ-base);color:#fff;border-color:var(--succ-base)}
.todo li.cur{color:var(--text-strong-950);font-weight:600}.todo li.cur .m{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-a10)}

/* ── console shell (Layout.tsx + Sidebar.tsx) ── */
.shell{display:flex;flex:1;min-width:0;height:calc(100vh - 34px);overflow:hidden;background:var(--bg-weak-50)}
.sidenav{width:15rem;flex:none;height:100%;display:flex;flex-direction:column;background:var(--bg-white-0);border-right:1px solid var(--stroke-soft-200);transition:width .2s}
.shell[data-state=collapsed] .sidenav{width:4rem;overflow-x:hidden}
.sn-head{display:flex;align-items:center;gap:10px;height:4rem;border-bottom:1px solid var(--stroke-soft-200);padding:0 20px}
.shell[data-state=collapsed] .sn-head{flex-direction:column;justify-content:center;height:auto;padding:12px 0;gap:8px}
.sn-head svg.mark{height:20px;width:22.2px;flex:none}
.sn-brand{overflow:hidden;min-width:0}
.sn-brand .t{white-space:nowrap;font-size:17px;font-weight:800;letter-spacing:-.025em;line-height:1;color:var(--text-strong-950);margin:0}
.sn-brand .s{margin:4px 0 0;white-space:nowrap;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.3em;color:var(--text-sub-600);line-height:1}
.shell[data-state=collapsed] .sn-brand,.shell[data-state=collapsed] .sn-glabel,.shell[data-state=collapsed] .sn-item span,.shell[data-state=collapsed] .sn-user{display:none}
.sn-trigger{margin-left:auto;display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:var(--r-gsm);border:0;background:transparent;color:var(--icon-sub-600);font-size:18px}
.sn-trigger:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.shell[data-state=collapsed] .sn-trigger{margin-left:0}
.sn-content{flex:1;overflow-y:auto}
.sn-group{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--stroke-soft-200)}.sn-group:last-child{border-bottom:0}
.sn-glabel{padding:6px 20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--text-sub-600)}
.sn-item{position:relative;display:flex;height:36px;width:100%;align-items:center;gap:12px;padding:0 20px;font-size:14px;font-weight:500;letter-spacing:-.025em;color:var(--text-sub-600);text-decoration:none;background:transparent;border:0;text-align:left;transition:color var(--dur),background var(--dur)}
.sn-item svg{width:17px;height:17px;flex:none}
.sn-item:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.sn-item::before{content:"";pointer-events:none;position:absolute;inset:0 auto 0 0;width:3px;background:transparent}
.sn-item[data-active=true]{font-weight:600;color:var(--text-strong-950)}.sn-item[data-active=true]::before{background:var(--accent)}
.shell[data-state=collapsed] .sn-item{justify-content:center;padding:0}
.sn-foot{display:flex;align-items:center;gap:8px;height:auto;border-top:1px solid var(--stroke-soft-200);padding:12px}
.sn-userrow{display:flex;width:100%;align-items:center;gap:12px;padding:6px 8px;border-radius:var(--r);transition:background var(--dur)}.sn-userrow:hover{background:var(--bg-weak-50)}
.shell[data-state=collapsed] .sn-userrow{flex-direction:column;padding:0;gap:8px}
.sn-av{position:relative;flex:none;width:32px;height:32px;border-radius:var(--r-full);background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.sn-av i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:var(--r-full);background:var(--succ-base);border:2px solid var(--bg-white-0)}
.sn-user{flex:1;min-width:0}.sn-user .n{font-size:13px;font-weight:600;letter-spacing:-.025em;color:var(--text-strong-950);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;margin:0}
.sn-user .e{font-size:11px;color:var(--text-sub-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;margin:0}
.sn-out{padding:6px;border-radius:var(--r);border:0;background:transparent;color:var(--icon-soft-400);display:inline-flex;font-size:16px}.sn-out:hover{background:var(--err-lighter);color:var(--err-base)}
.inset{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.topbar{background:var(--bg-white-0);border-bottom:1px solid var(--stroke-soft-200);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar .eyebrow .dotm{color:var(--accent);font-weight:700;margin-right:12px}
.main{flex:1;overflow:auto;min-width:0}

/* ── page (shipments/index.tsx) ── */
.page{padding:24px;display:flex;flex-direction:column;gap:20px}
.hdr{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--stroke-soft-200);padding-bottom:20px}
@media (min-width:1024px){.hdr{flex-direction:row;align-items:flex-end;justify-content:space-between}}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1;color:var(--text-strong-950)}
.lede{margin:8px 0 0;max-width:42rem;font-size:14px;color:var(--text-sub-600);line-height:1.625}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{display:flex;flex-direction:column;background:var(--bg-white-0);color:var(--text-strong-950);border:1px solid var(--stroke-soft-200);border-radius:var(--r)}
.cardhead{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--stroke-soft-200);padding:4px 16px 12px}
@media (min-width:1024px){.cardhead{flex-direction:row;align-items:flex-end;justify-content:space-between;padding-bottom:0}}
.cardbody{padding:16px}
.tabs{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:40px}
.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14px;font-weight:500;height:40px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0 12px;color:var(--text-sub-600);transition:color var(--dur)}
.tabs button:hover{color:var(--text-strong-950)}
.tabs button.on{border-bottom-color:var(--stroke-strong-950);color:var(--text-strong-950)}
.tabs .cnt{border-radius:var(--r-full);padding:2px 6px;font-size:10px;font-weight:600;line-height:1;background:var(--bg-weak-50);color:var(--text-sub-600);font-variant-numeric:tabular-nums}
.tabs button.on .cnt{background:var(--bg-strong-950);color:var(--text-white-0)}
.filters{display:flex;flex:1;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (min-width:1024px){.filters{padding:8px 0}}
.filters .inp{height:32px;font-size:12px;border-radius:var(--r);padding:0 6px 0 8px}
.filters .hint{display:none}
.inp{display:flex;align-items:center;gap:8px;width:100%;height:36px;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0);padding:0 8px 0 10px;font-size:14px;transition:border-color var(--dur),box-shadow var(--dur)}
.inp:focus-within{border-color:var(--stroke-strong-950);box-shadow:0 0 0 2px var(--bg-white-0),0 0 0 4px var(--accent)}
.inp input,.inp select{border:0;outline:0;background:transparent;width:100%;min-width:0;height:100%;color:var(--text-strong-950)}
.inp input::placeholder{color:var(--text-soft-400)}
.inp .ad{color:var(--text-soft-400);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center}
.inp .ad svg{width:14px;height:14px}
.inp.locked{background:var(--bg-weak-50);border-style:dashed}
.inp.err{border-color:var(--err-base)}.inp.err:focus-within{box-shadow:0 0 0 2px var(--bg-white-0),0 0 0 4px rgba(251,55,72,.3)}
.inp .mono{text-align:right}
.inp input:disabled{cursor:not-allowed}
.inp:has(input:disabled){opacity:.5;background:var(--bg-weak-50)}
.tablewrap{overflow:hidden;border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0)}
.tablewrap>div{overflow-x:auto}
table{width:100%;border-collapse:collapse;caption-side:bottom;font-size:14px}
thead{background:var(--bg-weak-50)}thead tr{border-bottom:1px solid var(--stroke-soft-200)}
th{height:36px;padding:8px 12px;text-align:left;vertical-align:middle;font-size:11px;font-weight:500;color:var(--text-soft-400);white-space:nowrap;text-transform:none;letter-spacing:0}
tbody tr{border-bottom:1px solid var(--stroke-soft-200);transition:background var(--dur)}tbody tr:last-child{border-bottom:0}
td{padding:8px 12px;vertical-align:middle;font-size:12px;letter-spacing:-.025em;color:var(--text-strong-950);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td,tr.row.sel td{background:var(--bg-weak-50)}
td .sub{color:var(--text-sub-600);font-size:11px;letter-spacing:0}
.right{text-align:right}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:500;border-radius:var(--r-full);font-size:11px;line-height:12px;letter-spacing:.22px;padding:2px 8px;white-space:nowrap}
.b-am{background:var(--away-light);color:var(--away-dark)}.b-em{background:var(--succ-light);color:var(--succ-dark)}.b-rd{background:var(--err-light);color:var(--err-dark)}.b-ne{background:var(--bg-weak-50);color:var(--text-strong-950)}.b-sky{background:var(--ver-light);color:var(--ver-dark)}.b-ac{background:var(--feat-light);color:var(--feat-dark)}
.badge .dot{width:6px;height:6px;border-radius:var(--r-full);background:currentColor;display:inline-block;flex:none}
.pulse{position:relative}.pulse::after{content:"";position:absolute;inset:0;border-radius:var(--r-full);background:currentColor;opacity:.75;animation:ping 1s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse::after{animation:none}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 20px;color:var(--text-sub-600);border:1px solid var(--stroke-soft-200);border-radius:var(--r);background:var(--bg-white-0)}
.empty b{display:block;color:var(--text-strong-950);font-size:16px;font-weight:500;letter-spacing:-.025em}
.empty .eico{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;border-radius:var(--r-full);background:var(--bg-weak-50);color:var(--icon-sub-600);font-size:24px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;font-size:14px;color:var(--text-sub-600)}
.pinfo b{font-weight:500;color:var(--text-strong-950)}
.pbtns{display:flex;align-items:center;gap:4px}
.pbtn{display:inline-flex;height:32px;min-width:32px;align-items:center;justify-content:center;padding:0 8px;font-size:14px;font-weight:500;border-radius:var(--r);border:1px solid var(--stroke-soft-200);background:var(--bg-white-0);color:var(--text-sub-600);font-variant-numeric:tabular-nums}
.pbtn svg{width:16px;height:16px}
.pbtn:hover{border-color:transparent;background:var(--bg-weak-50);color:var(--text-strong-950)}
.pbtn:disabled{pointer-events:none;color:var(--text-disabled-300)}
.pbtn[data-active=true]{color:var(--text-strong-950)}
.psize{display:flex;align-items:center;gap:8px}

/* ── buttons (design-system/button.tsx) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 12px;font-size:14px;font-weight:500;border-radius:var(--r);border:1px solid transparent;background:var(--bg-strong-950);color:var(--text-white-0);white-space:nowrap;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease);user-select:none}
.btn svg{width:20px;height:20px}
.btn:hover{background:rgba(23,23,23,.9)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg-white-0),0 0 0 6px var(--accent-a10)}
.btn:disabled{cursor:not-allowed;pointer-events:none;background:var(--bg-weak-50);color:var(--text-disabled-300);border-color:transparent}
.btn.primary{background:var(--bg-strong-950);color:var(--text-white-0)}
.btn.stroke,.btn.white{background:var(--bg-white-0);border-color:var(--stroke-soft-200);color:var(--text-sub-600);box-shadow:0 1px 2px rgba(0,0,0,.05)}.btn.stroke:hover,.btn.white:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.btn.ghost{background:transparent;color:var(--text-sub-600)}.btn.ghost:hover{background:var(--bg-weak-50);color:var(--text-strong-950)}
.btn.od{background:var(--bg-white-0);border-color:var(--err-base);color:var(--err-base)}.btn.od:hover{background:var(--err-a10)}
.btn.danger{background:var(--err-base);color:#fff}.btn.danger:hover{background:var(--err-700)}
.btn.sm{height:32px;padding:0 10px}.btn.sm svg{width:16px;height:16px}
.btn.xs{height:28px;padding:0 10px;font-size:14px}.btn.xs svg{width:16px;height:16px}
.btn .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:var(--r-full);animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

function age(t){const h=Math.max(0,(NOW-t)/36e5);if(h<1)return{t:`${Math.max(1,Math.round(h*60))} mnt lalu`,d:0};if(h<24)return{t:`${Math.round(h)} jam lalu`,d:0};const d=Math.floor(h/24);return{t:`${d} hari lalu`,d}}
const ageBadge=t=>{const a=age(t);const c=a.d>5?'b-rd':a.d>2?'b-am':'b-ne';return `<span class="badge ${c}">${a.t}</span>`};
const isApprover=email=>APPROVERS.includes(email);
const uid=()=>'u'+Math.random().toString(36).slice(2,9);
const hav=(a,b)=>{const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const legKm=(a,b)=>Math.round(hav(a,b)*1.32*10)/10; // simulasi Distance Matrix
const priceFor=(fuel,date)=>{const rows=FUEL_PRICES.filter(r=>r.fuel===fuel&&r.from<=date).sort((a,b)=>b.from<a.from?-1:1);return rows[0]?.price??0};
function seqLegs(stops,km){const legs=[];for(let i=0;i<stops.length-1;i++)legs.push({seq:i+1,fromSeq:i+1,toSeq:i+2,km:(km&&km[i]!=null)?km[i]:legKm(stops[i],stops[i+1])});return legs}
function kmSplit(stops,legs){let all=0,charged=0;const pos=r=>r==='POSITIONING'||r==='RETURN';legs.forEach(l=>{const a=stops[l.fromSeq-1],b=stops[l.toSeq-1];all+=+l.km||0;if(a&&b&&!pos(a.role)&&!pos(b.role))charged+=+l.km||0});return{all:Math.round(all*10)/10,charged:Math.round(charged*10)/10}}
const cfgFor=(clientId)=>S.cfg[clientId]||{charged:false,reverse:0,defaultEMoney:'NONE',notes:'',by:null};

/* money formula v2 — mirrors UjpCostService (server). */
function calc(f){
  const cfg=cfgFor(f.clientId);const split=kmSplit(f.stops,f.legs);
  const km=+f.km||0, price=+f.price||0;
  const baseline=f.vehicleEnergy==='EV'?(f.konsumsi>0?1/f.konsumsi:0):(+f.baseline||0);
  const kmM=km*(1+KM_MARGIN_PCT/100);
  const liters=baseline>0?Math.round((kmM/baseline)*10)/10:0;
  const computed=Math.round(liters*price);
  const bbm=f.overrideBbm!=null?+f.overrideBbm:computed;
  const c=f.costs;const hasQ=f.eMoney==='QRIS'||f.eMoney==='FLAZZ_QRIS';const hasF=f.eMoney==='FLAZZ'||f.eMoney==='FLAZZ_QRIS';
  const manual=(+c.parkirManual||0)+(+c.bongkar||0)+(+c.lain||0)+(+c.makan||0);
  const tollTap=(+c.toll||0)+(+c.parkirTap||0);
  const rev=f.isReverse&&cfg.reverse>0?cfg.reverse:0;
  let F=0,Q=0,T=0;
  if(f.payee==='subcon'){T=+f.nominalTransfer||0}
  else{ if(hasQ)Q+=bbm;else if(hasF)F+=bbm;else T+=bbm; if(hasF)F+=tollTap;else T+=tollTap; T+=manual+rev }
  const complete=f.payee==='subcon'?(+f.nominalTransfer>0):(km>0&&baseline>0&&price>0);
  return {kmM,liters,computed,bbm,tollTap,manual,rev,F,Q,T,total:F+Q+T,complete,baseline,kmAll:split.all,kmCharged:split.charged,charged:cfg.charged,marginPct:KM_MARGIN_PCT,hasQ,hasF};
}

function mkShipment(u,st){const c=u.client;const cfg=cfgFor(u.form.clientId);const stops=cfg.charged?u.form.stops:u.form.stops.filter(s=>s.role!=='POSITIONING'&&s.role!=='RETURN');const sh={id:uid(),waybill:`DL${c.code}${ymd(new Date()).slice(2)}${rnd(7)}`,routeCode:`RTE${ymd(new Date())}${rnd(5,'0123456789')}`,ujpId:u.id,bookingId:u.ref,status:'CREATED',stops};(st||S).shipments.push(sh);return sh}

function defaultKm(f){const sp=kmSplit(f.stops,f.legs);if(!f.kmTouched)f.km=cfgFor(f.clientId).charged?sp.all:sp.charged}
function applyVehicle(f,v){if(!v)return;f.vehicleId=v.id;f.plate=v.plate;f.unitType=v.unit;f.vehicleEnergy=v.energy;f.fuel=v.fuel;if(v.energy==='EV'){f.konsumsi=v.konsumsi;f.baseline=0}else{f.baseline=v.baseline;f.konsumsi=0}f.price=priceFor(v.fuel,f.deliveryDate);f.baselineTouched=false;f.priceTouched=false}

function scheduleEstimate(){clearTimeout(estTimer);const f=S.ui.wizard;if(!f)return;const c=calc(f);if(!c.complete){est={status:'idle',lastGood:null,at:0};renderEstimate();return}

  $('#back2list').onclick=()=>{S.ui.view='list';S.ui.cfgEdit=null;renderAll()};

/* ───────────────────────── wizard ───────────────────────── */
function openWizard(prefill){S.ui.view='list';S.ui.wizard=Object.assign(blankForm(),prefill||{});S.ui.detailId=null;est={status:'idle'};renderAll()}

function fieldErr(k){const f=S.ui.wizard;return f.errors[k]?`<div class="ferr">${esc(f.errors[k])}</div>`:''}
function validate(step){const f=S.ui.wizard;const e={};
  if(step===1){if(!f.clientId)e.clientId='Pilih client';if(!f.deliveryDate||f.deliveryDate<iso(new Date()))e.deliveryDate='Tanggal kirim tidak boleh sebelum hari ini (WIB)'}
  if(step===2){if(f.stops.filter(s=>s.role==='PICKUP').length<1||f.stops.filter(s=>s.role==='DROP_OFF').length<1)e.stops='Butuh 1 Pickup dan minimal 1 Drop';if(f.stops.some(s=>!s.name||!s.addr))e.stops='Nama dan alamat stop wajib diisi';if(f.legs.some(l=>!(+l.km>0)))e.stops='Semua leg wajib punya km > 0';if(!(+f.km>0))e.km='KM diajukan wajib > 0';if(f.saveRoute&&!f.saveName.trim())e.saveName='Nama rute wajib diisi';if(f.saveRoute&&S.routes.some(r=>r.clientId===f.clientId&&r.name.trim().toLowerCase()===f.saveName.trim().toLowerCase()))e.saveName='Nama rute sudah ada untuk client ini'}
  if(step===3){if(!f.plate)e.plate='Pilih atau isi plat nomor';if(f.payee==='driver'){const c=calc(f);if(!(c.baseline>0))e.baseline='Baseline wajib > 0';if(!(+f.price>0))e.price='Harga energi wajib > 0';if(+f.costs.lain>0&&!f.justif.trim())e.justif='Wajib diisi bila biaya lain-lain > 0'}else{if(!f.vendorId)e.vendor='Pilih vendor subcon';if(!(+f.nominalTransfer>0))e.nominalTransfer='Nominal transfer wajib > 0'}}
  if(step===4){if(f.payee==='driver'&&!f.riderId)e.rider='Pilih driver';if(!f.bank.name||!f.bank.acct||!f.bank.holder)e.bank='Bank, nomor rekening dan atas nama wajib diisi'}
  f.errors=e;return !Object.keys(e).length}
function renderWizard(){const f=S.ui.wizard;if(!f)return '';const step=f.step;
  const stepsHtml=`<div class="steps" aria-label="Langkah">${STEPS.map((s,i)=>`<div class="step ${step>i+1?'done':step===i+1?'cur':''}" ${step===i+1?'aria-current="step"':''}><span class="n">${step>i+1?'<i data-lucide="check"></i>':i+1}</span>${s}</div>${i<STEPS.length-1?'<i class="conn" data-lucide="chevron-right"></i>':''}`).join('')}</div>
  <div class="steps compact">Langkah ${step}/5 · ${STEPS[step-1]}<div class="bar"><i style="width:${step*20}%"></i></div></div>`;
  let body='';if(step===1)body=renderInfo(f);else if(step===2)body=renderRute(f);else if(step===3)body=renderBiaya(f);else if(step===4)body=renderDriver(f);else body=renderReview(f);
  return `<div class="ov" id="wizov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="wzt">
   <div class="mh"><div class="ic"><i data-lucide="plus"></i></div><div><h3 id="wzt">Buat Pengajuan UJP</h3><p>Uang jalan 4W: info, rute, biaya, driver, lalu review.</p></div><div class="ref mono" title="Nomor final ditetapkan server saat diajukan">UJP-${ymd(new Date())}-····</div><button type="button" class="x" id="wzx" aria-label="Tutup"><i data-lucide="x"></i></button></div>
   <div class="mb" id="wzb">${stepsHtml}${body}</div><div class="mf" id="wzf">${renderFooter()}</div></div></div>`}
function renderFooter(){const f=S.ui.wizard;const step=f.step;const showStrip=step===2||step===4;
  return `${step>1?`<button type="button" class="btn ghost" id="back"><i data-lucide="arrow-left"></i>Kembali</button>`:''}${showStrip?`<div class="est" id="strip" aria-live="polite">${stripHtml()}</div>`:''}<div class="grow"><button type="button" class="btn stroke" id="cancel">Batal</button>${step<5?`<button type="button" class="btn primary" id="next">Lanjut<i data-lucide="arrow-right"></i></button>`:`<button type="button" class="btn primary" id="submit" ${!est.lastGood||est.status==='error'||S.ui.busy==='submit'?'disabled':''}>${S.ui.busy==='submit'?'<span class="spin"></span> Mengajukan…':'Ajukan UJP'}</button>`}</div>`}
function chipsHtml(g){return `${(!g.hasQ||g.F>0)?`<span class="badge b-em">Flazz ${fmtN(g.F)}</span>`:''}${g.hasQ?`<span class="badge b-sky">QRIS ${fmtN(g.Q)}</span>`:''}<span class="badge b-ac">Transfer ${fmtN(g.T)}</span>`}
function stripHtml(){const g=est.lastGood;const lbl=`<span class="eyebrow" style="margin:0">Estimasi total</span>`;
  if(!g)return `${lbl}<span class="amt mono dim">—</span>${est.status==='pending'?'<span class="spin2" aria-label="menghitung"></span>':'<span class="hint" style="margin:0">lengkapi biaya di langkah Biaya</span>'}`;
  const stale=est.status!=='ok';return `${lbl}<span class="amt mono ${stale?'dim':''}">${fmtRp(g.total)}</span>${est.status==='error'?`<span class="badge b-rd">Estimasi gagal</span><button type="button" class="btn ghost xs" id="retry">Coba lagi</button>`:stale?`<span class="badge b-am">Estimasi belum diperbarui</span>`:chipsHtml(g)}`}
function renderEstimate(){const s=$('#strip');if(s)s.innerHTML=stripHtml();const b=$('#breakdown');if(b)b.innerHTML=breakdownHtml();const rt=$('#retry');if(rt)rt.onclick=()=>{S.sim.fail=false;renderSim();fireEstimate()};const sub=$('#submit');if(sub){sub.disabled=!est.lastGood||est.status==='error'||S.ui.busy==='submit'}const rv=$('#rvtiles');if(rv)rv.innerHTML=tilesHtml(est.lastGood,true)}
function breakdownHtml(){const f=S.ui.wizard;const g=est.lastGood;const c=calc(f);const pend=est.status==='pending'||est.status==='stale';

function tilesHtml(r,big){if(!r)return '<div class="hint">Estimasi belum tersedia.</div>';const showQ=r.hasQ||r.Q>0;return `<div class="tiles" style="grid-template-columns:repeat(${showQ?3:2},1fr)"><div class="tile"><div class="l" style="color:var(--em)"><span class="dot" style="background:var(--em)"></span>Uang jalan Flazz</div><div class="a mono">${fmtRp(r.F)}</div><div class="hint">${r.hasQ?'toll + parkir tap':'BBM + toll + parkir tap'}</div></div>${showQ?`<div class="tile"><div class="l" style="color:var(--sky)"><span class="dot" style="background:var(--sky)"></span>Uang jalan QRIS</div><div class="a mono">${fmtRp(r.Q)}</div><div class="hint">BBM di SPBU</div></div>`:''}<div class="tile"><div class="l" style="color:var(--accent)"><span class="dot" style="background:var(--accent)"></span>Uang jalan Transfer</div><div class="a mono">${fmtRp(r.T)}</div><div class="hint">manual${r.rev?' + reverse':''}</div></div></div>${big?`<div class="total"><span class="eyebrow" style="margin:0">Estimasi total uang jalan</span><span class="a mono">${fmtRp(r.total)}</span></div>`:''}`}
const money=(id,val,opts={})=>`<div class="inp ${opts.locked?'locked':''} ${opts.err?'err':''}"><span class="ad">Rp</span><input class="mono" inputmode="numeric" id="${id}" value="${fmtN(val)}" placeholder="0" aria-label="${opts.label||id}" ${opts.disabled?'disabled':''}></div>`;

  </div></div></div>`}
function renderRute(f){const client=CLIENTS.find(c=>c.id===f.clientId);const saved=S.routes.filter(r=>r.clientId===f.clientId&&r.active&&(!f.routeQuery||r.name.toLowerCase().includes(f.routeQuery.toLowerCase())));const cur=S.routes.find(r=>r.id===f.routeId);const sp=kmSplit(f.stops,f.legs);const cfg=cfgFor(f.clientId);
  const rows=f.stops.map((s,i)=>{const leg=f.legs[i-1];return `<div class="rb-row" data-i="${i}"><span class="n">${i+1}</span>
    <div class="segc sm" role="group" aria-label="Peran stop ${i+1}">${Object.entries(ROLE).map(([k,v])=>`<button type="button" data-role="${i}:${k}" class="${s.role===k?'on':''}">${v.l}</button>`).join('')}</div>
    <div class="inp"><input data-sn="${i}" value="${esc(s.name)}" placeholder="mis. Gudang Karawang" aria-label="Nama stop ${i+1}" list="places"></div>
    <div class="inp"><input data-sa="${i}" value="${esc(s.addr)}" placeholder="Alamat (place picker)" aria-label="Alamat stop ${i+1}"></div>

    <div class="rb-act"><button type="button" class="btn ghost xs" data-up="${i}" ${i===0?'disabled':''} aria-label="Naik"><i data-lucide="chevron-up"></i></button><button type="button" class="btn ghost xs" data-dn="${i}" ${i===f.stops.length-1?'disabled':''} aria-label="Turun"><i data-lucide="chevron-down"></i></button><button type="button" class="btn ghost xs" data-rm="${i}" aria-label="Hapus"><i data-lucide="x"></i></button></div></div>`}).join('');
  return `<div class="sec"><div class="sh">Rute <span class="segc sm" role="group" aria-label="Mode rute"><button type="button" data-rm-mode="saved" class="${f.routeMode==='saved'?'on':''}">Rute tersimpan</button><button type="button" data-rm-mode="manual" class="${f.routeMode==='manual'?'on':''}">Buat rute manual</button></span></div><div class="sb">

   ${f.stops.length?`<div class="rb"><div class="rb-h"><span></span><span class="h">Peran</span><span class="h">Nama tempat</span><span class="h">Alamat</span><span class="h">KM leg</span><span></span></div>${rows}</div>

   ${fieldErr('stops')}

   <div class="f">${lab('KM ditagih')}<div class="inp locked"><span class="mono" style="width:100%;text-align:right">${f.stops.length?fmtKm(sp.charged):'—'}</span><span class="ad">km</span></div><div class="hint">Tanpa leg yang menyentuh Pool / Kembali ke pool.</div></div>
   <div class="f">${lab('KM diajukan',1,f.clientId?'<span class="tag">'+(cfg.charged?'default semua leg':'default km ditagih')+'</span>':'')}<div class="inp ${f.errors.km?'err':''}"><input class="mono" inputmode="decimal" id="km" value="${f.km?fmtKm(f.km):''}" placeholder="0,0" style="text-align:right"><span class="ad">km</span></div>${fieldErr('km')}<div class="hint">Dipakai untuk BBM (× margin ${KM_MARGIN_PCT}%). Sesuaikan bila perlu.</div></div>

function mapSvg(stops){if(!stops.length)return '';const xs=stops.map(s=>s.lng),ys=stops.map(s=>s.lat);const mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys);const px=v=>40+((Mx-mx?(v-mx)/(Mx-mx):.5))*(600-80);const py=v=>25+(1-((My-my?(v-my)/(My-my):.5)))*(150-50);const col=r=>r==='PICKUP'?'#1fc16b':r==='DROP_OFF'?'#5E2AAC':'#5c5c5c';
  return `<svg viewBox="0 0 600 150"><polyline fill="none" stroke="#5E2AAC" stroke-width="2" stroke-dasharray="4 4" points="${stops.map(s=>`${px(s.lng)},${py(s.lat)}`).join(' ')}"/>${stops.map((s,i)=>`<g><circle cx="${px(s.lng)}" cy="${py(s.lat)}" r="9" fill="${col(s.role)}"/><text x="${px(s.lng)}" y="${py(s.lat)+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="JetBrains Mono,monospace">${i+1}</text><text x="${px(s.lng)}" y="${py(s.lat)+24}" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Plus Jakarta Sans,sans-serif">${esc(s.name)}</text></g>`).join('')}</svg>`}

   ${f.overrideBbm!=null?`<div class="f">${lab('Total BBM tetap',1)}${money('ovrv',f.overrideBbm,{disabled:sub,label:'Total BBM tetap'})}</div>`:''}

  </div>${!sub&&+f.costs.lain>0?`<div class="f" style="margin-top:12px">${lab('Justifikasi biaya lain-lain',1)}<div class="inp ${f.errors.justif?'err':''}"><input id="just" value="${esc(f.justif)}" placeholder="mis. tambat pelabuhan"></div>${fieldErr('justif')}</div>`:''}</div></div>
  <div class="sec tint" id="breakdown">${breakdownHtml()}</div>`}

function renderReview(f){const c=CLIENTS.find(x=>x.id===f.clientId);const r=RIDERS.find(x=>x.id===f.riderId);const v=VENDORS.find(x=>x.id===f.vendorId);const g=est.lastGood;const ok=k=>`<span class="badge b-em">✓ ${k}</span>`;const cfg=cfgFor(f.clientId);const sp=kmSplit(f.stops,f.legs);

  ${row('Biaya',3,`<div class="kv"><span class="k">Payee</span><span class="v">${f.payee==='subcon'?`Subcon · ${esc(v?.name||'—')}`:'Driver internal'} · <span class="mono">${esc(f.plate)}</span> ${esc(f.unitType)}</span>${f.payee==='subcon'?`<span class="k">Nominal transfer</span><span class="v mono">${fmtRp(f.nominalTransfer)}</span>`:`<span class="k">${f.vehicleEnergy==='EV'?'Energi':'BBM'}<small>${g?fmtKm(g.liters):'—'} ${f.vehicleEnergy==='EV'?'kWh':'L'} × ${fmtRp(f.price)} ${FUEL_LABEL[f.fuel]||''}${f.overrideBbm!=null?' · override':''}</small></span><span class="v mono">${g?fmtRp(g.bbm):'—'}</span><span class="k">Toll · parkir tap</span><span class="v mono">${fmtRp(f.costs.toll)} · ${fmtRp(f.costs.parkirTap)}</span><span class="k">Parkir manual · bongkar muat</span><span class="v mono">${fmtRp(f.costs.parkirManual)} · ${fmtRp(f.costs.bongkar)}</span><span class="k">Uang makan · lain-lain${f.justif?`<small>${esc(f.justif)}</small>`:''}</span><span class="v mono">${fmtRp(f.costs.makan)} · ${fmtRp(f.costs.lain)}</span>${g&&g.rev?`<span class="k">Biaya reverse (client)</span><span class="v mono">${fmtRp(g.rev)}</span>`:''}<span class="k">E-money</span><span class="v">${EMONEY.find(x=>x[0]===f.eMoney)?.[1]}</span>`}</div><div id="rvtiles">${tilesHtml(g,true)}</div>${est.status==='pending'||est.status==='stale'?'<div class="hint">Memastikan estimasi terbaru dari server…</div>':est.status==='error'?'<div class="ferr">Estimasi gagal; Ajukan dinonaktifkan sampai server menjawab.</div>':''}`)}

function bindWizard(){const f=S.ui.wizard;if(!f)return;const step=f.step;const refocus=sel=>{const el=document.querySelector(sel);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}};
  $('#wzx').onclick=closeWizard;$('#cancel').onclick=closeWizard;const bk=$('#back');if(bk)bk.onclick=()=>{f.step--;renderAll()};
  const nx=$('#next');if(nx)nx.onclick=()=>{if(validate(step)){f.step++;f.errors={};renderAll();if(f.step===3)scheduleEstimate();if(f.step===5)fireEstimate()}else{renderAll();const first=document.querySelector('#wzb .err input,#wzb .err select,#wzb .ferr');if(first)first.scrollIntoView({block:'center'})}};
  const sb=$('#submit');if(sb)sb.onclick=submitUjp;const rt=$('#retry');if(rt)rt.onclick=()=>{S.sim.fail=false;renderSim();fireEstimate()};
  document.querySelectorAll('#wzb [data-go]').forEach(b=>b.onclick=()=>{f.step=+b.dataset.go;renderAll()});
  const gc=$('#gocfg2');if(gc)gc.onclick=()=>{S.ui.wizard=null;S.ui.view='config';renderAll()};
  if(step===1){$('#cl').onchange=e=>{f.clientId=+e.target.value||null;f.routeId=null;f.stops=[];f.legs=[];f.kmTouched=false;f.km=0;f.eMoney=cfgFor(f.clientId).defaultEMoney||'NONE';renderAll()};$('#dd').onchange=e=>{f.deliveryDate=e.target.value;if(f.vehicleId&&!f.priceTouched)f.price=priceFor(f.fuel,f.deliveryDate)};$('#ot').onchange=e=>{f.opsTeam=e.target.value};$('#sv').onchange=e=>{f.serviceType=e.target.value};$('#sh').onchange=e=>{f.shift=e.target.value};$('#jm').onchange=e=>{f.jamMulai=e.target.value};$('#js').onchange=e=>{f.jamSelesai=e.target.value};$('#rev').onchange=e=>{f.isReverse=e.target.checked;renderAll()}}
  if(step===2){document.querySelectorAll('[data-rm-mode]').forEach(b=>b.onclick=()=>{f.routeMode=b.dataset.rmMode;if(f.routeMode==='manual'){f.routeId=null;if(!f.stops.length){f.stops=[{seq:1,role:'PICKUP',name:'',addr:'',lat:-6.3,lng:107.3},{seq:2,role:'DROP_OFF',name:'',addr:'',lat:-6.35,lng:107.1}];f.legs=seqLegs(f.stops,[0])}}renderAll()});
    const rq=$('#rq');if(rq){rq.oninput=e=>{f.routeQuery=e.target.value;f.routeOpen=true;renderAll();refocus('#rq')};rq.onfocus=()=>{if(!f.routeOpen){f.routeOpen=true;renderAll();refocus('#rq')}}}
    document.querySelectorAll('[data-route]').forEach(o=>o.onclick=()=>{f.kmTouched=false;applyRoute(f,S.routes.find(r=>r.id===o.dataset.route));f.routeQuery='';f.routeOpen=false;renderAll()});
    const rc2=$('#rclear2');if(rc2)rc2.onclick=()=>{f.routeId=null;f.stops=[];f.legs=[];f.km=0;renderAll()};
    const toManual=()=>{if(f.routeMode==='saved'){f.routeMode='manual';f.routeId=null}};
    document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.role.split(':');f.stops[+i].role=k;toManual();if(k==='RETURN'&&cfgFor(f.clientId).reverse>0)f.isReverse=true;defaultKm(f);renderAll()});
    const edit=(i,key,val)=>{f.stops[i][key]=val;toManual();if(key==='name'){const p=Object.values(PLACES).find(p=>p.name.toLowerCase()===val.trim().toLowerCase());if(p){Object.assign(f.stops[i],{addr:p.addr,lat:p.lat,lng:p.lng});f.legs=seqLegs(f.stops,f.legs.map((l,j)=>(j===i-1||j===i)?null:l.km));defaultKm(f);renderAll();refocus(`[data-sn="${i}"]`)}}};
    document.querySelectorAll('[data-sn]').forEach(el=>el.oninput=e=>edit(+el.dataset.sn,'name',e.target.value));document.querySelectorAll('[data-sa]').forEach(el=>el.oninput=e=>edit(+el.dataset.sa,'addr',e.target.value));
    document.querySelectorAll('[data-lk]').forEach(el=>{el.oninput=e=>{const v=parseFloat(e.target.value.replace(/\./g,'').replace(',','.'));f.legs[+el.dataset.lk].km=isNaN(v)?0:Math.round(v*10)/10;toManual();defaultKm(f)};el.onblur=()=>renderAll();el.onkeydown=e=>{if(e.key==='Enter')e.preventDefault()}});
    document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[f.stops[i-1],f.stops[i]]=[f.stops[i],f.stops[i-1]];toManual();resequence(f);renderAll()});
    document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[f.stops[i+1],f.stops[i]]=[f.stops[i],f.stops[i+1]];toManual();resequence(f);renderAll()});
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{f.stops.splice(+b.dataset.rm,1);toManual();resequence(f);renderAll()});
    const add=$('#addstop');if(add)add.onclick=()=>{const last=f.stops.at(-1);f.stops.push({seq:f.stops.length+1,role:'DROP_OFF',name:'',addr:'',lat:(last?.lat||-6.3)-0.03,lng:(last?.lng||107.2)-0.08});toManual();f.legs=seqLegs(f.stops,[...f.legs.map(l=>l.km),null]);defaultKm(f);renderAll();refocus(`[data-sn="${f.stops.length-1}"]`)};
    const sv=$('#save');if(sv)sv.onchange=e=>{f.saveRoute=e.target.checked;if(f.saveRoute&&!f.saveName){f.saveName=f.stops.map(s=>s.name.split(' ')[0]).filter(Boolean).join(' → ')}renderAll();refocus('#savename')};const sn=$('#savename');if(sn)sn.oninput=e=>{f.saveName=e.target.value};
    const km=$('#km');km.oninput=e=>{const v=parseFloat(e.target.value.replace(/\./g,'').replace(',','.'));f.km=isNaN(v)?0:Math.round(v*10)/10;f.kmTouched=true};km.onblur=()=>{km.value=f.km?fmtKm(f.km):'';scheduleEstimate()};km.onkeydown=e=>{if(e.key==='Enter')e.preventDefault()}}
  if(step===3){document.querySelectorAll('[data-py]').forEach(b=>b.onclick=()=>{f.payee=b.dataset.py;if(f.payee==='driver'){const r=RIDERS.find(x=>x.id===f.riderId);f.bank=r?{...r.bank}:{name:'',acct:'',holder:''}}else{const v=VENDORS.find(x=>x.id===f.vendorId);f.bank=v?{...v.bank}:{name:'',acct:'',holder:''}}renderAll();scheduleEstimate()});
    const vq=$('#vq');if(vq){vq.oninput=e=>{f.vendorQuery=e.target.value;f.vendorId=null;renderAll();refocus('#vq')}}document.querySelectorAll('[data-vend]').forEach(o=>o.onclick=()=>{applyVendor(f,VENDORS.find(v=>v.id===o.dataset.vend));renderAll()});
    const pl=$('#plate');pl.oninput=e=>{f.plate=e.target.value;f.vehicleId=null;f.plateOpen=true;renderAll();refocus('#plate')};pl.onfocus=()=>{if(!f.plateOpen&&!f.vehicleId&&f.payee==='driver'){f.plateOpen=true;renderAll();refocus('#plate')}};
    document.querySelectorAll('[data-v]').forEach(o=>o.onclick=()=>{applyVehicle(f,VEHICLES.find(v=>v.id===o.dataset.v));f.plateOpen=false;renderAll();scheduleEstimate()});

let scene=0;
const auto={on:false,paused:false,k:0,i:0,t:null,done:false};
const ACT_MS=2600, SCENE_GAP_MS=1100;
function applyScene(i){scene=Math.max(0,Math.min(SCENES.length-1,i));seed();est={status:'idle'};for(let k=0;k<=scene;k++)SCENES[k].run(S);if(S.ui.wizard)estimateNow();renderAll()}
function highlight(sel){document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));if(!sel)return;const el=document.querySelector(sel);if(el){el.classList.add('hl');try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}}}
function autoStart(){clearTimeout(auto.t);Object.assign(auto,{on:true,paused:false,k:0,i:0,done:false});applyScene(0);autoTick()}
function autoTick(){if(!auto.on||auto.paused)return;const sc=SCENES[auto.k];const acts=sc.do||[];
  if(auto.i<acts.length){renderNarr();renderRail();highlight(acts[auto.i].hl);auto.t=setTimeout(()=>{auto.i++;autoTick()},ACT_MS)}
  else{auto.t=setTimeout(()=>{if(auto.k<SCENES.length-1){auto.k++;auto.i=0;applyScene(auto.k);autoTick()}else{auto.on=false;auto.done=true;highlight(null);renderNarr();renderRail()}},SCENE_GAP_MS)}}
function autoPause(){if(!auto.on)return;auto.paused=!auto.paused;clearTimeout(auto.t);if(!auto.paused)autoTick();else{renderNarr();renderRail()}}
function autoStop(){clearTimeout(auto.t);auto.on=false;auto.paused=false;auto.done=false;highlight(null);renderNarr();renderRail()}
function renderNarr(){const n=$('#narr');if(!n)return;if(!auto.on&&!auto.done){n.hidden=true;return}n.hidden=false;
  if(auto.done){n.innerHTML=`<div><div class="k">Selesai · ${SCENES.length} adegan</div><div class="a">Alur lengkap: rute tersimpan & manual, biaya tiga instrumen, subcon tanpa shipment, aturan client, persetujuan. Layar sekarang bebas dicoba.</div></div><div class="ctl"><button type="button" class="pri" id="nAgain">↻ Ulangi alur</button><button type="button" id="nClose">Tutup</button></div>`;$('#nAgain').onclick=autoStart;$('#nClose').onclick=autoStop;return}
  const sc=SCENES[auto.k];const acts=sc.do||[];const a=acts[Math.min(auto.i,acts.length-1)];
  n.innerHTML=`<div><div class="k">Adegan ${auto.k+1}/${SCENES.length} · ${esc(sc.t)}${auto.paused?' · jeda':''}</div><div class="a">${esc(a?.t||'')}</div><div class="dots" aria-hidden="true">${acts.map((_,j)=>`<i class="${j<auto.i?'done':j===auto.i?'on':''}"></i>`).join('')}</div></div><div class="ctl"><button type="button" class="pri" id="nPause">${auto.paused?'▶ Lanjutkan':'⏸ Jeda'}</button><button type="button" id="nStop">■ Berhenti</button></div>`;
  $('#nPause').onclick=autoPause;$('#nStop').onclick=autoStop}
function renderRail(){if(MODE!=='flow'){$('#rail').hidden=true;document.body.classList.remove('flowmode');return}$('#rail').hidden=false;document.body.classList.add('flowmode');const sc=SCENES[scene];const acts=sc.do||[];const running=auto.on;
  $('#rail').innerHTML=`<h2>Alur Buat UJP · CR-1</h2><div class="sub">Satu klik menjalankan seluruh alur: rute tersimpan & manual, biaya tiga instrumen, subcon, aturan client, persetujuan menjadi shipment.</div>
  ${running?`<div class="runrow"><button type="button" class="btn primary" id="rPause">${auto.paused?'▶ Lanjutkan':'⏸ Jeda'}</button><button type="button" class="btn stroke" id="rStop">■ Berhenti</button></div>`:`<button type="button" class="btn primary runbtn" id="run">▶ Jalankan alur (1 klik)</button>`}
  <ol class="scenes">${SCENES.map((s,i)=>`<li><button type="button" class="${i===scene?'on':''}" data-s="${i}"><span class="n">${pad(i+1,2)}</span>${s.t}</button></li>`).join('')}</ol>
  <div class="cap"><div class="k">Yang dilakukan</div><ol class="todo">${acts.map((a,j)=>{const st=running&&auto.k===scene?(j<auto.i?'done':j===auto.i?'cur':''):'';return `<li class="${st}"><span class="m">${st==='done'?'✓':j+1}</span><span>${esc(a.t)}</span></li>`}).join('')}</ol>
   <div class="k" style="margin-top:14px">Mengapa begini</div><p>${sc.c}</p><div class="dd">${sc.dd.map(d=>`<span class="badge b-ne mono" style="font-size:10px">${d}</span>`).join('')}</div></div>
  <div class="nav"><button type="button" class="btn stroke" id="prev" ${scene===0?'disabled':''}><i data-lucide="chevron-left"></i>Sebelumnya</button><button type="button" class="btn ${running?'stroke':'primary'}" id="nxt" ${scene===SCENES.length-1?'disabled':''}>Berikutnya<i data-lucide="chevron-right"></i></button></div>
  <div class="hint" style="margin-top:12px">Panah ← → di keyboard juga berfungsi. Setiap adegan tetap bisa dicoba langsung.</div>`;
  const run=$('#run');if(run)run.onclick=autoStart;const rp=$('#rPause');if(rp)rp.onclick=autoPause;const rs=$('#rStop');if(rs)rs.onclick=autoStop;
  $('#rail').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{autoStop();applyScene(+b.dataset.s)});$('#prev').onclick=()=>{autoStop();applyScene(scene-1)};$('#nxt').onclick=()=>{autoStop();applyScene(scene+1)};icons()}
