<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UJP Flow Simulation</title>
<!-- Standalone interactive HTML. Satu klik menjalankan 12 adegan dengan narasi. Data contoh. Keputusan: ujp-prd-trd-v2.md. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{--paper:#fff;--page:#f6f5f8;--ink:#171717;--ink2:#374151;--muted:#6b7280;--faint:#9ca3af;--rule:rgba(23,23,23,.10);--rule2:rgba(23,23,23,.22);--tint:rgba(23,23,23,.04);--tint2:rgba(23,23,23,.07);--locked:#f2eff7;--accent:#5E2AAC;--accent10:rgba(94,42,172,.10);--em:#047857;--em10:#ecfdf5;--am:#b45309;--am10:#fffbeb;--rd:#b91c1c;--rd10:#fef2f2;--sky:#0369a1;--sky10:#f0f9ff;--shadow:0 1px 2px rgba(23,23,23,.05),0 12px 32px -12px rgba(23,23,23,.18)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px;line-height:1.45;color-scheme:light}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
.sr{position:absolute;left:-9999px}
/* sim bar */
.simbar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 16px;background:#1d1b24;color:#e9e6f0;font-size:12px}
.simbar .t{font-weight:700;letter-spacing:-.01em}.simbar .t small{opacity:.6;font-weight:500;margin-left:6px}
.simbar label{opacity:.75}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;color:#cfcad9;padding:4px 10px;font-size:12px;font-weight:600}
.seg button.on{background:#e9e6f0;color:#1d1b24}
.simbar select{background:#2a2733;color:#e9e6f0;border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:3px 6px;font-size:12px}
.simbar .sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.simbar .sw input{accent-color:#b195ea}
.simbar .ghostb{background:transparent;border:1px solid rgba(255,255,255,.22);color:#e9e6f0;border-radius:4px;padding:4px 10px;font-size:12px}
.simbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}
/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 40px)}
.shell.flow{grid-template-columns:320px minmax(0,1fr)}
@media (max-width:900px){.shell.flow{grid-template-columns:1fr}}
.rail{background:var(--paper);border-right:1px solid var(--rule);padding:18px 16px 24px;position:sticky;top:40px;align-self:start;max-height:calc(100vh - 40px);overflow:auto}
.rail h2{margin:0 0 4px;font-size:16px;letter-spacing:-.02em}
.rail .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.scenes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.scenes li button{width:100%;text-align:left;background:transparent;border:0;border-left:2px solid var(--rule);padding:6px 10px;font-size:12.5px;color:var(--muted);border-radius:0 4px 4px 0}
.scenes li button.on{border-left-color:var(--accent);color:var(--ink);font-weight:600;background:var(--accent10)}
.scenes li button .n{font-family:"JetBrains Mono",monospace;font-size:10.5px;margin-right:8px;opacity:.7}
.cap{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
.cap .k{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.cap p{margin:0 0 10px;color:var(--ink2);font-size:13px}
.cap .dd{display:flex;flex-wrap:wrap;gap:4px}
.nav{display:flex;gap:8px;margin-top:14px}
.nav button{flex:1}
/* page */
.page{padding:22px 24px 80px;min-width:0}
.hdr{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:16px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eyebrow .num{color:var(--accent);margin-right:10px}
h1{margin:6px 0 4px;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.lede{color:var(--muted);font-size:13px;margin:0}
.tabs{display:flex;flex-wrap:wrap;margin-bottom:-1px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;letter-spacing:-.01em}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink)}
.tabs .cnt{font-family:"JetBrains Mono",monospace;font-size:10px;padding:1px 6px;border-radius:2px;background:var(--tint2);color:var(--ink2)}
.tabs button.on .cnt{background:var(--ink);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.inp{display:flex;align-items:center;gap:8px;height:34px;border:1px solid #d1d5db;border-radius:4px;background:#fff;padding:0 10px;font-size:13px}
.inp:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.inp input,.inp select{border:0;outline:0;background:transparent;width:100%;min-width:0;height:100%}
.inp .ad{color:var(--muted);font-size:12px;white-space:nowrap}
.inp.locked{background:var(--locked);border-color:var(--rule)}
.inp.err{border-color:var(--rd)}
.inp .mono{text-align:right}
table{width:100%;border-collapse:collapse}
th{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--rule2);font-weight:600}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:var(--tint)}tr.row.sel td{background:var(--accent10)}
td .sub{color:var(--muted);font-size:11.5px}
.right{text-align:right}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.b-am{background:var(--am10);color:var(--am)}.b-em{background:var(--em10);color:var(--em)}.b-rd{background:var(--rd10);color:var(--rd)}.b-ne{background:var(--tint);color:var(--ink2)}.b-sky{background:var(--sky10);color:var(--sky)}.b-ac{background:var(--accent10);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:999px;background:currentColor;display:inline-block}
.pulse{animation:p 1.6s ease-out infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(180,83,9,.35)}100%{box-shadow:0 0 0 6px rgba(180,83,9,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:var(--muted);font-size:12px}
.btn{height:34px;padding:0 14px;border-radius:4px;border:1px solid var(--rule2);background:#fff;font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;color:var(--ink2)}.btn.ghost:hover{background:var(--tint)}
.btn.od{border-color:#fca5a5;color:var(--rd)}.btn.danger{background:var(--rd);border-color:var(--rd);color:#fff}
.btn.xs{height:24px;padding:0 8px;font-size:11px}
.btn .spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:999px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(23,23,23,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:50;overflow:auto}
.modal{width:100%;max-width:760px;background:#fff;border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 64px)}
.modal.sm{max-width:440px}
.mh{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule)}
.mh .ic{width:32px;height:32px;border-radius:4px;background:var(--accent10);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.mh .ic.dn{background:var(--rd10);color:var(--rd)}
.mh h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}.mh p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.mh .ref{margin-left:auto;font-size:12px;color:var(--ink2)}
.mh .x{margin-left:8px;background:transparent;border:0;font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:4px}
.mb{padding:18px 20px;overflow:auto;flex:1}
.mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.mf .est{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mf .est .amt{font-weight:700;font-size:15px}
.mf .est .amt.dim{color:var(--faint)}
.mf .grow{margin-left:auto;display:flex;gap:8px}
@media (max-width:640px){.mf{flex-direction:column-reverse;align-items:stretch}.mf .grow{margin-left:0}.mf .grow .btn{flex:1;height:44px}.mf .est{order:2;width:100%}}
.steps{display:flex;align-items:center;margin-bottom:18px}
.step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.step .n{width:22px;height:22px;border-radius:999px;border:1px solid var(--rule2);display:grid;place-items:center;font-size:11px;background:#fff;font-family:"JetBrains Mono",monospace}
.step.done .n{background:var(--ink);color:#fff;border-color:var(--ink)}
.step.cur{color:var(--ink)}.step.cur .n{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent10)}
.conn{flex:1;height:1px;background:var(--rule2);margin:0 10px}
.steps.compact{display:none}
@media (max-width:640px){.steps{display:none}.steps.compact{display:block;margin-bottom:14px;font-size:12px;font-weight:600}.steps.compact .bar{height:2px;background:var(--rule);margin-top:6px}.steps.compact .bar i{display:block;height:2px;background:var(--accent)}}
.sec{border:1px solid var(--rule);border-radius:4px;background:#fff;margin-bottom:14px}
.sec.tint{background:var(--tint)}
.sec.off{background:var(--tint);opacity:.75}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule);font-size:13px;font-weight:700;letter-spacing:-.01em}
.sb{padding:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g3,.g2{grid-template-columns:1fr}}
.f label.lab{display:block;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.f .req{color:#ef4444}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:2px;background:var(--tint2);color:var(--ink2);margin-left:6px;vertical-align:middle}
.tag.acc{background:var(--accent10);color:var(--accent)}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.ferr{font-size:11px;color:var(--rd);margin-top:5px}
.segc{display:inline-flex;border:1px solid var(--rule2);border-radius:4px;overflow:hidden}
.segc button{background:#fff;border:0;padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.segc button.on{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);border-radius:4px;padding:3px 8px;font-size:12px;background:#fff}
.chip .km{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.chip button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:0;line-height:1}
.opts{border:1px solid var(--rule2);border-radius:4px;background:#fff;margin-top:4px;max-height:180px;overflow:auto}
.opt{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:12.5px}
.opt:hover{background:var(--tint)}.opt .km{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.opt.sel{background:var(--accent10)}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-left:2px solid var(--accent);border-radius:0 4px 4px 0;padding:10px 12px;font-size:12.5px;background:var(--accent10);margin:10px 0}
.banner.warn{border-left-color:var(--am);background:var(--am10)}.banner.err{border-left-color:var(--rd);background:var(--rd10)}
.banner .grow{margin-left:auto}
.stops{display:grid;grid-template-columns:24px 1fr 1fr 150px;gap:8px 10px;align-items:center}
.stops .h{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stops .n{width:22px;height:22px;border-radius:999px;background:var(--tint2);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:"JetBrains Mono",monospace}
@media (max-width:640px){.stops{grid-template-columns:24px 1fr}.stops .h.x{display:none}}
.map{height:150px;border:1px solid var(--rule);border-radius:4px;background:linear-gradient(0deg,rgba(23,23,23,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(23,23,23,.03) 1px,transparent 1px);background-size:24px 24px;position:relative;margin-top:12px;overflow:hidden}
.map svg{width:100%;height:100%}
@media (max-width:640px){.map{height:120px}}
.kv{display:grid;grid-template-columns:1fr auto;row-gap:8px;font-size:13px}
.kv .k{color:var(--ink2)}.kv .k small{color:var(--muted);font-size:11.5px;margin-left:6px}.kv .v{text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{border:1px solid var(--rule);border-radius:4px;padding:12px 14px;background:#fff}
.tile .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:6px}
.tile .a{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
.total .a{font-size:28px;font-weight:800;letter-spacing:-.02em}
.rv{border-bottom:1px solid var(--rule);padding:12px 0}
.rv:last-child{border-bottom:0}
.rv .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rv .rh b{font-size:14px;letter-spacing:-.01em}
.rider{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
.rider .av{width:32px;height:32px;border-radius:999px;background:var(--tint2);display:grid;place-items:center;font-weight:700;font-size:12px}
/* panel */
.panelwrap{position:fixed;inset:0;z-index:45;display:flex;justify-content:flex-end;background:rgba(23,23,23,.25)}
.panel{width:500px;max-width:100%;height:100%;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ph{padding:14px 20px;border-bottom:1px solid var(--rule)}
.ph .l1{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;flex-wrap:wrap}
.ph .l2{font-size:12px;color:var(--muted);margin-top:4px}
.ph .x{margin-left:auto;background:transparent;border:0;font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:4px}
.pb{padding:4px 20px;overflow:auto;flex:1}
.pb section{padding:14px 0;border-bottom:1px solid var(--rule)}.pb section:last-child{border-bottom:0}
.pb h4{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:-.01em}
.pf{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.pf .grow{margin-left:auto;display:flex;gap:8px}
@media (max-width:640px){.pf{flex-direction:column-reverse;align-items:stretch}.pf .grow{margin-left:0}.pf .btn{height:44px;flex:1}}
.stop{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;font-size:13px}
.stop .n{width:22px;height:22px;border-radius:999px;background:var(--tint2);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:"JetBrains Mono",monospace}
.stop .ad{color:var(--muted);font-size:12px}
.hist{font-size:12px;color:var(--ink2);display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.skel{height:14px;border-radius:3px;background:linear-gradient(90deg,var(--tint),var(--tint2),var(--tint));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
/* toast */
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#1d1b24;color:#fff;border-radius:6px;padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:420px}
.toast.err{background:var(--rd)}
.toast a{color:#d9c9ff;font-weight:600;text-decoration:none}
.toast .mono{opacity:.9}
.spin2{width:14px;height:14px;border:2px solid var(--rule2);border-top-color:var(--ink);border-radius:999px;animation:s .8s linear infinite;display:inline-block;vertical-align:middle}
a.lnk{color:var(--accent);font-weight:600;text-decoration:none}
/* autoplay narrator + highlight */
.runbtn{width:100%;height:40px;justify-content:center;font-size:13px;margin-bottom:12px}
.runrow{display:flex;gap:8px;margin-bottom:12px}.runrow .btn{flex:1;justify-content:center}
.todo{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;color:var(--ink2);align-items:start}
.todo li .m{width:16px;height:16px;border-radius:999px;border:1px solid var(--rule2);display:grid;place-items:center;font-size:9px;margin-top:2px;font-family:"JetBrains Mono",monospace}
.todo li.done .m{background:var(--ink);color:#fff;border-color:var(--ink)}
.todo li.cur{color:var(--ink);font-weight:600}.todo li.cur .m{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent10)}
#narr{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;width:min(560px,calc(100% - 32px));background:#1d1b24;color:#e9e6f0;border-radius:6px;box-shadow:0 12px 40px -12px rgba(0,0,0,.5);padding:12px 14px 12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
@media (min-width:901px){body.flowmode #narr{left:calc(50% + 160px)}}
#narr .k{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#b195ea;font-weight:600}
#narr .a{font-size:14px;font-weight:600;line-height:1.35;margin-top:2px}
#narr .dots{display:flex;gap:4px;margin-top:8px}#narr .dots i{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}#narr .dots i.on{background:#b195ea}#narr .dots i.done{background:rgba(177,149,234,.55)}
#narr .ctl{display:flex;flex-direction:column;gap:6px}
#narr .ctl button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#e9e6f0;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap}
#narr .ctl button.pri{background:#e9e6f0;color:#1d1b24;border-color:#e9e6f0}
.hl{outline:2px solid var(--accent) !important;outline-offset:3px;box-shadow:0 0 0 7px rgba(94,42,172,.14) !important;border-radius:4px;transition:box-shadow .3s}
</style>
</head>
<body>

<div class="simbar" id="simbar"></div>
<div class="shell" id="shell">
  <aside class="rail" id="rail" hidden></aside>
  <main class="page" id="page"></main>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>
<div id="narr" role="status" aria-live="polite" hidden></div>

<script>
const MODE = 'flow'; // 'free' | 'flow'

/* money formula — mirrors UjpCostService (server). The prototype "server" runs this after a simulated round trip. */
function calc(f){
  const km=+f.km||0, price=+f.price||0;
  const baseline=f.vehicleEnergy==='EV'?(f.konsumsi>0?1/f.konsumsi:0):(+f.baseline||0);
  const kmM=km/0.95;
  const liters=baseline>0?Math.round((kmM/baseline)*10)/10:0;
  const computed=Math.round(liters*price);
  const bbm=f.overrideBbm!=null?+f.overrideBbm:computed;
  const c=f.costs;
  const flazz=bbm+(+c.toll||0)+(+c.parkirTap||0);
  const manual=(+c.parkirManual||0)+(+c.bongkar||0)+(+c.lain||0)+(+c.makan||0);
  let F,T;
  if(f.payee==='subcon'){F=0;T=+f.nominalTransfer||0}
  else if(f.eMoney==='Tidak'){F=0;T=flazz+manual}
  else{F=flazz;T=manual}
  const complete=f.payee==='subcon'?(+f.nominalTransfer>0):(km>0&&baseline>0&&price>0);
  return {kmM,liters,computed,bbm,flazz,manual,F,T,total:F+T,complete,baseline};
}

function blankForm(){return{clientId:null,deliveryDate:iso(daysAgo(-1)),opsTeam:'Ops Patimban',serviceType:'Trucking 4W',deliveryType:'SINGLE_DROP',shift:'Morning',jamMulai:'07:00',jamSelesai:'15:00',

    const u={id:uid(),ref,status:o.status,form:f,totals:t,createdAt:created,requester:o.requester||USERS.ops.email,client:CLIENTS.find(c=>c.id===f.clientId),rider:r,history:[{at:created,by:o.requester||USERS.ops.email,from:null,to:'SUBMITTED'}],shipmentId:null,reason:null,note:null,decidedBy:null,decidedAt:null};
    if(o.status==='APPROVED'){const sh=mkShipment(u,st);u.shipmentId=sh.id;u.decidedBy=USERS.finance.email;u.decidedAt=created+3.6e6;u.history.push({at:u.decidedAt,by:u.decidedBy,from:'SUBMITTED',to:'APPROVED',note:`Shipment ${sh.waybill} dibuat`})}
    if(o.status==='REJECTED'){u.decidedBy=USERS.finance.email;u.decidedAt=created+7.2e6;u.reason=o.reason;u.note=o.note;u.history.push({at:u.decidedAt,by:u.decidedBy,from:'SUBMITTED',to:'REJECTED',note:`${REASONS.find(r=>r.code===o.reason).label}${o.note?' · '+o.note:''}`})}
    st.ujps.push(u);return u};
  const d=(n,h)=>{const x=daysAgo(n);x.setHours(h,12,0,0);return x.getTime()};
  mk({ref:`UJP-${ymd(daysAgo(0))}-0003`,status:'SUBMITTED',created:NOW-62*60e3,form:{clientId:566,laneIds:['l2'],vehicleId:'v2',plate:'B 9877 KLA',unitType:'Fuso Tronton',baseline:3.2,price:6800,costs:{toll:210000,parkirTap:20000,parkirManual:25000,bongkar:200000,lain:0,makan:75000},riderId:'r2'}});
  mk({ref:`UJP-${ymd(daysAgo(3))}-0002`,status:'SUBMITTED',created:d(3,9),form:{clientId:412,laneIds:['l5'],vehicleId:'v1',plate:'B 9021 UYT',unitType:'Colt Diesel Engkel',baseline:4.5,price:6800,costs:{toll:95000,parkirTap:10000,parkirManual:20000,bongkar:150000,lain:0,makan:75000},riderId:'r3',deliveryDate:iso(daysAgo(-2))}});
  mk({ref:`UJP-${ymd(daysAgo(3))}-0001`,status:'APPROVED',created:d(3,8),form:{clientId:566,laneIds:['l3'],vehicleId:'v1',plate:'B 9021 UYT',unitType:'Colt Diesel Engkel',baseline:4.5,price:6800,costs:{toll:185000,parkirTap:20000,parkirManual:30000,bongkar:150000,lain:0,makan:75000},riderId:'r1',deliveryDate:iso(daysAgo(1))}});
  mk({ref:`UJP-${ymd(daysAgo(4))}-0004`,status:'REJECTED',created:d(4,14),reason:'BIAYA_TIDAK_WAJAR',note:'Toll Rp 900.000 untuk rute ini terlalu tinggi.',form:{clientId:388,laneIds:['l7'],vehicleId:'v4',plate:'D 8811 GHT',unitType:'Colt Diesel Double',baseline:4.0,price:6800,costs:{toll:900000,parkirTap:20000,parkirManual:30000,bongkar:150000,lain:50000,makan:75000},justif:'Biaya tambahan tambat',riderId:'r4',deliveryDate:iso(daysAgo(2))}});

}
function mkShipment(u,st){const c=u.client;const sh={id:uid(),waybill:`DL${c.code}${ymd(new Date()).slice(2)}${rnd(7)}`,routeCode:`RTE${ymd(new Date())}${rnd(5,'0123456789')}`,ujpId:u.id,bookingId:u.ref,status:'CREATED'};(st||S).shipments.push(sh);return sh}
function nextRef(){const k=ymd(new Date());S.counter[k]=(S.counter[k]||0)+1;return `UJP-${k}-${pad(S.counter[k],4)}`}
function applyLanes(f){const ls=f.laneIds.map(id=>LANES.find(l=>l.id===id)).filter(Boolean);if(!ls.length){if(!f.stopsManual){f.stops=[];f.distanceCalc=0;if(!f.kmTouched)f.km=0}return}
  if(!f.stopsManual){const o=ls[0].o;f.stops=[{type:'PICKUP',name:o.name,addr:o.addr,lat:o.lat,lng:o.lng},...ls.map(l=>({type:'DROP_OFF',intent:'UNLOAD',name:l.d.name,addr:l.d.addr,lat:l.d.lat,lng:l.d.lng}))]}
  f.distanceCalc=Math.round(ls.reduce((a,l)=>a+l.m,0)/100)/10;if(!f.kmTouched)f.km=f.distanceCalc}
function applyVehicle(f,v){f.vehicleId=v.id;f.plate=v.plate;f.unitType=v.unit;f.vehicleEnergy=v.energy;if(v.energy==='EV'){f.konsumsi=v.konsumsi;f.baseline=0}else{f.baseline=v.baseline;f.konsumsi=0}f.price=v.price;f.baselineTouched=false;f.priceTouched=false}
function applyRider(f,r){f.riderId=r.id;f.riderQuery=r.name;if(f.payee==='driver')f.bank={...r.bank}}

/* estimate: debounce 300ms → simulated server (latency, optional failure) → seq check */
function scheduleEstimate(){clearTimeout(estTimer);const f=S.ui.wizard;const c=calc(f);if(!c.complete){est={status:'idle',lastGood:null,at:0};renderEstimate();return}
  est.status=est.lastGood?'stale':'pending';renderEstimate();estTimer=setTimeout(fireEstimate,300)}
function fireEstimate(){const seq=++estSeq;const f=S.ui.wizard;const snapshot=JSON.parse(JSON.stringify(f));setTimeout(()=>{if(seq!==estSeq||!S.ui.wizard)return;if(S.sim.fail){est.status='error';renderEstimate();return}est.lastGood=calc(snapshot);est.status='ok';est.at=Date.now();renderEstimate()},S.sim.latency)}
function estimateNow(){const f=S.ui.wizard;const c=calc(f);est=c.complete?{status:'ok',lastGood:c,at:Date.now()}:{status:'idle',lastGood:null,at:0}}

   <div class="pager"><span>Menampilkan 1–${rows.length} dari ${rows.length}</span><span>‹ 1 ›</span></div>`
  :`<div class="empty">${u.search||u.client?`<b>Tidak ada UJP untuk “${esc(u.search||CLIENTS.find(c=>c.id===+u.client)?.name)}”</b>Coba kata kunci lain.<div style="margin-top:12px"><button type="button" class="btn ghost" id="clr">Hapus filter</button></div>`:`<b>Belum ada pengajuan UJP</b>Pengajuan yang menunggu persetujuan akan muncul di sini.<div style="margin-top:12px"><button type="button" class="btn primary" id="new2">+ Buat UJP</button></div>`}</div>`}`;

function openWizard(prefill){S.ui.wizard=Object.assign(blankForm(),prefill||{});S.ui.detailId=null;est={status:'idle'};renderAll()}
function closeWizard(){S.ui.wizard=null;renderAll()}
function fieldErr(k){const f=S.ui.wizard;return f.errors[k]?`<div class="ferr">${esc(f.errors[k])}</div>`:''}
function validate(step){const f=S.ui.wizard;const e={};
  if(step===1){if(!f.clientId)e.clientId='Pilih client';if(!f.deliveryDate||f.deliveryDate<iso(new Date()))e.deliveryDate='Tanggal kirim tidak boleh sebelum hari ini (WIB)';if(!f.shift)e.shift='Pilih shift'}
  if(step===2){if(f.stops.filter(s=>s.type==='PICKUP').length<1||f.stops.filter(s=>s.type==='DROP_OFF').length<1)e.stops='Butuh 1 pickup dan minimal 1 drop';if(f.stops.some(s=>!s.name||!s.addr))e.stops='Nama dan alamat stop wajib diisi';if(!(+f.km>0))e.km='KM diajukan wajib > 0'}
  if(step===3){if(!f.plate)e.plate='Pilih atau isi plat nomor';if(f.payee==='driver'){const c=calc(f);if(!(c.baseline>0))e.baseline='Baseline wajib > 0';if(!(+f.price>0))e.price='Harga energi wajib > 0';if(+f.costs.lain>0&&!f.justif.trim())e.justif='Wajib diisi bila biaya lain-lain > 0'}else{if(!(+f.nominalTransfer>0))e.nominalTransfer='Nominal transfer wajib > 0'}}
  if(step===4){if(!f.riderId)e.rider='Pilih driver';if(!f.bank.name||!f.bank.acct||!f.bank.holder)e.bank='Bank, nomor rekening dan atas nama wajib diisi'}
  f.errors=e;return !Object.keys(e).length}
function renderWizard(){const f=S.ui.wizard;if(!f){return ''}const step=f.step;
  const stepsHtml=`<div class="steps" aria-label="Langkah">${STEPS.map((s,i)=>`<div class="step ${step>i+1?'done':step===i+1?'cur':''}" ${step===i+1?'aria-current="step"':''}><span class="n">${step>i+1?'✓':i+1}</span>${s}</div>${i<STEPS.length-1?'<div class="conn"></div>':''}`).join('')}</div>

function mapSvg(stops){if(!stops.length)return '';const xs=stops.map(s=>s.lng),ys=stops.map(s=>s.lat);const mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys);const px=v=>40+((Mx-mx?(v-mx)/(Mx-mx):.5))*(600-80);const py=v=>25+(1-((My-my?(v-my)/(My-my):.5)))*(150-50);
  return `<svg viewBox="0 0 600 150"><polyline fill="none" stroke="#5E2AAC" stroke-width="2" stroke-dasharray="4 4" points="${stops.map(s=>`${px(s.lng)},${py(s.lat)}`).join(' ')}"/>${stops.map((s,i)=>`<g><circle cx="${px(s.lng)}" cy="${py(s.lat)}" r="9" fill="${i?'#171717':'#047857'}"/><text x="${px(s.lng)}" y="${py(s.lat)+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="JetBrains Mono,monospace">${i+1}</text><text x="${px(s.lng)}" y="${py(s.lat)+24}" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Plus Jakarta Sans,sans-serif">${esc(s.name)}</text></g>`).join('')}</svg>`}

   <div class="mb"><div class="f"><label class="lab" for="rsn">Alasan <span class="req">*</span></label><div class="inp"><select id="rsn"><option value="">Pilih alasan</option>${REASONS.map(r=>`<option value="${r.code}" ${d.reason===r.code?'selected':''}>${r.label}</option>`).join('')}</select></div><div class="hint">Dari master alasan (type UJP_REJECTION).</div></div>
    <div class="f" style="margin-top:12px"><label class="lab" for="nt">Catatan ${rs?.note?'<span class="req">*</span>':'(opsional)'}</label><textarea id="nt" rows="3" style="width:100%;border:1px solid #d1d5db;border-radius:4px;padding:8px 10px;resize:vertical" placeholder="Apa yang harus diperbaiki requester?">${esc(d.note)}</textarea>${needNote?'<div class="ferr">Alasan “Lainnya” wajib disertai catatan.</div>':''}</div></div>
   <div class="mf"><div class="grow"><button type="button" class="btn" id="dno">Batal</button><button type="button" class="btn danger" id="dyes" ${!d.reason||needNote?'disabled':''}>Tolak UJP</button></div></div></div></div>`}
function bindDecision(){const d=S.ui.decision;if(!d)return;const u=S.ujps.find(x=>x.id===d.id);$('#dno').onclick=()=>{S.ui.decision=null;renderAll()};
  if(d.mode==='cancel'){$('#dyes').onclick=()=>{u.status='CANCELLED';u.history.push({at:Date.now(),by:u.requester,from:'SUBMITTED',to:'CANCELLED'});S.ui.decision=null;renderAll();toast('Pengajuan dibatalkan')};return}
  $('#rsn').onchange=e=>{d.reason=e.target.value;renderAll()};$('#nt').oninput=e=>{d.note=e.target.value;const rs=REASONS.find(r=>r.code===d.reason);$('#dyes').disabled=!d.reason||(rs?.note&&!d.note.trim())};
  $('#dyes').onclick=()=>decide(u,'rejected',d.reason,d.note.trim())}

/* ───────────────────────── flow rail ───────────────────────── */
const SCENES=[
 {t:'Antrian UJP',c:'Ops opens the queue. The default tab is Menunggu with counts, and each waiting request shows its age so finance sees what is oldest. Nothing about the old app\'s CSV round-trip remains.',dd:['DD6','D12'],
  do:[{t:'Buka menu Logistic · UJP. Tab Menunggu terpilih otomatis dengan jumlah antrian.',hl:'.tabs button.on'},{t:'Chip umur menandai yang lama: amber lebih dari 2 hari, merah lebih dari 5.',hl:'td .badge.b-am'},{t:'Klik Buat UJP untuk mulai mengajukan.',hl:'#new'}],
  run:s=>{s.persona='ops';s.ui.tab='SUBMITTED'}},
 {t:'Langkah 1 · Info',c:'Buat UJP opens a 5-step FormModal. The reference number is a placeholder: the server assigns UJP-YYYYMMDD-NNNN from a daily counter when the request is submitted, so numbering is sequential and collision-free.',dd:['DD2','D4'],
  do:[{t:'Client: PT Patimban Logistik.',hl:'#cl'},{t:'Tanggal kirim: besok. Tanggal sebelum hari ini (WIB) ditolak.',hl:'#dd'},{t:'Tipe pengiriman: Multi drop, karena ada dua tujuan.',hl:'[data-dt="MULTI_DROP"]'},{t:'Shift Morning, jam 07:00–15:00. Tim ops dan layanan pakai nilai bawaan.',hl:'#sh'},{t:'Nomor UJP masih ····: server yang menetapkan saat diajukan.',hl:'.mh .ref'}],
  run:s=>{s.ui.wizard=Object.assign(blankForm(),{clientId:566,deliveryType:'MULTI_DROP',shift:'Morning',step:1})}},
 {t:'Langkah 2 · Rute',c:'Lanes come read-only from the Addresses page. Two lanes sharing the same origin become one pickup and two drops; the lane distances add up to an editable km estimate. Money will use the proposed km, never the lane sum blindly.',dd:['DD10','D16','D17'],
  do:[{t:'Cari lane client, pilih Patimban Port → Gudang Karawang (141,2 km).',hl:'#lq'},{t:'Tambah lane kedua dengan origin sama: Patimban Port → Gudang Cikarang (128,4 km).',hl:'.chips'},{t:'Stops terisi otomatis: 1 pickup, 2 drop, workflow default per stop. Nama dan alamat bisa disunting.',hl:'.stops'},{t:'Jarak lane (estimasi) 269,6 km mengisi KM diajukan. Angka ini yang dipakai untuk BBM; sesuaikan bila rute berantai.',hl:'#km'}],
  run:s=>{const f=s.ui.wizard;f.step=2;f.laneIds=['l1','l2'];applyLanes(f)}},
 {t:'Langkah 3 · Biaya',c:'Pick a plate and baseline plus fuel price fill in from the vehicle master, locked until edited. Type the cost lines and the server-computed breakdown appears: km with margin, litres, BBM, then the Flazz and Transfer split. The browser never does money math.',dd:['DD1','DD8','D5','D7'],
  do:[{t:'Payee: Driver internal.',hl:'[data-py="driver"]'},{t:'Plat nomor: B 9021 UYT. Baseline 4,5 km/L dan harga BBM Rp 6.800 terisi dari kendaraan, terkunci sampai diubah.',hl:'#plate'},{t:'E-money: Ya, jadi BBM, toll dan parkir tap masuk kartu Flazz.',hl:'#em'},{t:'Toll Rp 185.000 · parkir tap Rp 20.000 · parkir manual Rp 30.000.',hl:'#c_toll'},{t:'Bongkar/muat Rp 150.000 · uang makan Rp 75.000 · lain-lain 0.',hl:'#c_bongkar'},{t:'Rincian estimasi dihitung server: 269,6 km ÷ 0,95 → liter → BBM → Flazz / Transfer.',hl:'#breakdown'}],
  run:s=>{const f=s.ui.wizard;f.step=3;applyVehicle(f,VEHICLES[0]);f.costs={toll:185000,parkirTap:20000,parkirManual:30000,bongkar:150000,lain:0,makan:75000};estimateNow()}},
 {t:'Biaya · jika subcon',c:'Flip the payee to Subcon and the seven cost fields are disabled in place with the reason on screen. Nothing typed is lost. The whole nominal goes to Transfer and Flazz reads zero.',dd:['DD9'],
  do:[{t:'Ubah payee ke Subcon.',hl:'[data-py="subcon"]'},{t:'Isi Nominal transfer Rp 1.800.000. Seluruhnya masuk uang jalan Transfer.',hl:'#nom'},{t:'Blok biaya driver dinonaktifkan di tempat dengan alasannya. Nilai yang sudah diketik tidak hilang.',hl:'.sec.off'}],
  run:s=>{const f=s.ui.wizard;f.payee='subcon';f.nominalTransfer=1800000;estimateNow()}},
 {t:'Langkah 4 · Driver',c:'Back to a driver payee. The rider picker searches active DRIVER talent only and auto-selects on a unique match; bank details prefill from the driver record. The footer strip keeps the total in view on this step.',dd:['DD1','D8'],
  do:[{t:'Kembalikan payee ke Driver internal, lalu Lanjut ke langkah Driver.'},{t:'Ketik nama driver: "Agus Setiawan" cocok unik, jadi terpilih otomatis.',hl:'#rq'},{t:'Rekening driver terisi dari data driver: BCA · 8290112344 · Agus Setiawan.',hl:'#ba'},{t:'Detail pengiriman opsional: 1 × 40ft FCL, 18.500 kg.',hl:'#ci'},{t:'Strip estimasi total tetap terlihat di footer.',hl:'#strip'}],
  run:s=>{const f=s.ui.wizard;f.payee='driver';f.step=4;applyRider(f,RIDERS[0]);f.cargo={sender:'PT Patimban Logistik',receiver:'Gudang Karawang',item:'1 × 40ft FCL',bobot:'18500'};estimateNow()}},
 {t:'Langkah 5 · Review',c:'Hairline sections with an Ubah link back to each step, one tile row, and the total at 28px. Ajukan stays disabled until the server confirms the latest estimate.',dd:['DD7','D13'],
  do:[{t:'Periksa tiap bagian. Tombol Ubah kembali ke langkahnya tanpa kehilangan isian.',hl:'[data-go="2"]'},{t:'Satu baris tile Flazz / Transfer dan total besar.',hl:'#rvtiles'},{t:'Ajukan UJP aktif setelah server mengonfirmasi estimasi terbaru.',hl:'#submit'}],
  run:s=>{const f=s.ui.wizard;f.step=5;estimateNow()}},
 {t:'Diajukan',c:'Submit closes the modal, the queue gains a row, and the detail panel opens on it. The requester sees Menunggu persetujuan finance and a Batalkan pengajuan action, nothing else.',dd:['DD6','D2'],
  do:[{t:'Klik Ajukan UJP. Server memberi nomor UJP-…-0004 dan menghitung ulang total.'},{t:'Modal tertutup; baris baru muncul di tab Menunggu.',hl:'tr.row.sel'},{t:'Panel detail terbuka. Requester melihat "Menunggu persetujuan finance" dan hanya tombol Batalkan pengajuan.',hl:'#pcancel'}],
  run:s=>{const f=s.ui.wizard;const snap=JSON.parse(JSON.stringify(f));const u={id:'scene-u',ref:`UJP-${ymd(new Date())}-0004`,status:'SUBMITTED',form:snap,totals:calc(snap),createdAt:NOW-2*60e3,requester:USERS.ops.email,client:CLIENTS[0],rider:RIDERS[0],history:[{at:NOW-2*60e3,by:USERS.ops.email,from:null,to:'SUBMITTED'}],shipmentId:null};s.ujps.push(u);s.ui.wizard=null;s.ui.detailId=u.id;s.ui.tab='SUBMITTED'}},
 {t:'Finance membuka panel',c:'Same request, approver persona. Money first, then the shipment that approval will create, then the breakdown and the full account number with Salin. The primary button says exactly what it does.',dd:['DD3','DD5','D6'],
  do:[{t:'Ganti persona ke Finance (approver) di bar atas.',hl:'.simbar .seg button.on'},{t:'Uang jalan dulu: tile Flazz / Transfer dan total.',hl:'.pb section:first-child'},{t:'"Dibuat saat disetujui": preview shipment, stops dan driver yang akan dibuat.',hl:'.badge.b-sky'},{t:'Rekening lengkap dengan tombol Salin. Tombol utama: Setujui & buat shipment.',hl:'#papprove'}],
  run:s=>{s.persona='finance'}},
 {t:'Disetujui → shipment',c:'Approve runs one transaction: lock the row, write history, create shipment, route and stops through the shared 4W writer, link shipment_id. The panel refetches and the preview row becomes a waybill link the driver app can already see.',dd:['D2','D3','D9'],
  do:[{t:'Klik Setujui & buat shipment. Satu transaksi: kunci baris, riwayat, shipment + rute + stops.'},{t:'Badge menjadi Disetujui; preview berubah jadi link waybill yang sudah terlihat di aplikasi driver.',hl:'.pb section:nth-child(2)'},{t:'Riwayat mencatat approver dan nomor waybill.',hl:'.hist'}],
  run:s=>{const u=s.ujps.find(x=>x.id==='scene-u');const sh=mkShipment(u,s);u.shipmentId=sh.id;u.status='APPROVED';u.decidedBy=USERS.finance.email;u.decidedAt=NOW;u.history.push({at:NOW,by:USERS.finance.email,from:'SUBMITTED',to:'APPROVED',note:`Shipment ${sh.waybill} dibuat`});s.ui.tab='APPROVED'}},
 {t:'Jalur tolak',c:'On another waiting request, Tolak opens a small danger modal. A reason from the UJP_REJECTION master is required, including route and driver disagreement, so the approver never has to reject a correct cost to object to the trip.',dd:['DD3','D9'],
  do:[{t:'Masih sebagai Finance, buka UJP lain yang menunggu, lalu klik Tolak.'},{t:'Pilih alasan dari master UJP_REJECTION: "Rute tidak sesuai".',hl:'#rsn'},{t:'Tulis catatan untuk requester: apa yang harus diperbaiki.',hl:'#nt'},{t:'Tombol Tolak UJP aktif hanya setelah alasan dipilih.',hl:'#dyes'}],
  run:s=>{const u=s.ujps.find(x=>x.status==='SUBMITTED'&&x.id!=='scene-u');s.ui.tab='SUBMITTED';s.ui.detailId=u.id;s.ui.decision={id:u.id,mode:'reject',reason:'RUTE_TIDAK_SESUAI',note:'Drop kedua tidak ada di surat jalan.'}}},
 {t:'Pengguna lain',c:'Any other ops user can open the approved request but sees the account number masked to its last four digits with a lock, and the total hidden. Enforced in the server response mapper, so no client change can leak it.',dd:['DD5','D15'],
  do:[{t:'Ganti persona ke Ops lain dan buka UJP yang sudah disetujui.',hl:'.simbar .seg button.on'},{t:'No. rekening tersamar •••• 4456 dengan ikon kunci; total disembunyikan.',hl:'.pb section:nth-child(4)'},{t:'Tidak ada tombol aksi: hanya approver yang memutuskan, hanya requester yang membatalkan.',hl:'.pf'}],
  run:s=>{s.persona='other';s.ui.decision=null;s.ui.tab='APPROVED';s.ui.detailId='scene-u'}},
];
let scene=0;
const auto={on:false,paused:false,k:0,i:0,t:null,done:false};
const ACT_MS=2600, SCENE_GAP_MS=1100;
function applyScene(i){scene=Math.max(0,Math.min(SCENES.length-1,i));S=seed();est={status:'idle'};for(let k=0;k<=scene;k++)SCENES[k].run(S);if(S.ui.wizard)estimateNow();renderAll()}
function highlight(sel){document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));if(!sel)return;const el=document.querySelector(sel);if(el){el.classList.add('hl');try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}}}
function autoStart(){clearTimeout(auto.t);Object.assign(auto,{on:true,paused:false,k:0,i:0,done:false});applyScene(0);autoTick()}
function autoTick(){if(!auto.on||auto.paused)return;const sc=SCENES[auto.k];const acts=sc.do||[];
  if(auto.i<acts.length){renderNarr();renderRail();highlight(acts[auto.i].hl);auto.t=setTimeout(()=>{auto.i++;autoTick()},ACT_MS)}
  else{auto.t=setTimeout(()=>{if(auto.k<SCENES.length-1){auto.k++;auto.i=0;applyScene(auto.k);autoTick()}else{auto.on=false;auto.done=true;highlight(null);renderNarr();renderRail()}},SCENE_GAP_MS)}}
function autoPause(){if(!auto.on)return;auto.paused=!auto.paused;clearTimeout(auto.t);if(!auto.paused)autoTick();else{renderNarr();renderRail()}}
function autoStop(){clearTimeout(auto.t);auto.on=false;auto.paused=false;auto.done=false;highlight(null);renderNarr();renderRail()}
function renderNarr(){const n=$('#narr');if(!n)return;if(!auto.on&&!auto.done){n.hidden=true;return}n.hidden=false;
  if(auto.done){n.innerHTML=`<div><div class="k">Selesai · 12 adegan</div><div class="a">Alur lengkap: ops mengajukan, finance menyetujui, shipment DIRECT_4W dibuat. Layar sekarang bebas dicoba.</div></div><div class="ctl"><button type="button" class="pri" id="nAgain">↻ Ulangi alur</button><button type="button" id="nClose">Tutup</button></div>`;
    $('#nAgain').onclick=autoStart;$('#nClose').onclick=autoStop;return}
  const sc=SCENES[auto.k];const acts=sc.do||[];const a=acts[Math.min(auto.i,acts.length-1)];
  n.innerHTML=`<div><div class="k">Adegan ${auto.k+1}/${SCENES.length} · ${esc(sc.t)}${auto.paused?' · jeda':''}</div><div class="a">${esc(a?.t||'')}</div><div class="dots" aria-hidden="true">${acts.map((_,j)=>`<i class="${j<auto.i?'done':j===auto.i?'on':''}"></i>`).join('')}</div></div>
   <div class="ctl"><button type="button" class="pri" id="nPause">${auto.paused?'▶ Lanjutkan':'⏸ Jeda'}</button><button type="button" id="nStop">■ Berhenti</button></div>`;
  $('#nPause').onclick=autoPause;$('#nStop').onclick=autoStop}
function renderRail(){if(MODE!=='flow'){$('#rail').hidden=true;$('#shell').classList.remove('flow');document.body.classList.remove('flowmode');return}$('#rail').hidden=false;$('#shell').classList.add('flow');document.body.classList.add('flowmode');const sc=SCENES[scene];const acts=sc.do||[];const running=auto.on;
  $('#rail').innerHTML=`<h2>Alur Buat UJP</h2><div class="sub">Satu klik menjalankan seluruh alur: ops mengajukan, finance menyetujui, shipment dibuat. Narasi menjelaskan apa yang diisi di tiap langkah.</div>
  ${running?`<div class="runrow"><button type="button" class="btn primary" id="rPause">${auto.paused?'▶ Lanjutkan':'⏸ Jeda'}</button><button type="button" class="btn" id="rStop">■ Berhenti</button></div>`:`<button type="button" class="btn primary runbtn" id="run">▶ Jalankan alur (1 klik)</button>`}
  <ol class="scenes">${SCENES.map((s,i)=>`<li><button type="button" class="${i===scene?'on':''}" data-s="${i}"><span class="n">${pad(i+1,2)}</span>${s.t}</button></li>`).join('')}</ol>
  <div class="cap"><div class="k">Yang dilakukan</div><ol class="todo">${acts.map((a,j)=>{const st=running&&auto.k===scene?(j<auto.i?'done':j===auto.i?'cur':''):'';return `<li class="${st}"><span class="m">${st==='done'?'✓':j+1}</span><span>${esc(a.t)}</span></li>`}).join('')}</ol>
   <div class="k" style="margin-top:14px">Mengapa begini</div><p>${sc.c}</p><div class="dd">${sc.dd.map(d=>`<span class="badge b-ne mono" style="font-size:10px">${d}</span>`).join('')}</div></div>
  <div class="nav"><button type="button" class="btn" id="prev" ${scene===0?'disabled':''}>‹ Sebelumnya</button><button type="button" class="btn ${running?'':'primary'}" id="nxt" ${scene===SCENES.length-1?'disabled':''}>Berikutnya ›</button></div>
  <div class="hint" style="margin-top:12px">Panah ← → di keyboard juga berfungsi. Setiap adegan tetap bisa dicoba langsung; persona dan latensi di bar atas mengubah adegan yang sama.</div>`;
  const run=$('#run');if(run)run.onclick=autoStart;const rp=$('#rPause');if(rp)rp.onclick=autoPause;const rs=$('#rStop');if(rs)rs.onclick=autoStop;
  $('#rail').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{autoStop();applyScene(+b.dataset.s)});$('#prev').onclick=()=>{autoStop();applyScene(scene-1)};$('#nxt').onclick=()=>{autoStop();applyScene(scene+1)}}

/* ───────────────────────── root ───────────────────────── */
function renderAll(){renderSim();renderRail();renderPage();$('#layer').innerHTML=renderPanel()+renderWizard()+renderDecision();bindPanel();bindWizard();bindDecision();
  const first=document.querySelector('#wzb .err input,#wzb .err select');if(first&&document.activeElement===document.body)first.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.ui.decision){S.ui.decision=null;renderAll()}else if(S.ui.wizard&&S.ui.busy!=='submit'){closeWizard()}else if(S.ui.detailId){S.ui.detailId=null;renderAll()}}
  if(MODE==='flow'&&!e.target.matches('input,select,textarea')){if(e.key==='ArrowRight'){autoStop();applyScene(scene+1)}if(e.key==='ArrowLeft'){autoStop();applyScene(scene-1)}if(e.key===' '&&auto.on){e.preventDefault();autoPause()}}});
S=seed();if(MODE==='flow')applyScene(0);else renderAll();
</script>
